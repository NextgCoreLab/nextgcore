[package]
name = "nextgcore-pcfd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore PCF (Policy Control Function)"

[[bin]]
name = "nextgcore-pcfd"
path = "src/main.rs"

# Wave-6 H1 lib-targetization: the PCF module tree is a library (mirroring
# nextgcore-udrd/udmd) so strict-peer integration tests can use the real
# PcfBinding body builder / client functions in-process.
[lib]
name = "nextgcore_pcfd"
path = "src/lib.rs"

[features]
## Issue #24: intent-driven closed-loop policy spike (non-normative 6G /
## autonomous-networks research; no frozen Rel-20 Stage-3 exists — nearest
## anchor TS 28.312). Wires the pre-existing intent_policy scaffolding to a
## live NWDAF Nnwdaf_AnalyticsInfo poll for ONE outcome: keep slice X latency
## below N ms (pcf.intent YAML block). Off by default: the controller is
## fully compiled out of the default build and the pcf.intent block is
## ignored (only an inert raw-YAML field capture is unconditional).
## Enable with: cargo build -p nextgcore-pcfd --features intent-loop
intent-loop = []

[dependencies]
nextgcore-core = { workspace = true }
nextgcore-sbi = { workspace = true }
nextgcore-metrics = { workspace = true }
nextgcore-dbi = { workspace = true }
nextgcore-app = { workspace = true }
# Wave-6 E4: the UE-policy-delivery (UPDP) codec (TS 24.501 Annex D +
# TS 24.526 §5.2) lives in nextgcore-nas; pcfd encodes the MANAGE UE POLICY
# COMMAND it delivers over Namf N1N2 through it (item E2).
nextgcore-nas = { workspace = true }
bytes = { workspace = true }
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
serde_json.workspace = true
# Durable-state load errors (issue #66/#192); already a workspace dep via
# nextgcore-core's state_store, so no new crate enters the tree.
thiserror.workspace = true
uuid.workspace = true
clap.workspace = true
ctrlc.workspace = true

[dev-dependencies]
proptest.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }
base64.workspace = true
# WSB-1/H2 strict-peer tests: drive the REAL bsfd SBI request handler
# in-process (and over a real HTTP/2 socket) instead of a lenient mock.
nextgcore-bsfd = { path = "../nextgcore-bsfd" }
# Wave-6 E4 strict-peer tests: drive amfd's REAL N1N2MessageTransfer handler
# (`handle_n1_n2_message_transfer_request`, item E5's UPDP branch) in-process
# with pcfd's production multipart request — no lenient mock.
nextgcore-amfd = { path = "../nextgcore-amfd" }
# Wave-6 E3 strict-peer tests: round-trip the provisioning UePolicySet through
# udrd's REAL data_store (`policy_ue_put`/`policy_ue_get`, the persistence its
# ue-policy-set PUT/GET handler delegates to) — no lenient JSON mock of the UDR.
nextgcore-udrd = { path = "../nextgcore-udrd" }

[lints]
workspace = true
