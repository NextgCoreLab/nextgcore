[package]
name = "nextgcore-upfd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore UPF (User Plane Function)"

[lib]
# #2208: the UPF as a library, so other crates' tests can run it in-process.
name = "nextgcore_upfd"
path = "src/lib.rs"

[[bin]]
name = "nextgcore-upfd"
path = "src/main.rs"

[features]
## Issue #20: attach a Load Control Information IE (TS 29.244 7.4.3.2:
## Sequence Number + Metric = session-occupancy percentage from get_load())
## to UPF-initiated PFCP Heartbeat Requests so the SMF can do load/compute-
## aware UPF selection. Off by default: heartbeat wire bytes are unchanged.
## Rel-19 "Compute-Aware Networking" has no frozen Stage-3 (research knob).
## Enable with: cargo build -p nextgcore-upfd --features compute-aware-upf
compute-aware-upf = []
## #2208 (R41 on #2231): test-only items of the library (`session_metrics::
## MODE_TEST_LOCK`), for the binary's own tests and for other crates' in-process
## tests. Off in every production build.
test-support = []

[dependencies]
nextgcore-core = { workspace = true }
nextgcore-pfcp = { workspace = true }
nextgcore-gtp = { workspace = true }
nextgcore-tun = { workspace = true }
nextgcore-ipfw = { workspace = true }
nextgcore-app = { workspace = true }
nextgcore-metrics = { workspace = true }
# G2-2: NRF NFProfile registration + heartbeat /load PATCH (opt-in, off by default)
nextgcore-sbi = { workspace = true }
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
anyhow.workspace = true
libc.workspace = true
bytes.workspace = true
clap.workspace = true
ctrlc.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
# The binary's tests compile against the library: they need its test-support items.
nextgcore-upfd = { path = ".", features = ["test-support"] }

[lints]
workspace = true
