[package]
name = "nextgcore-lmfd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore LMF (Location Management Function, TS 23.273)"

[[bin]]
name = "nextgcore-lmfd"
path = "src/main.rs"

[dependencies]
nextgcore-nrppa-gen = { workspace = true }
nextgcore-lpp-gen = { workspace = true }
nextgcore-slpp-gen = { workspace = true }
# Named directly: slpp.rs bounds a helper on the generated types' UperCodec trait.
asn1-codecs = { workspace = true }
bitvec = { workspace = true }
nextgcore-core = { workspace = true }
nextgcore-sbi = { workspace = true }
nextgcore-metrics = { workspace = true }
nextgcore-app = { workspace = true }
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
anyhow.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
uuid.workspace = true
clap.workspace = true
ctrlc.workspace = true

[dev-dependencies]
# #2099: `owner_binding::seed_nf_type_for_test`, the NRF stand-in for the
# verified-NF-type rule. Dev-only.
nextgcore-sbi = { workspace = true, features = ["test-support"] }
proptest.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }
base64.workspace = true
# Wave-6 A4/H1 strict-peer test: drive amfd's REAL N1MessageNotify producer
# body-builder in-process (no lenient mock) against lmfd's real callback handler.
nextgcore-amfd = { path = "../nextgcore-amfd" }

[lints]
workspace = true
