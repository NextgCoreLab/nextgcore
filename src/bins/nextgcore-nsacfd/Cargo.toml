[package]
name = "nextgcore-nsacfd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore NSACF (Network Slice Admission Control Function, TS 23.502 4.2.9)"

[[bin]]
name = "nextgcore-nsacfd"
path = "src/main.rs"

[features]
## Issue #27: observe-only slice-SLA assurance loop (non-normative; aligns
## with TS 28.530/28.541 but is a prototype). Evaluates configured per-slice
## admission-utilization thresholds against live NSACF counters and emits
## breach metrics/log transitions. Off by default: admission behavior is
## untouched and no listener is bound unless nsacf.sla.metrics_port opts in.
## Enable with: cargo build -p nextgcore-nsacfd --features sla-observe
sla-observe = []

[dependencies]
nextgcore-core = { workspace = true }
nextgcore-sbi = { workspace = true }
nextgcore-metrics = { workspace = true }
nextgcore-app = { workspace = true }
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
serde_json.workspace = true
uuid.workspace = true
clap.workspace = true
ctrlc.workspace = true
chrono = "0.4"

[dev-dependencies]
proptest.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }
base64.workspace = true
sha2.workspace = true

[lints]
workspace = true
