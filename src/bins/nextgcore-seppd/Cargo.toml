[package]
name = "nextgcore-seppd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore SEPP (Security Edge Protection Proxy)"

[[bin]]
name = "nextgcore-seppd"
path = "src/main.rs"

[lib]
name = "nextgcore_seppd"
path = "src/lib.rs"

[dependencies]
nextgcore-core = { workspace = true }
nextgcore-sbi = { workspace = true }
nextgcore-metrics = { workspace = true }
nextgcore-app = { workspace = true }
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
aes-gcm.workspace = true
rand.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
base64.workspace = true
# Asymmetric JWS (ES256) for the modificationsBlock per TS 33.501: each
# SEPP/IPX entry is signed with its own asymmetric key, not the shared
# symmetric session key.
p256 = { workspace = true, features = ["ecdsa", "pem", "pkcs8"] }
elliptic-curve = { workspace = true, features = ["sec1", "pem"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
