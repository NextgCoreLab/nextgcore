[package]
name = "nextgcore-udrd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "NextGCore UDR (Unified Data Repository) - Rust Implementation"

[[bin]]
name = "nextgcore-udrd"
path = "src/main.rs"

[lib]
name = "nextgcore_udrd"
path = "src/lib.rs"

[dependencies]
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
ctrlc.workspace = true
clap.workspace = true
nextgcore-sbi = { path = "../../libs/nextgcore-sbi" }
nextgcore-metrics = { workspace = true }
nextgcore-dbi = { path = "../../libs/nextgcore-dbi" }
nextgcore-core = { path = "../../libs/nextgcore-core" }
tokio.workspace = true

[dev-dependencies]
proptest.workspace = true
# WSB-6: enable the nextgcore-dbi in-memory test store so the real Nudr
# handlers can be exercised hermetically (no MongoDB) in unit tests.
nextgcore-dbi = { path = "../../libs/nextgcore-dbi", features = ["test-helpers"] }

[lints]
workspace = true
