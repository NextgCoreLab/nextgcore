[package]
name = "nextgcore-amfd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore AMF (Access and Mobility Management Function)"

[[bin]]
name = "nextgcore-amfd"
path = "src/main.rs"

[features]
# Native Linux kernel-SCTP NGAP backend (production remediation T0.2b).
# Enables `--sctp-backend kernel` so an independent RAN can connect over
# standard SCTP. Requires Linux + libsctp at link/run time; off by default so
# the host build keeps using the pure-Rust sctp-proto backend.
kernel-sctp = ["ogs-sctp/kernel"]

[dependencies]
ogs-asn1c = { workspace = true }
ogs-core = { workspace = true }
ogs-crypt = { workspace = true }
ogs-nas = { workspace = true }
ogs-ngap = { workspace = true }
ogs-sbi = { workspace = true }
ogs-sctp = { workspace = true }
ogs-app = { workspace = true }
ogs-metrics = { workspace = true }
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
serde_yaml = { workspace = true }
uuid.workspace = true
clap.workspace = true
ctrlc.workspace = true
sha2 = "0.10"
bytes = "1.5"
once_cell = "1.19"
base64.workspace = true
hex.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
