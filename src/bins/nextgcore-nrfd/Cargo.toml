[package]
name = "nextgcore-nrfd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore NRF (Network Repository Function)"

[[bin]]
name = "nextgcore-nrfd"
path = "src/main.rs"

[lib]
name = "nextgcore_nrfd"
path = "src/lib.rs"

[dependencies]
nextgcore-core = { workspace = true }
nextgcore-sbi = { workspace = true }
nextgcore-metrics = { workspace = true }
nextgcore-app = { workspace = true }
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
serde_json.workspace = true
uuid.workspace = true
clap.workspace = true
ctrlc.workspace = true
base64.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }

[dev-dependencies]
proptest.workspace = true
# Issue #393: build a real CA and a real leaf over a CCA signing key, so the x5c
# binding tests exercise interoperable X.509 rather than a byte fixture of my own
# making. Test-only: no production path in nrfd generates a certificate.
rcgen = "0.13"
# Issue #393: set an explicit notBefore/notAfter on those test certificates.
# rcgen's default window is 1975..4096, which makes any expiry assertion vacuous.
time = { version = "0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
