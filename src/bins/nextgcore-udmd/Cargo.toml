[package]
name = "nextgcore-udmd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore UDM (Unified Data Management)"

[[bin]]
name = "nextgcore-udmd"
path = "src/main.rs"

# Wave-6 H1 (strict-peer harness foundation): the UDM is also a library so
# peer NF crates can drive the real `udm_sbi_request_handler` in-process from
# integration tests instead of hand-rolled lenient mocks.
[lib]
name = "nextgcore_udmd"
path = "src/lib.rs"

[features]
## Issue #22: Network Energy Saving (non-normative research prototype; no
## frozen Rel-20 Stage-3 exists). Adds an idle->drain->suspend runtime that
## reflects sleep to the NRF (nfStatus=SUSPENDED or deregistration) and a
## live /metrics energy endpoint fed by a SYNTHETIC power model. Off by
## default: the default build is byte-for-byte unchanged.
## Enable with: cargo build -p nextgcore-udmd --features nes
nes = []

[dependencies]
nextgcore-core = { workspace = true }
nextgcore-crypt = { workspace = true }
nextgcore-sbi = { workspace = true }
nextgcore-metrics = { workspace = true }
nextgcore-dbi = { workspace = true }
nextgcore-app = { workspace = true }
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
serde_json.workspace = true
uuid.workspace = true
clap.workspace = true
ctrlc.workspace = true

[dev-dependencies]
proptest.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }
base64.workspace = true
# Wave-6 H3 (strict-peer conversion): drive amfd's REAL Nudm_UECM
# deregistration-notify consumer (`handle_dereg_notify` + the real
# DeregistrationData wire enums) in-process from udmd's tests via the H1
# amfd lib target, instead of a lenient mock. Dev-only edge; the binary
# graph is unchanged.
nextgcore-amfd = { path = "../nextgcore-amfd" }
# Wave-6 F-07 (TRUE strict-peer): drive ausfd's REAL Nausf_SoRProtection /
# Nausf_UPUProtection producers (`ausf_sbi_request_handler` +
# `handle_sor_protect`/`handle_upu_protect`) in-process from udmd's tests
# via the H1 ausfd lib target — real udmd am-data injection ↔ real ausfd
# MAC producers over a loopback SBI HTTP/2 server, not a lenient mock.
# Dev-only edge; the binary graph is unchanged.
nextgcore-ausfd = { path = "../nextgcore-ausfd" }
# F-07 independent MAC oracle: recompute the Annex A.17-A.20 MACs from a
# raw HMAC-SHA-256 S-string assembly, NOT via nextgcore-crypt's KDF (which
# the ausfd producer uses) — so the strict-peer equality is a genuine
# cross-implementation check, not self-confirmation.
hmac.workspace = true
sha2.workspace = true

[lints]
workspace = true
