[package]
name = "nextgcore-smfd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore SMF (Session Management Function)"

[[bin]]
name = "nextgcore-smfd"
path = "src/main.rs"

[features]
## Issue #20: load/compute-aware UPF selection. With the feature enabled and
## several UPFs configured (comma-separated UPF_PFCP_ADDR), a NEW session is
## placed on the least-loaded *associated* peer, using the load metric each
## UPF reports via Load Control Information on its PFCP heartbeat
## (TS 23.501 6.3.3 selection input). Off by default: session establishment
## uses the single default client exactly as before. Rel-19 "Compute-Aware
## Networking" has no frozen Stage-3 (non-normative research knob).
## Enable with: cargo build -p nextgcore-smfd --features compute-aware-upf
compute-aware-upf = []

[dependencies]
nextgcore-core = { workspace = true }
nextgcore-nas = { workspace = true }
# #417: the N2 SM transfers (n2_transfer.rs) are built and parsed by the NGAP
# codec generated from the TS 38.413 ASN.1; asn1-codecs is its runtime.
nextgcore-ngap-gen = { workspace = true }
asn1-codecs.workspace = true
nextgcore-pfcp = { workspace = true }
nextgcore-gtp = { workspace = true }
# #619: flow descriptions to and from the EPS TFT packet filter components.
nextgcore-ipfw = { workspace = true }
nextgcore-sbi = { workspace = true }
nextgcore-metrics = { workspace = true }
nextgcore-diameter = { workspace = true }
nextgcore-app = { workspace = true }
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
anyhow.workspace = true
bytes.workspace = true
ctrlc.workspace = true
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json.workspace = true
uuid.workspace = true
base64.workspace = true
# Issue #191: SmfStateError, so a snapshot from a newer build reports why it was
# refused rather than being partially restored.
thiserror.workspace = true

[dev-dependencies]
# #475 strict-peer test: drive amfd's REAL N26 → NGAP EPS→5GS handover path against this
# SMF's REAL SBI handlers, so the two sides of TS 23.502 §4.11.1.2.2 cannot drift — the same
# dev-only edge lmfd, pcfd, udmd and mmed already have. Not linked into the binary.
nextgcore-amfd = { path = "../nextgcore-amfd" }
# #417: the hand-written transfer codec smfd used before n2_transfer.rs, kept as the
# ORACLE its generated bytes are compared against (n2_transfer/oracle_tests.rs). Not
# linked into the binary.
nextgcore-ngap = { workspace = true }
nextgcore-asn1c = { workspace = true }
proptest.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }

[lints]
workspace = true
