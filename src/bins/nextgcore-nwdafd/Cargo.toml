[package]
name = "nextgcore-nwdafd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore NWDAF (Network Data Analytics Function, TS 23.288)"

[[bin]]
name = "nextgcore-nwdafd"
path = "src/main.rs"

[features]
## Non-normative 6G ISAC sensing pipeline (issue #16): collection endpoint,
## bounded in-memory store, Isac pub-sub event + ingest metric. Off by default.
## Enable with: cargo build -p nextgcore-nwdafd --features sensing
sensing = ["dep:nextgcore-proto", "nextgcore-sbi/6g-extensions"]
## Issue #26: ONNX-backed NF_LOAD prediction (non-normative). Zero-dependency
## hand-rolled reader for a minimal ONNX subset — exactly one ai.onnx.ml
## LinearRegressor node; anything else is a hard error. Off by default; the
## default build keeps the OLS baseline and needs no model file.
## Enable with: cargo build -p nextgcore-nwdafd --features onnx-model
onnx-model = []
## nextgsim#466 (demo d441c-amf-mobility): UE_MOBILITY analytics from AMF
## LOCATION_REPORT events. Subscribes to Namf_EventExposure, takes the notifies on
## the existing SBI listener and serves Nnwdaf_AnalyticsInfo UE_MOBILITY, when the
## demo block's mode is `on` or `nwdaf.amf_mobility.enabled` is true. Also serves
## /metrics (NEXTGCORE_METRICS_BIND, loopback by default; NWDAF_METRICS_PORT).
## Off by default; a default build has neither the route nor the listener.
amf-mobility = []

[dependencies]
nextgcore-core = { workspace = true }
nextgcore-sbi = { workspace = true }
# sensing-feature-only: canonical ISAC types (issue #16, non-normative).
nextgcore-proto = { workspace = true, optional = true }
nextgcore-metrics = { workspace = true }
nextgcore-app = { workspace = true }
# The demo: config block (nextgsim#458). Read by every build, so a demo block
# naming a demo this build was not compiled with fails start-up.
nextgcore-demo = { workspace = true }
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
serde_yaml.workspace = true
# Durable-state load errors (issue #66/#192); already in the workspace via
# nextgcore-core's state_store, so no new crate enters the tree.
thiserror.workspace = true
uuid.workspace = true
clap.workspace = true
ctrlc.workspace = true
chrono = "0.4"
# nextgsim#468: model artefacts are addressed and verified by sha256.
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
proptest.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }
base64.workspace = true
# G2-1 strict-peer test: our REAL nrfd (registry + NF_PROFILE_CHANGED notify
# builder + HTTP sender) is the conformant peer — no mocks.
nextgcore-nrfd = { path = "../nextgcore-nrfd" }
# nextgsim#466: the amf-mobility end-to-end test subscribes at amfd's REAL
# Namf_EventExposure handler and takes amfd's REAL LOCATION_REPORT notify.
nextgcore-amfd = { path = "../nextgcore-amfd" }

[lints]
workspace = true
