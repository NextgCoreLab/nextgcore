[package]
name = "nextgcore-sgwcd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore SGWC (Serving Gateway Control Plane)"

[[bin]]
name = "nextgcore-sgwcd"
path = "src/main.rs"

# #1113: the SGW-C is also a library, so smfd's tests can parse the PGW-C's S5/S8
# messages with this crate's real codecs and handlers (as amfd is for its peers).
[lib]
name = "nextgcore_sgwcd"
path = "src/lib.rs"

[dependencies]
nextgcore-core = { workspace = true }
nextgcore-gtp = { workspace = true }
nextgcore-pfcp = { workspace = true }
nextgcore-app = { workspace = true }
nextgcore-metrics = { workspace = true }
bytes.workspace = true
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
# #387: reading `sgwc.yaml`, which this daemon took as a path and discarded.
serde = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
