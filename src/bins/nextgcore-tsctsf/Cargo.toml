[package]
name = "nextgcore-tsctsf"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore TSCTSF (Time Sensitive Communication and Time Synchronization Function, TS 23.501 5.27-5.28 / TS 29.565)"

[[bin]]
name = "nextgcore-tsctsf"
path = "src/main.rs"

[dependencies]
nextgcore-core = { workspace = true }
nextgcore-sbi = { workspace = true }
nextgcore-metrics = { workspace = true }
nextgcore-app = { workspace = true }
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
anyhow.workspace = true
# #113: typed Ntsctsf IEs (TimeSyncExposureConfig, CapsSubscription, AstiConfig,
# QosTscSession) are deserialised from the request bodies rather than stored as
# raw JSON strings.
serde = { workspace = true, features = ["derive"] }
# #284: TS 29.571 `Bytes` is base64, and the PMIC/UMIC containers are typed as
# Bytes in TS 29.512's PortManagementContainer / BridgeManagementContainer.
base64.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
uuid.workspace = true
clap.workspace = true
ctrlc.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
