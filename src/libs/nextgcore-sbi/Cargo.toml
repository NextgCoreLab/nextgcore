[package]
name = "nextgcore-sbi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore SBI (Service Based Interface) Library"

[features]
## Gate 6G research modules (gRPC/SBI-2.0, event pub-sub).
## Enable with: cargo build -p nextgcore-sbi --features 6g-extensions
6g-extensions = []
## Gate the non-normative HTTP/3-over-QUIC SBI transport prototype (issue #15).
## Loopback research spike only — no NF uses it; TS 29.500 mandates HTTP/2.
## Enable with: cargo build -p nextgcore-sbi --features http3
http3 = ["dep:h3", "dep:h3-quinn", "dep:quinn", "dep:http"]
## Gate the non-normative hybrid PQC TLS key exchange (issue #17): rustls
## aws-lc-rs provider offering X25519MLKEM768 when PqcTlsConfig.enabled.
## The default provider stays ring. Enable with: --features pqc-tls
pqc-tls = ["rustls/aws-lc-rs"]

[dependencies]
nextgcore-core = { workspace = true }
log.workspace = true
thiserror.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
h2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
bytes.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
webpki-roots.workspace = true
base64.workspace = true
hex.workspace = true
# Randomized W3C traceparent trace-id/span-id (sbi-09) and OCI load-shedding
# probabilistic reaction (sbi-08). Workspace-pinned; no root Cargo.toml change.
rand.workspace = true
# Issue #187: generate this NF's own nfInstanceId when no operator pin is
# configured. TS 29.571 types NfInstanceId as a UUID, and resolving it in ONE
# place is what gives ONE process ONE identity (see `nf_instance_id`).
uuid.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }
# Issue #186: parse the URI SubjectAltName out of a peer's verified client
# certificate (TS 33.310 carries the NF Instance ID there). RustCrypto, so it
# builds on the same `der` already in the graph via p256 -- no second ASN.1 stack,
# and no hand-rolled X.509 parsing for a security-relevant identity.
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
# Issue #393: X.509 path validation for a CCA's `x5c` chain (TS 33.501 §13.3.8.3).
# This is the SAME verifier rustls already uses for every TLS chain in this tree
# (it is rustls's own dependency, already in Cargo.lock), named explicitly here so
# the certificate binding is not a second, hand-rolled path builder. `ring` to
# match the rustls provider the default build selects.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"] }
# http3-feature-only: HTTP/3 transport prototype (issue #15). Crate-local, not
# workspace-pinned — no other crate may depend on these (non-normative research).
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
http = { version = "1.4", optional = true }

[dev-dependencies]
# Bench-only: SBA transport benchmark harness (issue #15).
criterion = "0.8.2"
proptest.workspace = true
# Test-only: generate a self-signed cert for the in-memory TLS exporter test, and
# (issue #393) a real CA plus CCA-signing-key leaf for the x5c binding tests.
rcgen = "0.13"
# Test-only: set an EXPLICIT notBefore/notAfter on a generated test certificate.
# rcgen's default window is 1975..4096, so without this the expiry test passes
# vacuously (it did, until it was tightened). Already in the graph via rcgen.
time = { version = "0.3", default-features = false, features = ["std"] }
# Test-only: `start_paused` runtimes, so the `poll_until` budget tests assert an
# EXACT elapsed time instead of a tolerance window (#370). Not in the `full`
# feature set; dev-only, so no production build gains a time-mocking clock.
# Precedent: nextgcore-core enables the same feature.
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true

[[bench]]
name = "transport"
harness = false
