[package]
name = "nextgcore-dbi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore Database Interface Library"

[dependencies]
nextgcore-core = { workspace = true }
# OPc derivation (milenage_opc) on the OP-only provisioning path, so no
# consumer can serve the raw OP as OPc. No cycle: nextgcore-crypt depends
# only on nextgcore-core.
nextgcore-crypt = { workspace = true }
thiserror.workspace = true
mongodb = { version = "2.8", default-features = false, features = ["sync"] }
serde.workspace = true
tokio.workspace = true
log.workspace = true

[dev-dependencies]
proptest.workspace = true

[features]
# Test-only helpers: `reset_for_tests` and the in-memory `test_store`
# subscriber backend (hermetic unit tests without a MongoDB instance).
# Never enabled by production builds; NF crates opt in via dev-dependencies.
test-helpers = []

[lints]
workspace = true
