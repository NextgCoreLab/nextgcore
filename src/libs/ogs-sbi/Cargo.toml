[package]
name = "ogs-sbi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NextGCore SBI (Service Based Interface) Library"

[features]
## Gate 6G research modules (gRPC/SBI-2.0, event pub-sub).
## Enable with: cargo build -p ogs-sbi --features 6g-extensions
6g-extensions = []

[dependencies]
ogs-core = { workspace = true }
log.workspace = true
thiserror.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
h2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
bytes.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
webpki-roots.workspace = true
base64.workspace = true
hex.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }

[dev-dependencies]
proptest.workspace = true
# Test-only: generate a self-signed cert for the in-memory TLS exporter test.
rcgen = "0.13"

[lints]
workspace = true
