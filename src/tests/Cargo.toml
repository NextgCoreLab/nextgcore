[package]
name = "nextgcore-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "test-util"] }
async-trait = "0.1"

# Testing
proptest = "1.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# HTTP client for SBI
hyper = { version = "1.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# MongoDB - using sync feature to be compatible with nextgcore-dbi
mongodb = { version = "2.8", default-features = false, features = ["sync"] }
bson = "2.9"

# Testcontainers for MongoDB
testcontainers = "0.15"
testcontainers-modules = { version = "0.3", default-features = false, features = ["mongo"] }

# UUID
uuid = { version = "1.6", features = ["v4"] }

# Bytes
bytes = "1.5"

# Internal crates
nextgcore-core = { path = "../libs/nextgcore-core" }
nextgcore-crypt = { path = "../libs/nextgcore-crypt" }
nextgcore-nas = { path = "../libs/nextgcore-nas" }
nextgcore-ngap = { path = "../libs/nextgcore-ngap" }
nextgcore-s1ap = { path = "../libs/nextgcore-s1ap" }
nextgcore-gtp = { path = "../libs/nextgcore-gtp" }
nextgcore-pfcp = { path = "../libs/nextgcore-pfcp" }
nextgcore-sbi = { path = "../libs/nextgcore-sbi" }
nextgcore-diameter = { path = "../libs/nextgcore-diameter" }
nextgcore-app = { path = "../libs/nextgcore-app" }

[[test]]
name = "integration"
path = "integration/mod.rs"

[lints]
workspace = true
