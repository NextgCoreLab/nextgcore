[package]
name = "nextgcore-fuzz"
version = "0.0.0"
authors = ["NextGCore Contributors"]
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace (the cargo-fuzz layout), not a member of `src/Cargo.toml`
# (#587): libfuzzer-sys compiles libFuzzer's C++ in its build script, and the
# targets are only meaningful under `cargo +nightly fuzz`, so neither belongs in
# every `cargo build/test --workspace`. Without this table cargo refuses to
# build the crate at all ("believes it's in a workspace when it's not").
# CI keeps it compiling: the `fuzz-build` job in .github/workflows/ci.yml.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

# Protocol libraries to fuzz
nextgcore-pfcp = { path = "../libs/nextgcore-pfcp" }
nextgcore-gtp = { path = "../libs/nextgcore-gtp" }
nextgcore-nas = { path = "../libs/nextgcore-nas" }
nextgcore-ngap-gen = { path = "../libs/nextgcore-ngap-gen" }
nextgcore-s1ap-gen = { path = "../libs/nextgcore-s1ap-gen" }
nextgcore-nrppa-gen = { path = "../libs/nextgcore-nrppa-gen" }
nextgcore-lpp-gen = { path = "../libs/nextgcore-lpp-gen" }
nextgcore-diameter = { path = "../libs/nextgcore-diameter" }
# #725: the UCMF's capability transcoding (`fuzz_ucmf_capability`).
nextgcore-nr-rrc-gen = { path = "../libs/nextgcore-nr-rrc-gen" }
nextgcore-lte-rrc-gen = { path = "../libs/nextgcore-lte-rrc-gen" }
log = "0.4"

# Workspace members used for fuzzing
bytes = "1"

[profile.release]
debug = 1

# Fuzz targets

[[bin]]
name = "fuzz_pfcp_message"
path = "fuzz_targets/fuzz_pfcp_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_gtp_message"
path = "fuzz_targets/fuzz_gtp_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_nas_message"
path = "fuzz_targets/fuzz_nas_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_diameter_message"
path = "fuzz_targets/fuzz_diameter_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ngap_message"
path = "fuzz_targets/fuzz_ngap_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_s1ap_message"
path = "fuzz_targets/fuzz_s1ap_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_nrppa_message"
path = "fuzz_targets/fuzz_nrppa_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_lpp_message"
path = "fuzz_targets/fuzz_lpp_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ucmf_capability"
path = "fuzz_targets/fuzz_ucmf_capability.rs"
test = false
doc = false
bench = false
