[workspace]
resolver = "2"
# The patched sctp-proto (#467) is a [patch.crates-io] path crate, not a member;
# excluded so its own tests and lints are not counted as this workspace's.
exclude = ["vendor/sctp-proto"]

members = [
    # Library crates (mirrors lib/)
    "libs/nextgcore-core",
    "libs/nextgcore-crypt",
    "libs/nextgcore-asn1c",
    "libs/nextgcore-gtp",
    "libs/nextgcore-pfcp",
    "libs/nextgcore-nas",
    "libs/nextgcore-sbi",
    "libs/nextgcore-diameter",
    "libs/nextgcore-sctp",
    "libs/nextgcore-ngap",
    "libs/nextgcore-ngap-gen",
    "libs/nextgcore-lpp-gen",
    "libs/nextgcore-nrppa-gen",
    "libs/nextgcore-s1ap",
    "libs/nextgcore-s1ap-gen",
    "libs/nextgcore-dbi",
    "libs/nextgcore-app",
    "libs/nextgcore-metrics",
    "libs/nextgcore-proto",
    "libs/nextgcore-ipfw",
    "libs/nextgcore-tun",

    # Binary crates (mirrors src/)
    "bins/nextgcore-amfd",
    "bins/nextgcore-ausfd",
    "bins/nextgcore-bsfd",
    "bins/nextgcore-hssd",
    "bins/nextgcore-mmed",
    "bins/nextgcore-nefd",
    "bins/nextgcore-nrfd",
    "bins/nextgcore-nssfd",
    "bins/nextgcore-pcfd",
    "bins/nextgcore-pcrfd",
    "bins/nextgcore-scpd",
    "bins/nextgcore-seppd",
    "bins/nextgcore-sgwcd",
    "bins/nextgcore-sgwud",
    "bins/nextgcore-smfd",
    "bins/nextgcore-udmd",
    "bins/nextgcore-udrd",
    "bins/nextgcore-upfd",

    # Rel-17 NFs
    "bins/nextgcore-mbsmfd",
    "bins/nextgcore-nsacfd",
    "bins/nextgcore-eesd",
    "bins/nextgcore-pind",
    "bins/nextgcore-lmfd",
    "bins/nextgcore-dccfd",
    "bins/nextgcore-easdfd",
    "bins/nextgcore-tsctsf",
    # Rel-16 RACS (TS 23.501 5.4.4.1a)
    "bins/nextgcore-ucmfd",

    # WebUI
    "bins/nextgcore-webui",

    # Rel-20 (6G) NFs
    "bins/nextgcore-nwdafd",

    # Integration tests
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NextGCore Contributors"]
license = "AGPL-3.0"
repository = "https://github.com/nextgcore/nextgcore"
description = "NextGCore 5G/LTE Core Network - Rust Implementation"

[workspace.dependencies]
# Core dependencies
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.5"
bitflags = "2.4"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Networking
socket2 = "0.5"
libc = "0.2"

# HTTP/2 for SBI
hyper = { version = "1.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
h2 = "0.4"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.1"
webpki-roots = "0.26"

# Database
mongodb = { version = "2.8", default-features = false, features = ["sync"] }

# Cryptography - using existing Rust crates where available
aes = "0.8"
aes-gcm = "0.10"
sha1 = "0.10"
sha2 = "0.10"
zeroize = "1.8"
hmac = "0.12"
cmac = "0.7"
hkdf = "0.12"
zuc = "0.1"                    # ZUC cipher (3GPP EEA3/EIA3)
p256 = "0.13"                  # NIST P-256 elliptic curve
elliptic-curve = "0.13"        # Generic elliptic curve traits
x25519-dalek = { version = "2", features = ["static_secrets"] } # Curve25519 (ECIES Profile A, TS 33.501 Annex C.3.2)
base64 = "0.22"
hex = "0.4"                    # Hex encoding/decoding

# ASN.1 codec - using rasn for PER encoding
rasn = "0.18"
rasn-derive = "0.18"

# ASN.1 compiler and PER codecs for the GENERATED codec crates (nextgcore-ngap-gen,
# -s1ap-gen, -nrppa-gen, -lpp-gen): hampi 0.7.2 forked with the conformance
# fixes found generating NGAP, S1AP, NRPPa, LPP and RRC (CHOICE extension arm,
# inline OCTET STRING CONTAINING, object-set parse hang, SEQUENCE OF SIZE,
# ENUMERATED and INTEGER extension values, empty extension object sets, 16K
# length fragmentation, variable-size string alignment, constraint unions,
# character-string alignment, SEQUENCE extension additions -- each listed with
# its X.691/3GPP reference in the repository's README).
#
# The fork lives in its own repository, NextgCoreLab/asn1-codegen, extracted
# from nextgsim/vendor/ with its history and released as v0.1.0. It used to be
# consumed from nextgsim by rev, which made this core network build-depend on
# the simulator that tests it; that inverted edge is gone. Both repos now pin
# the same neutral release. The pin is the v0.1.0 tag's commit (6d75c49) by
# rev, so a moved tag can never change what builds; asn1-codegen's CI pins the
# generated output of every schema both repos compile (codegen-golden), so a
# compiler change that alters a byte fails there before it can reach a pin
# bump here. The compiler is a build-dependency only; asn1-codecs and
# asn1_codecs_derive link into the artifact.
asn1-compiler = { git = "https://github.com/NextgCoreLab/asn1-codegen.git", rev = "6d75c4962d09dcdb75eee7e4b8c03b14def2f123" }
asn1-codecs = { git = "https://github.com/NextgCoreLab/asn1-codegen.git", rev = "6d75c4962d09dcdb75eee7e4b8c03b14def2f123" }
asn1_codecs_derive = { git = "https://github.com/NextgCoreLab/asn1-codegen.git", rev = "6d75c4962d09dcdb75eee7e4b8c03b14def2f123" }
bitvec = "1"

# Protocol libraries - using existing Rust crates where available
diameter-rs = "0.5"            # Diameter protocol (AAA)

# Pure Rust SCTP (userspace over UDP - no C dependencies)
sctp-proto = "0.6"             # SCTP protocol (same as nextgsim for wire compatibility)

# Testing
proptest = "1.4"
hex-literal = "0.4"

# Metrics
prometheus = "0.13"

# UUID
uuid = { version = "1.6", features = ["v4"] }

# Random number generation
rand = "0.9"

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# Signal handling
ctrlc = { version = "3.4", features = ["termination"] }

# Web framework (for WebUI)
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
mime_guess = "2"

# Internal crates
nextgcore-core = { path = "libs/nextgcore-core" }
nextgcore-crypt = { path = "libs/nextgcore-crypt" }
nextgcore-asn1c = { path = "libs/nextgcore-asn1c" }
nextgcore-gtp = { path = "libs/nextgcore-gtp" }
nextgcore-pfcp = { path = "libs/nextgcore-pfcp" }
nextgcore-nas = { path = "libs/nextgcore-nas" }
nextgcore-sbi = { path = "libs/nextgcore-sbi" }
nextgcore-diameter = { path = "libs/nextgcore-diameter" }
nextgcore-sctp = { path = "libs/nextgcore-sctp" }
nextgcore-ngap = { path = "libs/nextgcore-ngap" }
nextgcore-ngap-gen = { path = "libs/nextgcore-ngap-gen" }
nextgcore-lpp-gen = { path = "libs/nextgcore-lpp-gen" }
nextgcore-nrppa-gen = { path = "libs/nextgcore-nrppa-gen" }
nextgcore-s1ap = { path = "libs/nextgcore-s1ap" }
nextgcore-s1ap-gen = { path = "libs/nextgcore-s1ap-gen" }
nextgcore-dbi = { path = "libs/nextgcore-dbi" }
nextgcore-app = { path = "libs/nextgcore-app" }
nextgcore-metrics = { path = "libs/nextgcore-metrics" }
nextgcore-proto = { path = "libs/nextgcore-proto" }
nextgcore-ipfw = { path = "libs/nextgcore-ipfw" }
nextgcore-tun = { path = "libs/nextgcore-tun" }

# Workspace-wide lint configuration
# 3GPP protocol implementations naturally have many parameters and complex types.
[workspace.lints.clippy]
# Protocol implementations naturally have many parameters and complex types
too_many_arguments = "allow"
type_complexity = "allow"
# Protocol codecs use specific initialization and construction patterns
field_reassign_with_default = "allow"
vec_init_then_push = "allow"
# ASN.1 codecs use transmute for type punning
missing_transmute_annotations = "allow"
# Build scripts use PathBuf parameters
ptr_arg = "allow"
# Protocol methods may shadow std trait names (from_str, next, default)
should_implement_trait = "allow"
# Protocol enums may have common prefixes
enum_variant_names = "allow"
# Iterator patterns in low-level codec/crypto code
needless_range_loop = "allow"
# Manual prefix stripping in protocol parsers
manual_strip = "allow"
# Some match arms have identical fallthrough behavior
if_same_then_else = "allow"
# Protocol drop patterns
drop_non_drop = "allow"
# Collapsible match/if patterns in state machines
collapsible_match = "allow"

[workspace.lints.rust]
# SCTP feature flag used in conditional compilation
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("sctp"))'] }
# Future-use code for Rel-17/18/20 features
dead_code = "allow"

# Redirect the TRANSITIVE asn1 edges onto the same asn1-codegen rev (#417).
# `asn1_codecs_derive` and `asn1-compiler` each depend on `asn1-codecs = "=0.7.2"`
# from crates.io. Without this patch those edges resolve to the unfixed registry
# copy, and one build holds two asn1-codecs: the derive emits calls against a
# codec whose extended-CHOICE encoder still refuses. nextgsim's own Cargo.toml
# patches the same three crates for the same reason.
[patch.crates-io]
asn1-compiler = { git = "https://github.com/NextgCoreLab/asn1-codegen.git", rev = "6d75c4962d09dcdb75eee7e4b8c03b14def2f123" }
asn1-codecs = { git = "https://github.com/NextgCoreLab/asn1-codegen.git", rev = "6d75c4962d09dcdb75eee7e4b8c03b14def2f123" }
asn1_codecs_derive = { git = "https://github.com/NextgCoreLab/asn1-codegen.git", rev = "6d75c4962d09dcdb75eee7e4b8c03b14def2f123" }
# sctp-proto 0.6.0 patched to carry any SCTP PPID verbatim (#467; same patch as
# nextgsim #220): upstream (0.6.0 and 0.10.7 alike) maps every non-WebRTC PPID to
# `Unknown`, which goes on the wire as 58, so NGAP 60 and S1AP 18 were rewritten.
# nextgcore is the crate's single home; nextgsim consumes it from here by rev
# rather than keeping a second copy. See vendor/sctp-proto/HOME.md and
# vendor/sctp-proto/NEXTGSIM-PATCH.md.
sctp-proto = { path = "vendor/sctp-proto" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
