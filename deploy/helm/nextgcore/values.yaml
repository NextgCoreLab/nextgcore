# Default values for the NextGCore 5G Core control-plane chart.
#
# Scope: 10 control-plane NFs + MongoDB. The gNB/UE simulator and the
# monitoring stack are NOT part of this chart -- see nextgsim/k8s/ and
# k8s/monitoring/. Rationale in specs/fix-helm-chart-control-plane.md.

global:
  # A site/cluster identifier salted into derived NF instance ids (#753). SET
  # IT: it is the first choice. The fallback when it is empty reads the
  # kube-system namespace UID with `lookup`, which:
  #   - needs cluster-wide read on Namespaces (a namespace-scoped installer
  #     cannot do it);
  #   - always yields an empty salt under `helm template` and GitOps renderers
  #     (ArgoCD, `helm template | kubectl apply`), so their ids differ from what
  #     `helm install` derives for the same release.
  # Use a value unique per cluster and stable for its life. Required when
  # several clusters share one UDM/NRF.
  siteId: ""
  image:
    registry: ""
    pullPolicy: IfNotPresent
  sbi:
    scheme: http
    port: 7777
  # SBI security profile for amf/smf/ausf/udm (issue #63). Those four default in
  # CODE to "production": mutually-authenticated TLS plus a required OAuth2
  # access token, and they REFUSE TO START without the certificates named by
  # SbiSecurityPolicy::production() rather than falling back to cleartext.
  #
  # This chart mounts no SBI certificates, so it ships the explicit "dev"
  # opt-out: cleartext h2c, no client-certificate verification, no token
  # verification. Set to "production" only once those certs are provisioned and
  # mounted at /etc/nextgcore/tls/{server.crt,server.key,ca.crt} -- plus the
  # CLIENT pair those NFs present when they DIAL a peer
  # (/etc/nextgcore/tls/{client.crt,client.key}), since under mTLS an NF is both
  # server and client. Override any path with NEXTGCORE_SBI_TLS_CERT / _KEY / _CA
  # / _CLIENT_CERT / _CLIENT_KEY.
  sbiProfile: dev
  logLevel: info
  max:
    ue: 1024
    peer: 64
  # Shared by amf/nrf guami, tai and plmn_support, and by the subscribers the
  # mongodb-init Job seeds. Changing the PLMN here must match the simulator's.
  plmn:
    mcc: "999"
    mnc: "70"
  # UE address pools. Shared by the SMF (allocation) and the UPF (TUN routes),
  # which must agree -- so they are defined once here.
  session:
    - subnet: "10.45.0.0/16"
      gateway: "10.45.0.1"
    - subnet: "2001:db8:cafe::/48"
      gateway: "2001:db8:cafe::1"

# MongoDB. Templated in-chart (templates/mongodb.yaml) rather than pulled from
# charts.bitnami.com: the chart must render offline. See Chart.yaml.
mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "6.0"
  database: nextgcore
  # Set to reuse an existing MongoDB instead of the in-chart StatefulSet.
  externalUri: ""
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Seeds subscribers + indexes. Registration cannot succeed without it.
  init:
    enabled: true
  # #1369: the MongoDB exporter (mongodb_up, for the MongoDbDown rule). ClusterIP
  # only. Its URI is read from a Secret, never from values: by default the
  # chart's own Secret with the in-chart URI (this MongoDB has no credentials).
  # With mongodb.externalUri, name a Secret of yours in uriSecret (it may hold
  # credentials); the chart refuses to render otherwise.
  exporter:
    enabled: true
    image:
      repository: percona/mongodb_exporter
      tag: "0.40.0"
    port: 9216
    uriSecret:
      name: ""
      key: uri
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# Subscriber seeded by the mongodb-init Job. Must match the UE's USIM config.
subscriber:
  imsi: "999700000000001"
  key: "465B5CE8B199B49FAA5F0A2EE238A6BC"
  opc: "E8ED289DEBA952E4283B54E88E6D834D"
  amf: "8000"
  dnn: "internet"
  sst: 1

# UDM home-network keys for SUCI de-concealment (ECIES profile A/B).
#
# The chart does NOT ship key material. The keys live outside the chart
# directory (docker/rust/configs/5gc/hnet/), and Helm's .Files.Get cannot read
# above the chart root -- so the Secret is created out-of-band and merely
# mounted here. NOTES.txt prints the exact command after install.
#
# The mount is optional: without the Secret the UDM still starts and the
# null protection scheme works, but a profile A/B SUCI fails to de-conceal.
hnetKeys:
  # Name of a Secret holding curve25519-1.key and secp256r1-2.key.
  # Defaults to <release>-udm-hnet-keys.
  existingSecret: ""

# NRF - Network Repository Function
nrf:
  enabled: true
  replicas: 1
  image:
    repository: nextgcore-rust/nrf
    tag: latest
  service:
    type: ClusterIP
    port: 7777
  metrics:
    enabled: true
    port: 9090

# AMF - Access and Mobility Management Function
amf:
  enabled: true
  replicas: 1
  # The AMF's nfInstanceId (#753). Empty: a UUID derived from the cluster
  # (global.siteId, else the kube-system namespace UID) and the release, stable
  # across restarts. Pin it explicitly when an NRF trust store keys on it.
  # One AMF per release: replicas > 1 fails the render, because every pod would
  # share this id. To scale, use a StatefulSet with a per-ordinal id.
  nfInstanceId: ""
  image:
    repository: nextgcore-rust/amf
    tag: latest
  service:
    # Headless: NGAP is userspace SCTP over UDP and GTP-U-adjacent traffic
    # tolerates kube-proxy per-flow UDP balancing poorly. Matches
    # deploy/eks/profiles/5g/patches/headless-services.yaml.
    headless: true
    type: ClusterIP
    sbiPort: 7777
    ngapPort: 38412
  metrics:
    enabled: true
    port: 9090
  config:
    amfId:
      region: 2
      set: 1
    tai:
      tac: 1
    nssai:
      - sst: 1
    # T3512 periodic registration timer, seconds. 540 = 9 min.
    t3512: 540
  # #686: the UE context store (TS 23.501 §5.21.2.3). The AMF writes every
  # registered UE's context to MongoDB (collection amf_ue_contexts) and restores
  # it after a restart, so a returning UE keeps its 5G-GUTI, security context and
  # PDU sessions instead of registering again. Off by default. Restoration needs
  # the stable nfInstanceId above (only records of the same instance come back).
  # The records hold NAS keys in clear: the MongoDB needs the access control the
  # UDR's subscriber keys already need.
  ueContextStore:
    enabled: false
    # Empty: the chart's MongoDB (the same URI the UDR uses).
    dbUri: ""

# SMF - Session Management Function
smf:
  enabled: true
  replicas: 1
  # A graceful SMF shutdown tells every UE (#39) and every SGW and releases each UPF
  # association; SMF_SHUTDOWN_BUDGET_SECS is derived from this (less 2 s).
  terminationGracePeriodSeconds: 45
  image:
    repository: nextgcore-rust/smf
    tag: latest
  service:
    type: ClusterIP
    sbiPort: 7777
    pfcpPort: 8805
  metrics:
    enabled: true
    port: 9090
  config:
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 2001:4860:4860::8888
      - 2001:4860:4860::8844
    mtu: 1400

# UPF - User Plane Function
upf:
  enabled: true
  replicas: 1
  # CP functions allowed to set up the N4 association (#968): IPs, CIDRs or host
  # names, comma-separated. Empty uses the SMF's headless PFCP Service. The UPF
  # refuses every association when this resolves to nothing.
  pfcpAllowedPeers: ""
  image:
    repository: nextgcore-rust/upf
    tag: latest
  service:
    # Headless is REQUIRED for GTP-U: kube-proxy's per-flow UDP balancing with a
    # conntrack timeout is a poor fit for a long-lived N3 tunnel, and the gNB
    # must reach the pod that holds the PFCP session. The chart used to render
    # ClusterIP here, reintroducing what the EKS overlay removes.
    headless: true
    type: ClusterIP
    pfcpPort: 8805
    gtpuPort: 2152
  metrics:
    enabled: true
    port: 9090
  # The data plane needs a real TUN device, which needs uid 0 and
  # /dev/net/tun. Set enabled=false for a control-plane-only UPF (no user
  # plane: PFCP sessions establish but no packets are forwarded).
  dataPlane:
    enabled: true
    hostPathTun: /dev/net/tun
    # Restrict to nodes prepared for the data plane, mirroring the EKS overlay.
    nodeSelector: {}
  config:
    tunDevice: ogstun

# AUSF - Authentication Server Function
ausf:
  enabled: true
  replicas: 1
  image:
    repository: nextgcore-rust/ausf
    tag: latest
  service:
    type: ClusterIP
    port: 7777
  # /metrics (#1334): a ClusterIP Service port, bound in the pod only.
  metrics:
    enabled: true
    port: 9090

