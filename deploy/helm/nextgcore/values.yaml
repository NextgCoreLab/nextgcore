# PCF - Policy Control Function
pcf:
  enabled: true
  replicas: 1
  # This NF's nfInstanceId (#1617): empty derives it from global.siteId, the
  # namespace, the release and the NF. Its certificate must name it. One pod
  # per release: replicas > 1 fails the render (one ID, one certificate).
  nfInstanceId: ""
  image:
    repository: nextgcore-rust/pcf
    tag: latest
  service:
    type: ClusterIP
    port: 7777
  metrics:
    enabled: true
    port: 9090
  # Rendered as pcf.policy.session_ambr_cap in pcf.yaml (#1402): whether the
  # subscribed Session-AMBR the SMF reports caps the authorised Session-AMBR on
  # the SM policy create, the UpdateNotify and the SE_AMBR_CH update alike.
  # subscribed: per direction min(policy, subscribed). none: the policy value.
  # Any other value fails the render (and pcfd start-up).
  policy:
    sessionAmbrCap: subscribed
    # Rendered as pcf.policy.udr_required in pcf.yaml (#1639): whether a policy
    # create is refused (500 SYSTEM_FAILURE) when the NRF does not answer the UDR
    # discovery and no UDR is known. true (production): refused. false: the local
    # default policy. Anything but a boolean fails the render (and pcfd start-up).
    udrRequired: true

# NSSF - Network Slice Selection Function
nssf:
  enabled: true
  replicas: 1
  # This NF's nfInstanceId (#1617): empty derives it from global.siteId, the
