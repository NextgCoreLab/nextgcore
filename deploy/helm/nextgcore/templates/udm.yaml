{{- if .Values.udm.enabled }}
{{- include "nextgcore.udmStateCheck" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-udm
  labels:
    app.kubernetes.io/name: udm
    app.kubernetes.io/instance: {{ .Release.Name }}-udm
    app.kubernetes.io/component: control-plane
    {{- include "nextgcore.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.udm.replicas }}
  {{- include "nextgcore.singleInstance" (dict "root" . "nf" "udm") }}
  # Recreate: the new pod must not register while the old one, holding the
  # same nfInstanceId, still shuts down and NFDeregisters it (#753, #1617).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: udm
      app.kubernetes.io/instance: {{ .Release.Name }}-udm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: udm
        app.kubernetes.io/instance: {{ .Release.Name }}-udm
      annotations:
        # Roll the pods when the rendered config changes; without this a
        # `helm upgrade` that only edits the ConfigMap leaves the old config
        # running, since the Deployment spec is unchanged.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "nextgcore.nrfTlsPodSecurity" . | nindent 6 }}
      initContainers:
        {{- include "nextgcore.advertiseInit" (dict "nf" "udm") | nindent 8 }}
        {{- include "nextgcore.waitForNrf" . | nindent 8 }}
      containers:
        - name: udm
          image: {{ include "nextgcore.image" (dict "global" .Values.global "nf" .Values.udm) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args: ["-c", "/etc/nextgcore/udm.yaml"]
          ports:
            - name: sbi
              containerPort: {{ .Values.udm.service.port }}
              protocol: TCP
            {{- if .Values.udm.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.udm.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- include "nextgcore.sbiProbes" . | nindent 10 }}
          volumeMounts:
            {{- include "nextgcore.nrfTlsMount" . | nindent 12 }}
            {{- include "nextgcore.configMounts" (dict "nf" "udm" "rewritten" true) | nindent 12 }}
            # SUCI de-concealment keys. optional: the null scheme works without
            # them; ECIES profile A/B does not. Secret is created out-of-band
            # (see NOTES.txt) because it lives outside the chart directory.
            - name: hnet-keys
              mountPath: /etc/nextgcore/hnet
              readOnly: true
            {{- if .Values.udm.durableState.enabled }}
            {{- include "nextgcore.udmStateMount" . | trim | nindent 12 }}
            {{- end }}
          env:
            {{- include "nextgcore.nrfTlsEnv" (dict "root" . "nf" "udm") | nindent 12 }}
            - name: NEXTGCORE_SBI_PROFILE
              # Issue #63: this NF defaults to the PRODUCTION SBI profile
              # (mutually-authenticated TLS + a required OAuth2 access token) and
              # REFUSES TO START without the certificates it names. The chart
              # mounts none by default, so it opts out explicitly. Set
              # global.sbiProfile=production once certs are provisioned.
              value: {{ .Values.global.sbiProfile | default "dev" | quote }}
            - name: RUST_LOG
              value: {{ .Values.global.logLevel }}
            {{- if .Values.udm.metrics.enabled }}
            # /metrics (#1334) defaults to 127.0.0.1 (#837); in the pod it must
            # accept the pod IP for Prometheus. Not exposed beyond the cluster.
            - name: NEXTGCORE_METRICS_BIND
              value: "0.0.0.0"
            - name: UDM_METRICS_PORT
              value: "{{ .Values.udm.metrics.port }}"
            {{- end }}
            - name: NEXTGCORE_SBI_ADVERTISE
              # #1312: the host registered with the NRF and put in callback
              # URIs, set apart from the bind so a wildcard bind can never be
              # advertised. The pod IP, which the init container also binds.
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: UDR_SBI_ADDR
              value: {{ .Release.Name }}-udr.{{ .Release.Namespace }}.svc.cluster.local
            - name: UDR_SBI_PORT
              value: "{{ .Values.udr.service.port }}"
            {{- if .Values.udm.durableState.enabled }}
            {{- include "nextgcore.udmStateEnv" . | trim | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "nextgcore.nrfTlsVolume" (dict "root" . "nf" "udm") | nindent 8 }}
        {{- include "nextgcore.configVolumes" . | nindent 8 }}
        - name: hnet-keys
          secret:
            secretName: {{ .Values.hnetKeys.existingSecret | default (printf "%s-udm-hnet-keys" .Release.Name) }}
            optional: true
        {{- if .Values.udm.durableState.enabled }}
        {{- include "nextgcore.udmStateVolume" . | trim | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-udm
  labels:
    app.kubernetes.io/name: udm
    {{- include "nextgcore.labels" . | nindent 4 }}
spec:
  type: {{ .Values.udm.service.type }}
  ports:
    - port: {{ .Values.udm.service.port }}
      targetPort: sbi
      protocol: TCP
      name: sbi
    {{- if .Values.udm.metrics.enabled }}
    - port: {{ .Values.udm.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    app.kubernetes.io/name: udm
    app.kubernetes.io/instance: {{ .Release.Name }}-udm
{{- with .Values.udm.durableState }}
{{- if and .enabled (eq .type "pvc") (not .persistence.existingClaim) }}
---
# udmd's state file (#1885). ReadWriteOnce and one Recreate replica: one writer.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nextgcore.udmStateClaim" $ }}
  labels:
    app.kubernetes.io/name: udm
    app.kubernetes.io/component: control-plane
    {{- include "nextgcore.labels" $ | nindent 4 }}
spec:
  accessModes: [{{ .persistence.accessMode | quote }}]
  {{- with .persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .persistence.size | quote }}
{{- end }}
{{- end }}
{{- end }}
