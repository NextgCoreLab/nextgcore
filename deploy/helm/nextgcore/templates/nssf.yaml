{{- if .Values.nssf.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nssf
  labels:
    app.kubernetes.io/name: nssf
    app.kubernetes.io/instance: {{ .Release.Name }}-nssf
    app.kubernetes.io/component: control-plane
    {{- include "nextgcore.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.nssf.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nssf
      app.kubernetes.io/instance: {{ .Release.Name }}-nssf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nssf
        app.kubernetes.io/instance: {{ .Release.Name }}-nssf
      annotations:
        # Roll the pods when the rendered config changes; without this a
        # `helm upgrade` that only edits the ConfigMap leaves the old config
        # running, since the Deployment spec is unchanged.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
        {{- include "nextgcore.advertiseInit" (dict "nf" "nssf") | nindent 8 }}
        {{- include "nextgcore.waitForNrf" . | nindent 8 }}
      containers:
        - name: nssf
          image: {{ include "nextgcore.image" (dict "global" .Values.global "nf" .Values.nssf) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args: ["-c", "/etc/nextgcore/nssf.yaml"]
          ports:
            - name: sbi
              containerPort: {{ .Values.nssf.service.port }}
              protocol: TCP
            {{- if .Values.nssf.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.nssf.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- include "nextgcore.sbiProbes" . | nindent 10 }}
          volumeMounts:
            {{- include "nextgcore.configMounts" (dict "nf" "nssf" "rewritten" true) | nindent 12 }}
          env:
            - name: NEXTGCORE_SBI_PROFILE
              # Issue #63: every NF's outbound SBI calls -- including its own NRF
              # registration and discovery -- follow the SBI profile, which
              # defaults to PRODUCTION (mTLS). Without this the NF starts but
              # cannot load its client certificate, never registers, and is
              # undiscoverable. The chart mounts none by default, so it opts out
              # explicitly. Set global.sbiProfile=production once certs exist.
              value: {{ .Values.global.sbiProfile | default "dev" | quote }}
            - name: RUST_LOG
              value: {{ .Values.global.logLevel }}
            {{- if .Values.nssf.metrics.enabled }}
            # /metrics (#1334) defaults to 127.0.0.1 (#837); in the pod it must
            # accept the pod IP for Prometheus. Not exposed beyond the cluster.
            - name: NEXTGCORE_METRICS_BIND
              value: "0.0.0.0"
            - name: NSSF_METRICS_PORT
              value: "{{ .Values.nssf.metrics.port }}"
            {{- end }}
            - name: NEXTGCORE_SBI_ADVERTISE
              # #1312: the host registered with the NRF and put in callback
              # URIs, set apart from the bind so a wildcard bind can never be
              # advertised. The pod IP, which the init container also binds.
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
      volumes:
        {{- include "nextgcore.configVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nssf
  labels:
    app.kubernetes.io/name: nssf
    {{- include "nextgcore.labels" . | nindent 4 }}
spec:
  type: {{ .Values.nssf.service.type }}
  ports:
    - port: {{ .Values.nssf.service.port }}
      targetPort: sbi
      protocol: TCP
      name: sbi
    {{- if .Values.nssf.metrics.enabled }}
    - port: {{ .Values.nssf.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    app.kubernetes.io/name: nssf
    app.kubernetes.io/instance: {{ .Release.Name }}-nssf
{{- end }}
