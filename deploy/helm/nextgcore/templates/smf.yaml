{{- if .Values.smf.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-smf
  labels:
    app.kubernetes.io/name: smf
    app.kubernetes.io/instance: {{ .Release.Name }}-smf
    app.kubernetes.io/component: control-plane
    {{- include "nextgcore.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.smf.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: smf
      app.kubernetes.io/instance: {{ .Release.Name }}-smf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smf
        app.kubernetes.io/instance: {{ .Release.Name }}-smf
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
        {{- include "nextgcore.advertiseInit" (dict "nf" "smf") | nindent 8 }}
        {{- include "nextgcore.waitForNrf" . | nindent 8 }}
      containers:
        - name: smf
          image: {{ include "nextgcore.image" (dict "global" .Values.global "nf" .Values.smf) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args: ["-c", "/etc/nextgcore/smf.yaml"]
          ports:
            - name: sbi
              containerPort: {{ .Values.smf.service.sbiPort }}
              protocol: TCP
            - name: pfcp
              containerPort: {{ .Values.smf.service.pfcpPort }}
              protocol: UDP
            {{- if .Values.smf.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.smf.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- include "nextgcore.sbiProbes" . | nindent 10 }}
          volumeMounts:
            {{- include "nextgcore.configMounts" (dict "nf" "smf" "rewritten" true) | nindent 12 }}
          env:
            - name: NEXTGCORE_SBI_PROFILE
              # Issue #63: this NF defaults to the PRODUCTION SBI profile
              # (mutually-authenticated TLS + a required OAuth2 access token) and
              # REFUSES TO START without the certificates it names. The chart
              # mounts none by default, so it opts out explicitly. Set
              # global.sbiProfile=production once certs are provisioned.
              value: {{ .Values.global.sbiProfile | default "dev" | quote }}
            - name: RUST_LOG
              value: {{ .Values.global.logLevel }}
            - name: RUST_BACKTRACE
              value: "1"
            # /metrics defaults to 127.0.0.1 (#837); in the pod it must accept the
            # pod IP for Prometheus and the kubelet. Not exposed beyond the cluster.
            - name: NEXTGCORE_METRICS_BIND
              value: "0.0.0.0"
            - name: SMF_PFCP_ADDR
              value: "0.0.0.0"
            {{- if .Values.upf.enabled }}
            # A hostname is re-resolved on every Association Setup attempt
            # (#658), so a restarted UPF pod at a new IP is found again.
            - name: UPF_PFCP_ADDR
              value: "{{ .Release.Name }}-upf.{{ .Release.Namespace }}.svc.cluster.local"
            {{- end }}
            - name: UPF_PFCP_PORT
              value: "{{ .Values.upf.service.pfcpPort }}"
      volumes:
        {{- include "nextgcore.configVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-smf
  labels:
    app.kubernetes.io/name: smf
    {{- include "nextgcore.labels" . | nindent 4 }}
spec:
  type: {{ .Values.smf.service.type }}
  ports:
    - port: {{ .Values.smf.service.sbiPort }}
      targetPort: sbi
      protocol: TCP
      name: sbi
    - port: {{ .Values.smf.service.pfcpPort }}
      targetPort: pfcp
      protocol: UDP
      name: pfcp
    {{- if .Values.smf.metrics.enabled }}
    - port: {{ .Values.smf.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    app.kubernetes.io/name: smf
    app.kubernetes.io/instance: {{ .Release.Name }}-smf
{{- end }}
