{{- if .Values.smf.enabled }}
{{- if gt (int .Values.smf.replicas) 1 }}
{{- fail "smf.replicas must be 1: every SMF pod signals the same PFCP Node ID, and a UPF keeps one association per Node ID (TS 29.244 §6.2.6.2.2), so a second pod would replace the first one's association and delete its sessions (#718)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-smf
  labels:
    app.kubernetes.io/name: smf
    app.kubernetes.io/instance: {{ .Release.Name }}-smf
    app.kubernetes.io/component: control-plane
    {{- include "nextgcore.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.smf.replicas }}
  # #718: never two SMF pods at once. Both signal the same PFCP Node ID (the
  # Service FQDN, #797), and a UPF that receives an Association Setup for a Node
  # ID it already has an association with replaces it, deleting the existing
  # association's sessions unless retention is requested (TS 29.244 §6.2.6.2.2).
  # A RollingUpdate surge pod holds no sessions, so it would delete every session
  # of the pod still serving the UEs. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: smf
      app.kubernetes.io/instance: {{ .Release.Name }}-smf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smf
        app.kubernetes.io/instance: {{ .Release.Name }}-smf
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # #718: a graceful SMF shutdown releases each UPF association (up to
      # T1 x (N1+1) = 12 s when a UPF is gone), sends every UE #39 and keeps
      # retransmitting its S5/S8 Delete Bearer Requests for up to 12 s.
      {{- /* #941 review MINOR 5: the budget is the grace period less 2 s, and the
             binary clamps a budget under 30 s up to 30 s, past a shorter grace
             period: the SIGKILL would land before the Association Release. */}}
      {{- if lt (int .Values.smf.terminationGracePeriodSeconds) 32 }}
      {{- fail (printf "smf.terminationGracePeriodSeconds must be at least 32 (the shutdown budget is it less 2 s, and at least 30 s); got %v" .Values.smf.terminationGracePeriodSeconds) }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.smf.terminationGracePeriodSeconds }}
      initContainers:
        {{- include "nextgcore.advertiseInit" (dict "nf" "smf") | nindent 8 }}
        {{- include "nextgcore.waitForNrf" . | nindent 8 }}
      containers:
        - name: smf
          image: {{ include "nextgcore.image" (dict "global" .Values.global "nf" .Values.smf) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args: ["-c", "/etc/nextgcore/smf.yaml"]
          ports:
            - name: sbi
              containerPort: {{ .Values.smf.service.sbiPort }}
              protocol: TCP
            - name: pfcp
              containerPort: {{ .Values.smf.service.pfcpPort }}
              protocol: UDP
            {{- if .Values.smf.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.smf.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- include "nextgcore.sbiProbes" . | nindent 10 }}
          volumeMounts:
            {{- include "nextgcore.configMounts" (dict "nf" "smf" "rewritten" true) | nindent 12 }}
          env:
            - name: NEXTGCORE_SBI_PROFILE
              # Issue #63: this NF defaults to the PRODUCTION SBI profile
              # (mutually-authenticated TLS + a required OAuth2 access token) and
              # REFUSES TO START without the certificates it names. The chart
              # mounts none by default, so it opts out explicitly. Set
              # global.sbiProfile=production once certs are provisioned.
              value: {{ .Values.global.sbiProfile | default "dev" | quote }}
            - name: RUST_LOG
              value: {{ .Values.global.logLevel }}
            - name: NEXTGCORE_SBI_ADVERTISE
              # #1312, #1322: the host registered with the NRF and put in every
              # callback URI, set apart from the bind so a wildcard bind can
              # never be advertised. The pod IP.
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RUST_BACKTRACE
              value: "1"
            # The shutdown's own deadline, derived from the grace period (#941).
            - name: SMF_SHUTDOWN_BUDGET_SECS
              value: "{{ sub (int .Values.smf.terminationGracePeriodSeconds) 2 }}"
            # /metrics defaults to 127.0.0.1 (#837); in the pod it must accept the
            # pod IP for Prometheus and the kubelet. Not exposed beyond the cluster.
            - name: NEXTGCORE_METRICS_BIND
              value: "0.0.0.0"
            - name: SMF_PFCP_ADDR
              value: "0.0.0.0"
            # #797: the PFCP Node ID identifies this CP function (TS 29.244
            # §5.8.1). The Service FQDN survives a pod restart; 0.0.0.0 identified
            # nothing and the pod IP changes on every restart.
            - name: SMF_PFCP_NODE_ID
              value: "{{ .Release.Name }}-smf.{{ .Release.Namespace }}.svc.cluster.local"
            # The CP F-SEID carries this pod's IP, which the UPF sends Session
            # Report Requests to (TS 29.244 §8.2.37).
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SMF_PFCP_ADVERTISE_ADDR
              value: "$(POD_IP)"
            {{- if .Values.upf.enabled }}
            # A hostname is re-resolved on every Association Setup attempt
            # (#658), so a restarted UPF pod at a new IP is found again.
            - name: UPF_PFCP_ADDR
              value: "{{ .Release.Name }}-upf.{{ .Release.Namespace }}.svc.cluster.local"
            {{- end }}
            - name: UPF_PFCP_PORT
              value: "{{ .Values.upf.service.pfcpPort }}"
      volumes:
        {{- include "nextgcore.configVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-smf
  labels:
    app.kubernetes.io/name: smf
    {{- include "nextgcore.labels" . | nindent 4 }}
spec:
  type: {{ .Values.smf.service.type }}
  ports:
    - port: {{ .Values.smf.service.sbiPort }}
      targetPort: sbi
      protocol: TCP
      name: sbi
    - port: {{ .Values.smf.service.pfcpPort }}
      targetPort: pfcp
      protocol: UDP
      name: pfcp
    {{- if .Values.smf.metrics.enabled }}
    - port: {{ .Values.smf.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    app.kubernetes.io/name: smf
    app.kubernetes.io/instance: {{ .Release.Name }}-smf
---
# #968/#983: the name the UPF's PFCP peer allowlist resolves. Headless, so it
# resolves to the SMF pod's own IP (the source address of its PFCP), not a
# ClusterIP; publishNotReadyAddresses so the SMF can associate before it is Ready.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-smf-pfcp
  labels:
    app.kubernetes.io/name: smf
    {{- include "nextgcore.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.smf.service.pfcpPort }}
      targetPort: pfcp
      protocol: UDP
      name: pfcp
  selector:
    app.kubernetes.io/name: smf
    app.kubernetes.io/instance: {{ .Release.Name }}-smf
{{- end }}
