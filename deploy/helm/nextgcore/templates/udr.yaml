{{- if .Values.udr.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-udr
  labels:
    app.kubernetes.io/name: udr
    app.kubernetes.io/instance: {{ .Release.Name }}-udr
    app.kubernetes.io/component: control-plane
    {{- include "nextgcore.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.udr.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: udr
      app.kubernetes.io/instance: {{ .Release.Name }}-udr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: udr
        app.kubernetes.io/instance: {{ .Release.Name }}-udr
      annotations:
        # Roll the pods when the rendered config changes; without this a
        # `helm upgrade` that only edits the ConfigMap leaves the old config
        # running, since the Deployment spec is unchanged.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
        {{- include "nextgcore.advertiseInit" (dict "nf" "udr") | nindent 8 }}
        {{- include "nextgcore.waitForNrf" . | nindent 8 }}
        {{- include "nextgcore.waitForMongo" . | nindent 8 }}
      containers:
        - name: udr
          image: {{ include "nextgcore.image" (dict "global" .Values.global "nf" .Values.udr) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args: ["-c", "/etc/nextgcore/udr.yaml"]
          ports:
            - name: sbi
              containerPort: {{ .Values.udr.service.port }}
              protocol: TCP
          {{- include "nextgcore.sbiProbes" . | nindent 10 }}
          volumeMounts:
            {{- include "nextgcore.configMounts" (dict "nf" "udr" "rewritten" true) | nindent 12 }}
          env:
            - name: NEXTGCORE_SBI_PROFILE
              # Issue #63: every NF's outbound SBI calls -- including its own NRF
              # registration and discovery -- follow the SBI profile, which
              # defaults to PRODUCTION (mTLS). Without this the NF starts but
              # cannot load its client certificate, never registers, and is
              # undiscoverable. The chart mounts none by default, so it opts out
              # explicitly. Set global.sbiProfile=production once certs exist.
              value: {{ .Values.global.sbiProfile | default "dev" | quote }}
            - name: RUST_LOG
              value: {{ .Values.global.logLevel }}
      volumes:
        {{- include "nextgcore.configVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-udr
  labels:
    app.kubernetes.io/name: udr
    {{- include "nextgcore.labels" . | nindent 4 }}
spec:
  type: {{ .Values.udr.service.type }}
  ports:
    - port: {{ .Values.udr.service.port }}
      targetPort: sbi
      protocol: TCP
      name: sbi
  selector:
    app.kubernetes.io/name: udr
    app.kubernetes.io/instance: {{ .Release.Name }}-udr
{{- end }}
