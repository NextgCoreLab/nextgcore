{{- if .Values.ausf.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ausf
  labels:
    app.kubernetes.io/name: ausf
    app.kubernetes.io/instance: {{ .Release.Name }}-ausf
    app.kubernetes.io/component: control-plane
    {{- include "nextgcore.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ausf.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ausf
      app.kubernetes.io/instance: {{ .Release.Name }}-ausf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ausf
        app.kubernetes.io/instance: {{ .Release.Name }}-ausf
      annotations:
        # Roll the pods when the rendered config changes; without this a
        # `helm upgrade` that only edits the ConfigMap leaves the old config
        # running, since the Deployment spec is unchanged.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
        {{- include "nextgcore.advertiseInit" (dict "nf" "ausf") | nindent 8 }}
        {{- include "nextgcore.waitForNrf" . | nindent 8 }}
      containers:
        - name: ausf
          image: {{ include "nextgcore.image" (dict "global" .Values.global "nf" .Values.ausf) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args: ["-c", "/etc/nextgcore/ausf.yaml"]
          ports:
            - name: sbi
              containerPort: {{ .Values.ausf.service.port }}
              protocol: TCP
            {{- if .Values.ausf.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.ausf.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- include "nextgcore.sbiProbes" . | nindent 10 }}
          volumeMounts:
            {{- include "nextgcore.configMounts" (dict "nf" "ausf" "rewritten" true) | nindent 12 }}
          env:
            - name: NEXTGCORE_SBI_PROFILE
              # Issue #63: this NF defaults to the PRODUCTION SBI profile
              # (mutually-authenticated TLS + a required OAuth2 access token) and
              # REFUSES TO START without the certificates it names. The chart
              # mounts none by default, so it opts out explicitly. Set
              # global.sbiProfile=production once certs are provisioned.
              value: {{ .Values.global.sbiProfile | default "dev" | quote }}
            - name: RUST_LOG
              value: {{ .Values.global.logLevel }}
            {{- if .Values.ausf.metrics.enabled }}
            # /metrics (#1334) defaults to 127.0.0.1 (#837); in the pod it must
            # accept the pod IP for Prometheus. Not exposed beyond the cluster.
            - name: NEXTGCORE_METRICS_BIND
              value: "0.0.0.0"
            - name: AUSF_METRICS_PORT
              value: "{{ .Values.ausf.metrics.port }}"
            {{- end }}
            - name: NEXTGCORE_SBI_ADVERTISE
              # #1312: the host registered with the NRF and put in callback
              # URIs, set apart from the bind so a wildcard bind can never be
              # advertised. The pod IP, which the init container also binds.
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: UDM_SBI_ADDR
              value: {{ .Release.Name }}-udm.{{ .Release.Namespace }}.svc.cluster.local
            - name: UDM_SBI_PORT
              value: "{{ .Values.udm.service.port }}"
      volumes:
        {{- include "nextgcore.configVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ausf
  labels:
    app.kubernetes.io/name: ausf
    {{- include "nextgcore.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ausf.service.type }}
  ports:
    - port: {{ .Values.ausf.service.port }}
      targetPort: sbi
      protocol: TCP
      name: sbi
    {{- if .Values.ausf.metrics.enabled }}
    - port: {{ .Values.ausf.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    app.kubernetes.io/name: ausf
    app.kubernetes.io/instance: {{ .Release.Name }}-ausf
{{- end }}
