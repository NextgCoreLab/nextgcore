# gNB addressing for EKS.
#
# Since nextgsim #286 the gNB takes HOSTNAMES for the AMF (amf_configs[].address)
# and the UPF (upf_addr) and re-resolves them: every reconnect attempt, and every
# 5 s for a named AMF, so an AMF pod that restarts at a new IP is found again
# (NG Setup re-run, UE contexts released) with no gNB restart. The Service names
# stay in the config; the headless amf/upf Services (headless-services.yaml) make
# them resolve to pod IPs, which is what lets a move be noticed.
#
# What is still resolved here: the gNB's OWN bind/advertise addresses.
# link_ip/ngap_ip/gtp_ip must be the pod IP, not 0.0.0.0: the gNB advertises
# them in NGAP and GTP-U, and a peer told 0.0.0.0 has nowhere to send return
# traffic.
#
# Before #286 the AMF and UPF names were rewritten to the IPs they had at pod
# start (nextgsim's config types were IpAddr), so an AMF restart stranded the gNB
# until it was restarted by hand.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnb
  namespace: nextg-system
spec:
  template:
    spec:
      initContainers:
        # Replaces the original "wait-amf" container, which just slept 5s and
        # printed that AMF "should be ready".
        - name: wait-amf
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              echo "[wait-amf] waiting for AMF NGAP endpoint..."
              i=0
              until nslookup amf.nextg-system.svc.cluster.local >/dev/null 2>&1; do
                i=$((i+1))
                [ "$i" -ge 60 ] && { echo "[wait-amf] FATAL: AMF DNS never resolved"; exit 1; }
                sleep 2
              done
              echo "[wait-amf] AMF DNS resolves."
              # NGAP is userspace SCTP over UDP, so a TCP connect check would
              # always fail. Probe the AMF SBI port instead, which is TCP and
              # comes up in the same process.
              i=0
              until nc -z amf.nextg-system.svc.cluster.local 7777; do
                i=$((i+1))
                [ "$i" -ge 60 ] && { echo "[wait-amf] FATAL: AMF SBI never accepted"; exit 1; }
                echo "[wait-amf] waiting for AMF SBI... ($i/60)"
                sleep 2
              done
              echo "[wait-amf] AMF ready."

        - name: resolve-dns
          image: busybox:1.36
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command:
            - sh
            - -c
            - |
              set -eu

              # fail fast if the pod IP is not a literal IPv4 address
              case "$POD_IP" in
                *[0-9].[0-9]*) ;;
                *) echo "[resolve-dns] FATAL: POD_IP is not an IPv4 address: '$POD_IP'" >&2; exit 1 ;;
              esac
              echo "[resolve-dns] pod IP: $POD_IP"

              cp /tmp/config-template/gnb.yaml /etc/nextgsim/gnb.yaml

              # Bind/advertise addresses only. The AMF and UPF stay Service
              # names: the gNB resolves and re-resolves them itself (#286).
              sed -i \
                -e "s|^\( *link_ip:\).*|\1 $POD_IP|" \
                -e "s|^\( *ngap_ip:\).*|\1 $POD_IP|" \
                -e "s|^\( *gtp_ip:\).*|\1 $POD_IP|" \
                /etc/nextgsim/gnb.yaml

              if grep -qE '0\.0\.0\.0' /etc/nextgsim/gnb.yaml; then
                echo "[resolve-dns] FATAL: a wildcard bind address survived:" >&2
                grep -nE '0\.0\.0\.0' /etc/nextgsim/gnb.yaml >&2
                exit 1
              fi

              echo "[resolve-dns] final gnb.yaml:"
              cat /etc/nextgsim/gnb.yaml
          volumeMounts:
            - name: config-template
              mountPath: /tmp/config-template/gnb.yaml
              subPath: gnb.yaml
              readOnly: true
            - name: config-resolved
              mountPath: /etc/nextgsim
      containers:
        - name: gnb
          # Replaces `kill -0 1`, which only asks whether PID 1 exists and so
          # passes for a wedged process. The gNB's RLS listener on UDP 4997 is
          # the first thing a UE needs, so bind state is the useful signal.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                # /proc/net/udp, not netstat/ss: the sim images are
                # debian:bookworm-slim + ca-certificates + libsctp1 only
                # (Dockerfile.gnb-local), so neither net-tools nor
                # iproute2 is installed and a netstat probe would always fail,
                # crash-looping a healthy pod. 4997 = 0x1385.
                - "grep -qi ':1385' /proc/net/udp"
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                # /proc/net/udp, not netstat/ss: the sim images are
                # debian:bookworm-slim + ca-certificates + libsctp1 only
                # (Dockerfile.gnb-local), so neither net-tools nor
                # iproute2 is installed and a netstat probe would always fail,
                # crash-looping a healthy pod. 4997 = 0x1385.
                - "grep -qi ':1385' /proc/net/udp"
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
