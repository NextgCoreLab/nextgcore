---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgwc
  namespace: nextg-epc
  labels: &id001
    app.kubernetes.io/name: sgwc
    app.kubernetes.io/part-of: nextg-epc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sgwc
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: sgwc
        image: nextgcore-rust/sgwc:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - /epc/scripts/epc-run.sh
        - sgwc
        - nf-binary
        - -c
        - /run/epc/cfg/sgwc.yaml
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RUST_LOG
          value: info
        - name: RUST_BACKTRACE
          value: '1'
        - name: EPC_EXPORT
          value: SGWC_PGW_S5C=pgwc SGWC_GTPU_ADVERTISE=sgwu
        # TS 23.007 §18: the GTP-C restart counter must survive the restart it
        # signals. The image's /var/lib/nextgcore is the container's writable
        # layer, which a container restart (the liveness probe's remedy) discards,
        # so every restart advertised Recovery 1 again and no peer could see it.
        # /run/epc is the pod's emptyDir, which outlives container restarts.
        - name: SGWC_RESTART_COUNTER_FILE
          value: /run/epc/sgwc-restart-counter
        volumeMounts:
        - name: templates
          mountPath: /epc/templates
          readOnly: true
        - name: scripts
          mountPath: /epc/scripts
          readOnly: true
        - name: run
          mountPath: /run/epc
        livenessProbe:
          exec:
            command:
            - sh
            - /epc/scripts/epc-peers-check.sh
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 2
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
      volumes:
      - name: templates
        configMap:
          name: epc-configs
          items:
          - key: sgwc.yaml
            path: sgwc.yaml
      - name: scripts
        configMap:
          name: epc-scripts
          defaultMode: 493
      - name: run
        emptyDir: {}
      terminationGracePeriodSeconds: 5
      nodeSelector:
        nextg.io/dataplane: 'true'
---
apiVersion: v1
kind: Service
metadata:
  name: pgwc
  namespace: nextg-epc
  labels:
    app.kubernetes.io/name: pgwc
    app.kubernetes.io/part-of: nextg-epc
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: pgwc
  ports:
  - name: gtpc
    port: 2123
    targetPort: 2123
    protocol: UDP
  - name: pfcp
    port: 8805
    targetPort: 8805
    protocol: UDP
  - name: gtpu
    port: 2152
    targetPort: 2152
    protocol: UDP
  - name: sbi
    port: 7777
    targetPort: 7777
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgwc
  namespace: nextg-epc
  labels: &id001
    app.kubernetes.io/name: pgwc
    app.kubernetes.io/part-of: nextg-epc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pgwc
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: pgwc
        image: nextgcore-rust/smf:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - /epc/scripts/epc-run.sh
        - pgwc
        - nf-binary
        - -c
        - /run/epc/cfg/pgwc.yaml
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RUST_LOG
          value: info
        - name: RUST_BACKTRACE
          value: '1'
        - name: UPF_PFCP_PORT
          value: '8805'
        - name: NEXTGCORE_SBI_PROFILE
          value: dev
        # smfd re-resolves a hostname UPF_PFCP_ADDR on every PFCP association
        # attempt (#658), so the PGW-U is named by its Service and is not a
        # liveness-tracked peer: a restarted PGW-U is found again without
        # restarting the PGW-C. The PFCP Node ID is the PGW-C's Service FQDN
        # (#797): the pod IP it binds changes on every restart, and a new Node ID
        # looks like a different CP function to the PGW-U (TS 29.244 §5.8.1).
        - name: EPC_EXPORT
          value: SMF_PFCP_ADDR=self SMF_PFCP_NODE_ID=dns:pgwc UPF_PFCP_ADDR=dns:pgwu
        - name: EPC_UNTRACKED
          value: pgwu
        volumeMounts:
        - name: templates
          mountPath: /epc/templates
          readOnly: true
        - name: scripts
          mountPath: /epc/scripts
          readOnly: true
        - name: run
          mountPath: /run/epc
        livenessProbe:
          exec:
            command:
            - sh
            - /epc/scripts/epc-peers-check.sh
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 2
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - curl -fsS http://localhost:9090/metrics | grep -q '^smf_up 1$'
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: templates
        configMap:
          name: epc-configs
          items:
          - key: pgwc.yaml
            path: pgwc.yaml
      - name: scripts
        configMap:
          name: epc-scripts
          defaultMode: 493
      - name: run
        emptyDir: {}
      terminationGracePeriodSeconds: 5
      nodeSelector:
        nextg.io/dataplane: 'true'
---
apiVersion: v1
kind: Service
metadata:
  name: pgwu
  namespace: nextg-epc
  labels:
    app.kubernetes.io/name: pgwu
    app.kubernetes.io/part-of: nextg-epc
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: pgwu
  ports:
  - name: pfcp
    port: 8805
    targetPort: 8805
    protocol: UDP
  - name: gtpu
    port: 2152
    targetPort: 2152
    protocol: UDP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgwu
  namespace: nextg-epc
  labels: &id001
    app.kubernetes.io/name: pgwu
    app.kubernetes.io/part-of: nextg-epc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pgwu
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: pgwu
        image: nextgcore-rust/upf:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - /epc/scripts/epc-run.sh
        - pgwu
        - nf-binary
        - -c
        - /run/epc/cfg/pgwu.yaml
        - --pfcp-addr
        - $(POD_IP)
        - --gtpu-addr
        - $(POD_IP)
        - --tun-ip
        - 10.45.0.1
        - --tun-prefix
        - '16'
        - --tun-ifname
        - epctun
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RUST_LOG
          value: info
        - name: RUST_BACKTRACE
          value: '1'
        volumeMounts:
        - name: templates
          mountPath: /epc/templates
          readOnly: true
        - name: scripts
          mountPath: /epc/scripts
          readOnly: true
        - name: run
          mountPath: /run/epc
        - name: dev-tun
          mountPath: /dev/net/tun
        livenessProbe:
          exec:
            command:
            - sh
            - /epc/scripts/epc-peers-check.sh
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 2
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - curl -fsS http://localhost:9090/metrics | grep -q '^upf_up 1$'
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 6
        securityContext:
          privileged: true
          runAsUser: 0
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_ADMIN
      volumes:
      - name: templates
        configMap:
          name: epc-configs
          items:
          - key: pgwu.yaml
            path: pgwu.yaml
      - name: scripts
        configMap:
          name: epc-scripts
          defaultMode: 493
      - name: run
        emptyDir: {}
      - name: dev-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      terminationGracePeriodSeconds: 5
      initContainers:
      - name: sysctls
        image: busybox:1.36
        command:
        - sh
        - -c
        - set -e; for kv in net.ipv4.ip_forward=1; do sysctl -w "$kv"; done
        securityContext:
          privileged: true
          runAsUser: 0
      nodeSelector:
        nextg.io/dataplane: 'true'
