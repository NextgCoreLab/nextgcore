# PROFILE=epc: nextgcore's standalone EPC plus nextgsim's LTE eNB and UE,
# translated from docker/rust/docker-compose-epc.yml (the nightly EPC stage).
#
# The nine pods are deliberately uniform; keep them so when editing.
#
# Every pod starts through scripts/epc-run.sh, which rewrites the compose
# addresses (172.24.0.N) to pod IPs and records them for the
# epc-peers-check.sh liveness probe. Services are headless with
# publishNotReadyAddresses, so a peer resolves to its pod IP as soon as it has
# one. S1-MME is kernel SCTP (mmed and lte-enb built with kernel-sctp, as
# Dockerfile.builder does for the nightly); profile.env's postrender rewrites
# the mme Service's s1ap port protocol when S1AP_PROTOCOL says otherwise.
#
# Every pod is pinned to the nextg.io/dataplane=true node(s), the same nodes the
# 5G profile's privileged UPF uses (CloudFormation EnableDataPlanePrivileges):
# SGW-U, PGW-U and the UE are privileged, and the MME and eNB need the node's
# `sctp` kernel module, so one node set has to provide both.
apiVersion: v1
kind: Service
metadata:
  name: hss
  namespace: nextg-epc
  labels:
    app.kubernetes.io/name: hss
    app.kubernetes.io/part-of: nextg-epc
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: hss
  ports:
  - name: diameter
    port: 3868
    targetPort: 3868
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hss
  namespace: nextg-epc
  labels: &id001
    app.kubernetes.io/name: hss
    app.kubernetes.io/part-of: nextg-epc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hss
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: hss
        image: nextgcore-rust/hss:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - /epc/scripts/epc-run.sh
        - hss
        - nf-binary
        - -c
        - /run/epc/cfg/hss.yaml
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RUST_LOG
          value: info
        - name: RUST_BACKTRACE
          value: '1'
        # The MME dials the HSS (S6a), and the HSS answers and sends CLR/IDR over
        # that connection, so the HSS has no use for the MME's address at start.
        # Tracking it made the HSS restart whenever the MME moved, which dropped
        # the new MME's S6a connection right after it was set up.
        - name: EPC_UNTRACKED
          value: mme
        volumeMounts:
        - name: templates
          mountPath: /epc/templates
          readOnly: true
        - name: scripts
          mountPath: /epc/scripts
          readOnly: true
        - name: run
          mountPath: /run/epc
        livenessProbe:
          exec:
            command:
            - sh
            - /epc/scripts/epc-peers-check.sh
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 2
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
      volumes:
      - name: templates
        configMap:
          name: epc-configs
          items:
          - key: hss.yaml
            path: hss.yaml
          - key: hss.conf
            path: hss.conf
      - name: scripts
        configMap:
          name: epc-scripts
          defaultMode: 493
      - name: run
        emptyDir: {}
      terminationGracePeriodSeconds: 5
      nodeSelector:
        nextg.io/dataplane: 'true'
---
