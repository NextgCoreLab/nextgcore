---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lte-ue
  namespace: nextg-epc
  labels: &id001
    app.kubernetes.io/name: lte-ue
    app.kubernetes.io/part-of: nextg-epc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lte-ue
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: lte-ue
        image: nextgsim-lte-ue:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - /epc/scripts/epc-run.sh
        - lte-ue
        - lte-ue
        - -c
        - /run/epc/cfg/lte-ue.yaml
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RUST_LOG
          value: info
        - name: RUST_BACKTRACE
          value: '1'
        volumeMounts:
        - name: templates
          mountPath: /epc/templates
          readOnly: true
        - name: scripts
          mountPath: /epc/scripts
          readOnly: true
        - name: run
          mountPath: /run/epc
        - name: dev-tun
          mountPath: /dev/net/tun
        livenessProbe:
          exec:
            command:
            - sh
            - /epc/scripts/epc-peers-check.sh
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 2
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
        securityContext:
          runAsUser: 0
          capabilities:
            add:
            - NET_ADMIN
      volumes:
      - name: templates
        configMap:
          name: epc-configs
          items:
          - key: lte-ue.yaml
            path: lte-ue.yaml
      - name: scripts
        configMap:
          name: epc-scripts
          defaultMode: 493
      - name: run
        emptyDir: {}
      - name: dev-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      terminationGracePeriodSeconds: 5
      initContainers:
      - name: sysctls
        image: busybox:1.36
        command:
        - sh
        - -c
        - set -e; for kv in net.ipv4.conf.all.rp_filter=2 net.ipv4.conf.default.rp_filter=2;
          do sysctl -w "$kv"; done
        securityContext:
          privileged: true
          runAsUser: 0
      nodeSelector:
        nextg.io/dataplane: 'true'
