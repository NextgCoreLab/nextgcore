# Default overlay: PROFILE=5g.
#
# The overlays live in profiles/<profile>/ (5g, epc, ...). This file keeps
# `kubectl kustomize deploy/eks` rendering the 5G profile, as it did before
# profiles existed. deploy-eks.sh renders profiles/$PROFILE directly.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - profiles/5g
