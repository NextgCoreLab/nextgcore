# Fixes a crash-loop present in the Kind manifests.
#
# k8s/manifests/configmap.yaml (udm.yaml section) points the UDM at:
#     hnet:
#       - id: 1, scheme: 1, key: /etc/nextgcore/hnet/curve25519-1.key
#       - id: 2, scheme: 2, key: /etc/nextgcore/hnet/secp256r1-2.key
#
# but k8s/manifests/udm.yaml mounts ONLY udm.yaml. Nothing ever places those
# key files in the pod, so the UDM fails at startup.
#
# These are the SUCI de-concealment private keys - the UDM is the one place
# where a concealed SUPI is recovered. They belong in a Secret, not a
# ConfigMap. The key material itself is generated into the Secret by
# deploy-eks.sh from nextgcore/docker/rust/configs/5gc/hnet/, which holds the
# repo's development keys.
#
# A Secret is base64, not encryption. For anything beyond a lab, source these
# from KMS or an external secrets store.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udm
  namespace: nextg-system
spec:
  template:
    spec:
      containers:
        - name: udm
          volumeMounts:
            - name: config
              mountPath: /etc/nextgcore/udm.yaml
              subPath: udm.yaml
              readOnly: true
            - name: hnet-keys
              mountPath: /etc/nextgcore/hnet
              readOnly: true
            - name: logs
              mountPath: /var/log/nextgcore
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: nextgcore-configs
        - name: hnet-keys
          secret:
            secretName: udm-hnet-keys
            defaultMode: 0400
        - name: logs
          emptyDir: {}
