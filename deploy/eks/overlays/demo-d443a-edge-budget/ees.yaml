# eesd for demo d443a-edge-budget (nextgsim#471): the EES the EAS sidecars
# register at (EDGE-3) and the UE's EEC registers at (EDGE-1), built with
# --features demo-d443a-edge-budget. ClusterIP Service only.
#
# - ees.yaml (a toggle target: the demo: block is merged in at render time)
#   holds ees.edge_budget: the QOS_MON consumer subscribes at smfd for any UE,
#   PERIODIC every 2 s, deadline 15 ms (EES local policy). The EAS N6 endpoints
#   are their registered endPt addresses (10.60.0.11-13), which smfd measures.
# - JWKS: eesd verifies every eees-* token against the NRF's JWKS. The NRF
#   generates its signing key at start, so scenario.sh fetches
#   /nnrf-oauth2/v1/jwks once the NRF is up, stores it in the ConfigMap
#   d443a-ees-jwks and only then scales eesd from 0 to 1 (a missing ConfigMap
#   keeps the pod Pending: never a JWKS-less eesd that refuses everything).
# - The QOS_MON notify carries no token (TS 33.501 §13.4.1); eesd admits it on
#   its path token through the registered OAuth2 callback exemption (#1525).
#
# STAND-IN, labelled: the EES is not an NRF-registered NF (TS 29.510 NFType has
# no EES; TS 23.558 §6.2 has EASes find the EES by pre-configuration or CAPIF),
# and the NRF (#1391) grants an eees-* scope only if a producer of the target
# type offering it is registered. The nrf-standin sidecar therefore registers a
# profile with the custom nfType "EES" and the two eees-* services at the NRF,
# and re-registers it every 30 s (heartBeatTimer 60), so the NRF can issue the
# EAS and EEC tokens. nrfd is not relaxed. Only the oauth2 arm makes eesd an NRF
# client too (an AF, --nrf-uri, #1581), for its token toward an OAuth2 smfd.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ees-config
  labels:
    app.kubernetes.io/part-of: nextgcore
data:
  ees.yaml: |
    logger:
      level: info
    ees:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
      edge_budget:
        smf_uri: http://smf.nextg-system.svc.cluster.local:7777
        deadline_ms: 15
        rep_period_s: 2
  nrf-standin.sh: |
    # The labelled stand-in EES profile at the NRF (see ees.yaml's header).
    set -u
    id=6b1d7e3c-0000-4000-8000-00000000471e
    svc() { printf '{"serviceInstanceId":"%s","serviceName":"%s","versions":[{"apiVersionInUri":"v1","apiFullVersion":"1.0.0"}],"scheme":"http","nfServiceStatus":"REGISTERED"}' "$1" "$1"; }
    body="{\"nfInstanceId\":\"${id}\",\"nfType\":\"EES\",\"nfStatus\":\"REGISTERED\",\"heartBeatTimer\":60,\"ipv4Addresses\":[\"${POD_IP}\"],\"nfServices\":[$(svc eees-easregistration),$(svc eees-eecregistration)]}"
    # Over TLS with the stand-in's own certificate (#1617): Secret
    # nf-tls-ees-standin, whose urn:uuid is ${id} and whose NFTypes is EES (the
    # container's NEXTGCORE_NRF_TLS_* env). The NRF is dialled by the name
    # nrf.crt carries, `nrf`: the Service, in this pod's namespace.
    while :; do
      code="$(curl -s --http2 --cacert "${NEXTGCORE_NRF_TLS_CA}" \
        --cert "${NEXTGCORE_NRF_TLS_CLIENT_CERT}" --key "${NEXTGCORE_NRF_TLS_CLIENT_KEY}" \
        --max-time 5 -o /dev/null -w '%{http_code}' -X PUT \
        -H 'Content-Type: application/json' -d "${body}" \
        "https://${NEXTGCORE_NRF_TLS_SERVER_NAME}:7777/nnrf-nfm/v1/nf-instances/${id}")"
      echo "$(date -u +%FT%TZ) [d443a nrf-standin] stand-in EES profile ${id} (nfType EES, eees-easregistration, eees-eecregistration) PUT -> ${code}"
      sleep 30
    done
---
apiVersion: v1
kind: Service
metadata:
  name: ees
  labels:
    app.kubernetes.io/name: ees
    app.kubernetes.io/part-of: nextgcore
spec:
  selector:
    app.kubernetes.io/name: ees
  ports:
    - name: sbi
      port: 7777
      targetPort: 7777
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ees
  labels:
    app.kubernetes.io/name: ees
    app.kubernetes.io/part-of: nextgcore
spec:
  # scenario.sh scales it to 1 once d443a-ees-jwks holds the NRF's JWKS.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ees
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ees
        app.kubernetes.io/part-of: nextgcore
    spec:
      # #1617: the nf-tls files are group fsGroup, mode 0440, and every container
      # of the pod runs with fsGroup as a supplementary group, so the NF reads
      # its key as the image's non-root user (any gid works; 999 is the image's).
      securityContext:
        fsGroup: 999
      automountServiceAccountToken: false
      containers:
        - name: ees
          image: nextgcore-rust/ees:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/nextgcore/ees.yaml"
            - "--sbi-addr"
            - "0.0.0.0"
            - "--sbi-port"
            - "7777"
            - "--oauth2-jwks-file"
            - "/etc/nextgcore/jwks/jwks.json"
          ports:
            - containerPort: 7777
              name: sbi
            - containerPort: 9090
              name: metrics
          env:
            # #1617: NF -> NRF over TLS with this pod's own certificate (Secret
            # nf-tls-ees, issued at deploy time by k8s/nf-tls-secrets.sh). The NRF URI
            # dials the cluster FQDN; nrf.crt names DNS:nrf, so that is the name checked.
            - name: NEXTGCORE_NRF_TLS_CA
              value: /etc/nextgcore/certs/ca.crt
            - name: NEXTGCORE_NRF_TLS_CLIENT_CERT
              value: /etc/nextgcore/certs/ees.crt
            - name: NEXTGCORE_NRF_TLS_CLIENT_KEY
              value: /etc/nextgcore/certs/ees.key
            - name: NEXTGCORE_NRF_TLS_SERVER_NAME
              value: nrf
            # #1795: eesd's listener follows the SBI profile, and the default
            # production profile serves TLS from /etc/nextgcore/tls, which this pod
            # does not mount. h2c like the base NFs (k8s/manifests), as the oauth2
            # arm of scenario.sh already sets.
            - name: NEXTGCORE_SBI_PROFILE
              value: "dev"
            # Pinned to the urn:uuid of ees.crt (docker/rust/certs/nf-identities.txt).
            - name: NEXTGCORE_NF_INSTANCE_ID
              value: "6b1d7e3c-0000-4000-8000-0000000000e5"
            - name: RUST_LOG
              value: info
            - name: EES_METRICS_PORT
              value: "9090"
            # In-cluster only (ClusterIP); demo-check.sh scrapes it with kubectl exec.
            - name: NEXTGCORE_METRICS_BIND
              value: "0.0.0.0"
            # The notifUri smfd calls back: the pod IP, never a wildcard.
            - name: NEXTGCORE_SBI_ADVERTISE
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          volumeMounts:
            # Its own Secret only (#1617).
            - name: nf-tls
              mountPath: /etc/nextgcore/certs
              readOnly: true
            - name: config
              mountPath: /etc/nextgcore/ees.yaml
              subPath: ees.yaml
              readOnly: true
            - name: jwks
              mountPath: /etc/nextgcore/jwks
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 3
            periodSeconds: 5
        - name: nrf-standin
          image: nextgcore-rust/ees:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "/d443a/nrf-standin.sh"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NEXTGCORE_NRF_TLS_CA
              value: /etc/nextgcore/certs/ca.crt
            - name: NEXTGCORE_NRF_TLS_CLIENT_CERT
              value: /etc/nextgcore/certs/ees-standin.crt
            - name: NEXTGCORE_NRF_TLS_CLIENT_KEY
              value: /etc/nextgcore/certs/ees-standin.key
            - name: NEXTGCORE_NRF_TLS_SERVER_NAME
              value: nrf
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /d443a/nrf-standin.sh
              subPath: nrf-standin.sh
              readOnly: true
            # Its own Secret only (#1617): uid 65534 reads it through the pod's
            # fsGroup.
            - name: nf-tls-standin
              mountPath: /etc/nextgcore/certs
              readOnly: true
      volumes:
        - name: nf-tls-standin
          secret:
            secretName: nf-tls-ees-standin
            defaultMode: 0440
        # #1617: this pod's certificate and key and the CA certificate, mode 0440
        # to the pod's fsGroup. Never the CA key: it does not leave the deploy host.
        - name: nf-tls
          secret:
            secretName: nf-tls-ees
            defaultMode: 0440
        - name: config
          configMap:
            name: ees-config
        - name: jwks
          configMap:
            name: d443a-ees-jwks
