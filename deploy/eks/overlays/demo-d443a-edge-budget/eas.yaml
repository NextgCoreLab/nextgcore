# The three EAS sidecars of demo d443a-edge-budget (nextgsim#471) and their
# data network "dn". No Service, no port.
#
# Where they run: a second container of the upf pod (patches/upf-eas.yaml, not
# privileged), each EAS in a network namespace of its own behind a bridge in the
# UPF's namespace:
#
#     UE --GTP-U--> upfd --ogstun--> [UPF netns] eas-br 10.60.0.1/24
#                                        |-- veth --> [eas-local]    10.60.0.11
#                                        |-- veth --> [eas-regional] 10.60.0.12
#                                        `-- veth --> [eas-cloud]    10.60.0.13
#
# In each: nr-she-eas, as nobody with no capabilities (setpriv), with
#   - the STAMP Session-Reflector on <ip>:8620 (upfd's N6 probes; smfd
#     provisions port 8620 in core-configs.yaml),
#   - the job listener on <ip>:9471 (the UE's jobs, through the PDU session),
#   - its EDGE-3 registration at eesd (endPt ipv4Addrs [<ip>]).
# UE traffic to dn keeps its 10.45.0.0/16 source (UPF_NAT_EXCLUDE=10.60.0.0/24),
# so EAS-EXEC logs the UE's address; the EASes' own calls (eesd, NRF, DNS) leave
# masqueraded to the pod IP. The EASes are reachable from UEs through the UPF
# only: dn is inside the upf pod and nothing routes to it from the pod network.
#
# Distance (labelled, emulated): netem on an EAS's veth (its egress toward the
# UPF) is the demo's "eas-local is far away"; scenario.sh adds and removes it.
#
# The sidecar (sidecar.sh) builds dn and waits: scenario.sh hands it each EAS's
# CCA key (generated by scenario.sh, its JWK trusted at the NRF) and a start file
# naming each EAS's extra flags (the load act's --load, the revert arm's
# --no-kpi-patch). eas.yaml is the common part of each EAS's config, and a
# toggle target: the demo: block is merged in at render time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: d443a-eas
  labels:
    app.kubernetes.io/part-of: nextgsim
data:
  eas.yaml: |
    ees:
      api_root: "http://ees.nextg-system.svc.cluster.local:7777"
      oauth2:
        nrf: "http://nrf.nextg-system.svc.cluster.local:7777"
        nf_instance_id: "@ID@"
        cca_key_file: "/tmp/d443a/cca/@EAS@.key"
        register: true
    stamp_port: 8620
    job_port: 9471
    check_interval_s: 2
  # eas_id address max_resp_time_ms avl_comp nf_instance_id (the plan's and
  # #1523's fixtures: local 10 ms / 50, regional 14 / 50, cloud 40 / 200).
  eases: |
    eas-local 10.60.0.11 10 50 6b1d7e3c-0000-4000-8000-0000000471a1
    eas-regional 10.60.0.12 14 50 6b1d7e3c-0000-4000-8000-0000000471a2
    eas-cloud 10.60.0.13 40 200 6b1d7e3c-0000-4000-8000-0000000471a3
  sidecar.sh: |
    set -eu
    D=/tmp/d443a
    mkdir -p "$D/cca"
    # Traversable, not listable, by nobody: each key is handed to nobody alone.
    chmod 0711 "$D" "$D/cca"
    say() { echo "$(date -u +%FT%TZ) [d443a-sidecar] $*"; }
    # A restarted container finds the pod's network namespace as it left it.
    if ip link show eas-br >/dev/null 2>&1; then
      say "FATAL: dn already exists (this container restarted); the pod must be recreated"
      exec sleep infinity
    fi
    # dn: a bridge in the UPF's namespace, one namespace per EAS.
    ip link add eas-br type bridge
    ip addr add 10.60.0.1/24 dev eas-br
    ip link set eas-br up
    while read -r id ip mr av nf; do
      [ -n "$id" ] || continue
      ns="${id}"
      ip netns add "$ns"
      ip link add "${id#eas-}-up" type veth peer name eth0 netns "$ns"
      ip link set "${id#eas-}-up" master eas-br up
      ip -n "$ns" addr add "$ip/24" dev eth0
      ip -n "$ns" link set lo up
      ip -n "$ns" link set eth0 up
      ip -n "$ns" route add default via 10.60.0.1
      say "$id: namespace $ns, $ip/24 via eas-br"
    done <<EASES
    ${D443A_EASES}
    EASES
    # The EASes' own calls (eesd, the NRF, DNS) leave masqueraded to the pod IP;
    # UE traffic into dn is not touched (upfd excludes 10.60.0.0/24 from its NAT).
    iptables -t nat -A POSTROUTING -s 10.60.0.0/24 ! -d 10.60.0.0/24 -j MASQUERADE
    touch "$D/ready"
    say "dn ready; waiting for $D/start"
    while [ ! -e "$D/start" ]; do sleep 1; done
    while read -r id ip mr av nf; do
      [ -n "$id" ] || continue
      key="$D/cca/$id.key"
      [ -s "$key" ] || { say "FATAL: no CCA key for $id"; exit 1; }
      chown 65534:65534 "$key"; chmod 0400 "$key"
      cfg="$D/$id.yaml"
      { printf '%s\n' "${D443A_EAS_YAML}" | sed -e "s/@ID@/$nf/" -e "s/@EAS@/$id/"
        printf 'eas_id: %s\naddress: %s\nmax_resp_time_ms: %s\navl_comp: %s\n' "$id" "$ip" "$mr" "$av"
      } >"$cfg"
      chmod 0644 "$cfg"
      args="$(sed -n "s/^$id: *//p" "$D/start")"
      say "$id: starting nr-she-eas -c $cfg $args"
      # shellcheck disable=SC2086  # $args is the start file's flag list
      ( sh -c "echo \$\$ >$D/$id.pid; exec ip netns exec $id setpriv --reuid=65534 --regid=65534 \
          --clear-groups --inh-caps=-all --bounding-set=-all --no-new-privs \
          nr-she-eas -c $cfg $args" 2>&1 | sed -u "s/^/[$id] /"
        say "$id: nr-she-eas exited" ) &
    done <<EASES
    ${D443A_EASES}
    EASES
    # An EAS that exits is logged, never a container restart (which would find
    # dn already built): the scenario's checks see it gone.
    wait
    say "every nr-she-eas has exited; idling"
    exec sleep infinity
