# The gNB at info in this overlay (nextgsim#477). The base gnb.yaml runs
# nextgsim_gnb, sctp, ngap and gtp at debug, which logs every user-plane packet
# (rls::task, gtp::task): at the stream's 50 datagrams per second the log grows
# 1.3-1.7 MB a minute and kubelet rotates it within minutes, which would take
# the throttle chain's gNB lines out of `kubectl logs` on a slower run, as it
# took the UE's on devtest1. Both gNB lines the scenario asserts (PDU Session
# Resource Modify Request / Response sent to AMF) are info in
# nextgsim_gnb::ngap::task.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnb
spec:
  template:
    spec:
      containers:
        - name: gnb
          env:
            - name: RUST_LOG
              value: info
