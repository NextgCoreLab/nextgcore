# nefd for demo d445a-fl-t8 (nextgsim#480). ClusterIP only.
#
# The image is the overlay's nef build with --features demo-d445a-fl-t8
# (deploy/eks/profiles/demo/profile.env adds it for this overlay). The demo
# block is merged into nef.yaml at render time (toggles.yaml).
#
# Wiring (TS 23.502 §4.15.10 and §4.15.3.2.3):
#   --bsf-uri      UE ID retrieval step 7-8, Nbsf_Management_Discovery by ipv4Addr;
#   --udm-uri      steps 9-10 (Nudm_SDM GetSupiOrGpsi, EXT_ID), the T8 externalId
#                  to SUPI resolution, and Nudm_EE_Subscribe for LOSS_OF_CONNECTIVITY,
#                  which udmd forwards to the serving AMF (step 3a, nextgcore#1449);
#   --nrf-uri      registration (the nnef-ueid service, allowedNfTypes [AF]) and
#                  the JWKS the UE ID route verifies AF tokens against.
#
# NO NEXTGCORE_SBI_OAUTH2_REQUIRE: nextgcore-sbi applies it to every route,
# including /nnef-eventexposure/v1/notify/{id}, and amfd notifies without a
# token (TS 33.501 §13.4.1; nextgcore#1421). It would 401 the LoC notification
# and break the chain. The UE ID route checks its own token whatever the
# listener does (scenario.sh's auth arm asserts 401/403 and no identity).
#
# Host names say nextg-system; the 6G post-render rewrites them to this
# namespace, as for every other NF.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nef-config
  labels:
    app.kubernetes.io/part-of: nextgcore
data:
  nef.yaml: |
    logger:
      level: info
---
apiVersion: v1
kind: Service
metadata:
  name: nef
  labels:
    app.kubernetes.io/name: nef
    app.kubernetes.io/part-of: nextgcore
spec:
  selector:
    app.kubernetes.io/name: nef
  ports:
    - name: sbi
      port: 7777
      targetPort: 7777
    # /metrics, cluster-internal: this Service is ClusterIP.
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nef
  labels:
    app.kubernetes.io/name: nef
    app.kubernetes.io/part-of: nextgcore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nef
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nef
        app.kubernetes.io/part-of: nextgcore
    spec:
      initContainers:
        - name: wait-nrf
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z nrf.nextg-system.svc.cluster.local 7777; do echo waiting for nrf; sleep 2; done']
      containers:
        - name: nef
          image: nextgcore-rust/nef:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/nextgcore/nef.yaml"
            - "--sbi-addr"
            - "0.0.0.0"
            - "--sbi-port"
            - "7777"
            - "--nrf-uri"
            - "http://nrf.nextg-system.svc.cluster.local:7777"
            - "--udm-uri"
            - "http://udm.nextg-system.svc.cluster.local:7777"
            - "--bsf-uri"
            - "http://bsf.nextg-system.svc.cluster.local:7777"
          ports:
            - containerPort: 7777
              name: sbi
            - containerPort: 9090
              name: metrics
          env:
            - name: NEXTGCORE_SBI_PROFILE
              value: "dev"
            - name: RUST_LOG
              value: info
            # /metrics (only while the demo is on) on the pod IP for the in-pod
            # scrape; reached through the ClusterIP Service only.
            - name: NEF_METRICS_PORT
              value: "9090"
            - name: NEXTGCORE_METRICS_BIND
              value: "0.0.0.0"
            # Registered with the NRF, and the base of the notify URI given to udmd.
            - name: NEXTGCORE_SBI_ADVERTISE
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RUST_BACKTRACE
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nextgcore/nef.yaml
              subPath: nef.yaml
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: nef-config
