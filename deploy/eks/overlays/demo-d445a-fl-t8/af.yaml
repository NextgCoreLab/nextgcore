# The FL application server (AF, nr-fl-server) of demo d445a-fl-t8
# (nextgsim#480) and its N6 data network "fl-dn". No Service, no port.
#
# Where it runs: a second container of the upf pod (patches/upf-af.yaml, not
# privileged; nr-fl-server runs as nobody), in a network namespace of its own, fl-dn, joined to the UPF's namespace by a veth
# pair:
#
#     UE --GTP-U--> upfd --ogstun--> [UPF netns] fl-up 10.46.0.1/24
#                                        |  veth
#                                    [fl-dn netns] fl-af 10.46.0.10/24  <- nr-fl-server
#
# So FL traffic really is routed out of the UPF onto a DN: it leaves through
# POSTROUTING, where the wrapper's MASQUERADE for 10.45.0.0/16 applies, and
# upfd's --nat-exclude 10.46.0.0/24 (UPF_NAT_EXCLUDE, #1455) is what keeps the
# UE source address. The AF identifies each member by that address through
# nefd (TS 23.502 §4.15.10). A pod-network AF would not work on EKS: the VPC
# has no route back to 10.45.0.0/16.
#
# The T8 callback listener: nefd posts to <upf pod IP>:7481, DNATed to
# 10.46.0.10:7481, so nefd's own source address is kept (the AF counts callback
# slots per source; no SNAT). UEs may not reach it: a FORWARD rule drops
# 10.45.0.0/16 -> 10.46.0.10:7481. The AF's own calls (NRF, nefd, DNS) leave
# fl-dn masqueraded to the pod IP.
#
# The sidecar (sidecar.sh) builds fl-dn, starts the pcap on fl-up and then
# waits: scenario.sh hands it the arm's config (this file, adjusted per arm),
# the AF's CCA key (generated by scenario.sh, its JWK trusted at the NRF) and a
# start line naming the binary and flags. Everything is passed by env var or
# kubectl exec, not a volume: deploy-eks.sh's data-plane swap replaces the upf
# pod's volume list.
#
# The demo: block is merged into af.yaml at render time (toggles.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: d445a-af
  labels:
    app.kubernetes.io/part-of: nextgsim
data:
  af.yaml: |
    listen: 10.46.0.10:7480
    t8_listen: 10.46.0.10:7481
    # @POD_IP@ is substituted by the sidecar.
    t8_notify_base: http://@POD_IP@:7481
    nef:
      api_root: http://nef.nextg-system.svc.cluster.local:7777
      scs_as_id: d445a-fl-af
      oauth2:
        nrf: http://nrf.nextg-system.svc.cluster.local:7777
        nf_instance_id: 6b1d7e3c-0000-4000-8000-00000000480a
        cca_key_file: /tmp/d445a/cca/af.key
        register: true
    seed: 480
    holds:
      - before_round: 4
        until: member-excluded
        timeout_s: 240
      - before_round: 7
        until: members-full
        timeout_s: 300
  sidecar.sh: |
    set -eu
    say() { echo "[d445a-sidecar] $*"; }
    : "${POD_IP:?}"
    D=/tmp/d445a
    mkdir -p "$D/cca"
    chmod 700 "$D" "$D/cca"
    # upfd's wrapper creates ogstun and the MASQUERADE; wait for both.
    i=0
    until ip link show ogstun >/dev/null 2>&1; do
      i=$((i+1)); [ "$i" -ge 180 ] && { say "FATAL: no ogstun after 180 s"; exit 1; }
      sleep 1
    done
    # Idempotent over a container restart: a fresh mount namespace has no
    # /run/netns/fl-dn, and the veth died with the old namespace.
    ip link del fl-up 2>/dev/null || true
    ip netns del fl-dn 2>/dev/null || true
    ip netns add fl-dn
    ip link add fl-up type veth peer name fl-af netns fl-dn
    ip addr add 10.46.0.1/24 dev fl-up
    ip link set fl-up up
    ip -n fl-dn addr add 10.46.0.10/24 dev fl-af
    ip -n fl-dn link set lo up
    ip -n fl-dn link set fl-af up
    ip -n fl-dn route add default via 10.46.0.1
    # nefd -> <pod IP>:7481 -> the AF's T8 listener, source kept.
    iptables -t nat -C PREROUTING -d "$POD_IP" -p tcp --dport 7481 -j DNAT --to-destination 10.46.0.10:7481 2>/dev/null \
      || iptables -t nat -A PREROUTING -d "$POD_IP" -p tcp --dport 7481 -j DNAT --to-destination 10.46.0.10:7481
    # No UE reaches the T8 listener.
    iptables -C FORWARD -s 10.45.0.0/16 -d 10.46.0.10 -p tcp --dport 7481 -j DROP 2>/dev/null \
      || iptables -I FORWARD 1 -s 10.45.0.0/16 -d 10.46.0.10 -p tcp --dport 7481 -j DROP
    # The AF's own calls (NRF, nefd, cluster DNS) leave as the pod.
    iptables -t nat -C POSTROUTING -s 10.46.0.0/24 -o eth0 -j MASQUERADE 2>/dev/null \
      || iptables -t nat -A POSTROUTING -s 10.46.0.0/24 -o eth0 -j MASQUERADE
    iptables -t nat -S POSTROUTING
    # The fl-dn pcap: every FL segment the DN sees (headers only).
    tcpdump -Z root -i fl-up -nn -U -s 128 -w "$D/fl-dn.pcap" 'tcp port 7480' >"$D/tcpdump.log" 2>&1 &
    say "fl-dn up: fl-up 10.46.0.1/24, AF at 10.46.0.10; pcap on fl-up; waiting for $D/start"
    printf '%s\n' "${D445A_AF_YAML}" | sed "s/@POD_IP@/${POD_IP}/g" >"$D/af.yaml"
    touch "$D/ready"
    until [ -s "$D/start" ]; do sleep 1; done
    read -r bin flags <"$D/start" || true
    case "$bin" in
      nr-fl-server|nr-fl-server-revert-hooks) ;;
      *) say "FATAL: start names $bin"; exit 1 ;;
    esac
    for f in ${flags:-}; do
      case "$f" in --no-t8|--freeze-global) ;; *) say "FATAL: flag $f"; exit 1 ;; esac
    done
    # The AF parses UE-supplied frames: it runs as nobody, with no capabilities,
    # no supplementary groups and no_new_privs. It reads its config and key only.
    chmod 0711 "$D"; chmod 0644 "$D/af.yaml"
    chown -R 65534:65534 "$D/cca"
    say "starting $bin ${flags:-} in fl-dn as uid 65534"
    # shellcheck disable=SC2086
    exec ip netns exec fl-dn setpriv --reuid=65534 --regid=65534 --clear-groups \
      --inh-caps=-all --bounding-set=-all --no-new-privs "$bin" -c "$D/af.yaml" ${flags:-}
