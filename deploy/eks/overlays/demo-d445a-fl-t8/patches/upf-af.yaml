# The AF and fl-dn in the upf pod (nextgsim#480; af.yaml says why). Appended
# (JSON patch `/-`) so the UPF stays containers[0], which deploy-eks.sh's
# data-plane swap and demo-check.sh's /metrics scrape address by index.
#
# The UPF itself gets two settings, both from #1455 and both off by default:
#   UPF_NAT_EXCLUDE=10.46.0.0/24   no source NAT toward fl-dn, so the AF sees
#                                  the UE's 10.45.0.0/16 address;
#   UPF_SESSION_METRICS=seid-ue-ip upf_session_{ul,dl}_bytes_total{seid,ue_ipv4}
#                                  on /metrics, for the per-session UL check.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: UPF_NAT_EXCLUDE
    value: 10.46.0.0/24
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: UPF_SESSION_METRICS
    value: seid-ue-ip
- op: add
  path: /spec/template/spec/containers/-
  value:
    name: fl-af
    # The demo UE image (build-images.sh): nr-fl-server, its revert-hooks
    # build, iproute2, iptables and tcpdump. deploy-eks.sh rewrites the name.
    image: nextgsim-ue:latest
    imagePullPolicy: IfNotPresent
    command:
      - sh
      - -c
      - printf '%s\n' "${D445A_SIDECAR_SH}" >/tmp/d445a-sidecar.sh && exec sh /tmp/d445a-sidecar.sh
    env:
      - name: D445A_SIDECAR_SH
        valueFrom:
          configMapKeyRef:
            name: d445a-af
            key: sidecar.sh
      - name: D445A_AF_YAML
        valueFrom:
          configMapKeyRef:
            name: d445a-af
            key: af.yaml
      - name: POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: RUST_LOG
        value: info
    # Not privileged. The sidecar's root shell gets only what it uses:
    #   NET_ADMIN  veth, addresses, routes, iptables in the pod's network namespace;
    #   SYS_ADMIN  `ip netns add` / `ip netns exec` (unshare, the bind mount);
    #   NET_RAW    tcpdump on fl-up;
    #   CHOWN, SETUID, SETGID  handing the key to nobody, and the drop to it
    #              (setpriv; tcpdump -Z).
    # Over the runtime's default set (deploy-eks.sh's validator refuses `drop:
    # [ALL]` beside `add`), so these last four are listed for the record.
    # nr-fl-server itself, the one listener UEs reach, runs as nobody with no
    # capabilities and no_new_privs (setpriv, sidecar.sh). Whether `ip netns add`
    # works unprivileged on devtest1's nodes is a live-run question: if it fails,
    # the fallback is privileged: true here, with the AF still dropped to nobody.
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      runAsUser: 0
      capabilities:
        add:
          - NET_ADMIN
          - SYS_ADMIN
          - NET_RAW
          - CHOWN
          - SETUID
          - SETGID
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 1000m
        memory: 256Mi
