# The demo's subscribers (nextgsim#480): imsi-99970000000000N for N = 1..5, each
# with the External Identifier ueNNN@fl.nextg (`extid`, read by dbi and emitted
# by udrd as the GPSI extid-ueNNN@fl.nextg, nextgcore#1490). The base init Job
# seeds ...001 only; this Job waits for it, gives it its External Identifier and
# copies it to ...002-005 (same keys, own MSISDN and External Identifier).
# scenario.sh waits for the Job before it starts UEs 2-5.
#
# The realm fl.nextg is this overlay's; the nextgsim tests use ue0NN@fl.nextg.
apiVersion: v1
kind: ConfigMap
metadata:
  name: d445a-subscribers
  labels:
    app.kubernetes.io/part-of: nextgcore
data:
  seed.js: |
    db = db.getSiblingDB('nextgcore');
    let base = null;
    for (let i = 0; i < 120 && !base; i++) {
      base = db.subscribers.findOne({ imsi: "999700000000001" }, { _id: 0 });
      if (!base) { print("waiting for the base subscriber"); sleep(2000); }
    }
    if (!base) { throw new Error("base subscriber imsi 999700000000001 never appeared"); }
    for (let n = 1; n <= 5; n++) {
      const s = Object.assign({}, base);
      s.imsi = "99970000000000" + n;
      s.msisdn = ["82100000000" + n];
      s.extid = "ue00" + n + "@fl.nextg";
      db.subscribers.updateOne({ imsi: s.imsi }, { $set: s }, { upsert: true });
      print("d445a seeded imsi-" + s.imsi + " extid " + s.extid);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: d445a-subscribers
  labels:
    app.kubernetes.io/part-of: nextgcore
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-mongodb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongodb.nextg-system.svc.cluster.local 27017; do echo waiting for mongodb; sleep 2; done']
      containers:
        - name: seed
          image: mongo:6.0
          command: ["mongosh", "mongodb://mongodb.nextg-system.svc.cluster.local:27017/nextgcore", "/scripts/seed.js"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: d445a-subscribers
