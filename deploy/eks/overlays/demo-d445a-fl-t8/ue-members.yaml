# UEs 2-5 of demo d445a-fl-t8 (nextgsim#480): imsi-99970000000000N, FL member N.
# The base `ue` Deployment is member 1. replicas 0: scenario.sh scales them up
# after the d445a-subscribers Job has seeded their subscribers (UEs 4 and 5 only
# in poisoned-ue). No Service: nothing connects to a UE. One UE per pod, so one
# FL client per nr-ue process.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ue-2
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: ue-2
    app.kubernetes.io/part-of: nextgsim
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ue-2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ue-2
        app.kubernetes.io/part-of: nextgsim
    spec:
      initContainers:
        - name: wait-gnb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              i=0
              until nslookup gnb.nextg-system.svc.cluster.local >/dev/null 2>&1; do
                i=$((i+1))
                [ "$i" -ge 60 ] && { echo "[wait-gnb] FATAL: gNB DNS never resolved"; exit 1; }
                sleep 2
              done
              sleep 3
        - name: d445a-fl-config
          image: busybox:1.36
          command: ["sh", "/d445a/fl-config.sh", "/tmp/config-template/ue.yaml"]
          env:
            - name: FL_MEMBER
              value: "2"
          volumeMounts:
            - name: config
              mountPath: /tmp/config-template/ue.yaml
              subPath: ue.yaml
              readOnly: true
            - name: config-resolved
              mountPath: /etc/nextgsim
            - name: d445a-ue-fl
              mountPath: /d445a
              readOnly: true
      containers:
        - name: ue
          image: nextgsim-ue:latest
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/nextgsim/ue.yaml", "-i", "999700000000002"]
          env:
            - name: RUST_LOG
              value: "info,nr_ue=warn,nextgsim_ue::rrc=warn"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config-resolved
              mountPath: /etc/nextgsim
            - name: dev-tun
              mountPath: /dev/net/tun
      volumes:
        - name: config
          configMap:
            name: nextgsim-configs
        - name: config-resolved
          emptyDir: {}
        - name: d445a-ue-fl
          configMap:
            name: d445a-ue-fl
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
