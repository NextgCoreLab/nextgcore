apiVersion: v1
kind: ConfigMap
metadata:
  name: nextg-demo-toggles
data:
  key: d440a-ai-paging
  # One block, one mode, in every target: each gNB runs the mode's predictor
  # and amfd forces paging.strategy recommended-first (any mode).
  targets: amf.yaml gnb.yaml gnb-2.yaml gnb-3.yaml gnb-4.yaml gnb-5.yaml gnb-6.yaml
