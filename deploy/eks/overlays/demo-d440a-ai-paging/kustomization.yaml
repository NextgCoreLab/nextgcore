# Demo d440a-ai-paging (nextgsim#462): each gNB predicts where its idle UE is
# heading and recommends the RAN nodes to page in the UE Context Release
# Complete (TS 38.413 §9.3.1.100); amfd pages those first (TS 23.502 §4.2.3.3).
# Over the demo-OFF base, ClusterIP only, no port published.
#
#   Deployment  NCI    gNB ID  TAC  sim_position
#   gnb         0x010  1       1    (0, 0)       sim-grid.yaml
#   gnb-2       0x020  2       1    (120, 0)     gnb-grid.yaml
#   gnb-3       0x030  3       1    (240, 0)
#   gnb-4       0x040  4       1    (0, 120)
#   gnb-5       0x050  5       1    (120, 120)
#   gnb-6       0x060  6       1    (240, 120)
#
# sim-grid.yaml and gnb-grid.yaml are GENERATED by gen.py from nextgsim's
# config/demo-ai-paging/ (the compose harness's six-gNB grid and live seed 1),
# with Service names for the compose addresses, no demo block (toggles.yaml adds
# it with the run's mode) and the UE's route parked. test-scenario.sh fails on
# any drift.
#
# ue-log-level.yaml  the UE at RUST_LOG=info, so kubelet does not rotate its log
#                    away while six gNBs broadcast to it.
#
# Images: build-images.sh (amfd with demo-d440a-ai-paging, the gNB with
# demo-d440a-ai-paging, nr-cli copied into the gNBs by scenario.sh).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextg-demo
resources:
  - ../demo
  - toggles.yaml
  - gnb-grid.yaml
patches:
  - path: sim-grid.yaml
  - path: ue-log-level.yaml
    target:
      kind: Deployment
      name: ue
