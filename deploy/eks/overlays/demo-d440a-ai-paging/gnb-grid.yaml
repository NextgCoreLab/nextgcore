---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnb-6
  labels:
    app.kubernetes.io/name: gnb-6
    app.kubernetes.io/part-of: nextgsim
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gnb-6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gnb-6
        app.kubernetes.io/part-of: nextgsim
    spec:
      initContainers:
        - name: wait-amf
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              i=0
              until nc -z -w 2 amf.nextg-system.svc.cluster.local 7777; do
                i=$((i+1))
                [ "$i" -ge 60 ] && { echo "[wait-amf] FATAL: AMF SBI never accepted"; exit 1; }
                echo "[wait-amf] waiting for AMF SBI... ($i/60)"
                sleep 2
              done
              echo "[wait-amf] AMF ready."
        - name: resolve-dns
          image: busybox:1.36
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command:
            - sh
            - -c
            - |
              set -eu
              case "$POD_IP" in
                *[0-9].[0-9]*) ;;
                *) echo "[resolve-dns] FATAL: POD_IP is not an IPv4 address: '$POD_IP'" >&2; exit 1 ;;
              esac
              cp /tmp/config-template/gnb-6.yaml /etc/nextgsim/gnb.yaml
              sed -i \
                -e "s|^\( *link_ip:\).*|\1 $POD_IP|" \
                -e "s|^\( *ngap_ip:\).*|\1 $POD_IP|" \
                -e "s|^\( *gtp_ip:\).*|\1 $POD_IP|" \
                /etc/nextgsim/gnb.yaml
              if grep -qE '0\.0\.0\.0' /etc/nextgsim/gnb.yaml; then
                echo "[resolve-dns] FATAL: a wildcard bind address survived" >&2
                exit 1
              fi
              cat /etc/nextgsim/gnb.yaml
          volumeMounts:
            - name: config-template
              mountPath: /tmp/config-template/gnb-6.yaml
              subPath: gnb-6.yaml
              readOnly: true
            - name: config-resolved
              mountPath: /etc/nextgsim
      containers:
        - name: gnb
          image: nextgsim-gnb:latest
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/nextgsim/gnb.yaml"]
          env:
            - name: RUST_LOG
              value: info
          ports:
            - containerPort: 4997
              name: rls
              protocol: UDP
            - containerPort: 2152
              name: gtpu
              protocol: UDP
          readinessProbe:
            exec:
              command: ["sh", "-c", "grep -qi ':1385' /proc/net/udp"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "grep -qi ':1385' /proc/net/udp"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config-resolved
              mountPath: /etc/nextgsim
              readOnly: true
      volumes:
        - name: config-template
          configMap:
            name: gnb-6-config
        - name: config-resolved
          emptyDir: {}
