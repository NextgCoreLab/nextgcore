# UE-B (nextgsim#465): the best-effort UE, imsi-999700000000002, the base UE's
# config with -i. The base `ue` Deployment is UE-V (imsi-...001, protected).
#
# replicas 0: scenario.sh seeds UE-B's subscriber in MongoDB (the base init Job
# seeds only ...001) and then scales this to 1, so UE-B registers once, after
# the seed. No Service: nothing connects to a UE.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ue-b
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: ue-b
    app.kubernetes.io/part-of: nextgsim
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ue-b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ue-b
        app.kubernetes.io/part-of: nextgsim
    spec:
      initContainers:
        - name: wait-gnb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              i=0
              until nslookup gnb.nextg-system.svc.cluster.local >/dev/null 2>&1; do
                i=$((i+1))
                [ "$i" -ge 60 ] && { echo "[wait-gnb] FATAL: gNB DNS never resolved"; exit 1; }
                sleep 2
              done
              sleep 3
      containers:
        - name: ue
          image: nextgsim-ue:latest
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/nextgsim/ue.yaml", "-i", "999700000000002"]
          env:
            - name: RUST_LOG
              # info, with the per-packet nr_ue and per-SIB nextgsim_ue::rrc at
              # warn (patches/ue-log-level.yaml): at debug kubelet rotated this
              # log during the load and lost `network set Session-AMBR`
              # (info!, nextgsim_ue::app::task), which scenario.sh asserts.
              value: "info,nr_ue=warn,nextgsim_ue::rrc=warn"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # UE-B generates the load: ping at ~800 pps per process, two at
              # the hold, plus nr-ue's own per-packet TUN/RLS path.
              cpu: 1000m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nextgsim/ue.yaml
              subPath: ue.yaml
              readOnly: true
            - name: dev-tun
              mountPath: /dev/net/tun
      volumes:
        - name: config
          configMap:
            name: nextgsim-configs
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
