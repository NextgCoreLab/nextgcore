# D441A core configs (nextgsim#465). A ConfigMap value is one string, so each
# file is replaced whole: keep the first part of each in step with
# k8s/manifests/configmap.yaml.
#
#   nrf.yaml  trusts the CCA public keys in /etc/nextgcore/cca-trusted, where
#             scenario.sh publishes the gNB exporter's own JWK (nrf-cca.yaml);
#             the NRF re-reads the directory on an unknown issuer (#187), so a
#             key published after the NRF started is found.
#   pcf.yaml  gains pcf.congestion_loop: the AoI (the gNB's cell, NCI 0x010),
#             UE-V (imsi-...001) protected, UE-B (imsi-...002) best effort,
#             throttle to 1000 kbps at congLevel >= 80, restore after 15
#             consecutive polls below 3 (nextgcore#1480). With C = 5 Mbps a
#             throttled UE-B (1 Mbps) can fill at most 20 % of the cell, and the
#             throttle itself lowers the served occupancy: congLevel went down
#             to 1 in statistics, and in prediction mode the fit extrapolated
#             the drop to 0, under 3 for up to 6 polls in a row. No
#             restore_below lies under that floor; the 15-poll count (over twice
#             the longest in-load dip) is what keeps the restore after the load.
#             restore_after_polls 3 restored UE-B mid-load. restore_below 3 only
#             keeps a quiet cell near idle. scenario.sh's
#             d441a_restore_hysteresis checks both against the gNB's C and
#             refuses the old values (10, 3).
#
# The demo: block is merged into pcf.yaml (and gnb.yaml, nwdaf.yaml) at render
# time by the demo post-render (toggles.yaml), with the run's mode.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextgcore-configs
  namespace: nextg-system
data:
  nrf.yaml: |
    logger:
      file:
        path: /var/log/nextgcore/nrf.log
      level: info
    global:
      max:
        ue: 1024
        peer: 64
    nrf:
      serving:
        - plmn_id:
            mcc: 999
            mnc: 70
      sbi:
        server:
          - address: 0.0.0.0
            advertise: nrf.nextg-system.svc.cluster.local
            port: 7777
        oauth2:
          cca_trusted_keys_dir: /etc/nextgcore/cca-trusted
  pcf.yaml: |
    db_uri: mongodb://mongodb.nextg-system.svc.cluster.local:27017/nextgcore
    logger:
      file:
        path: /var/log/nextgcore/pcf.log
      level: info
    global:
      max:
        ue: 1024
        peer: 64
    pcf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          nrf:
            - uri: http://nrf.nextg-system.svc.cluster.local:7777
      congestion_loop:
        cells:
          - {mcc: '999', mnc: '70', nr_cell_id: '000000010'}
        sst: 1
        dnn: internet
        protected_supis: [imsi-999700000000001]
        best_effort_supis: [imsi-999700000000002]
        throttle_kbps: 1000
        floor_kbps: 500
        throttle_at: 80
        restore_below: 3
        restore_after_polls: 15
        min_hold_secs: 10
        fail_open_secs: 30
        max_sessions: 1
        poll_ms: 1000
        prediction_horizon_secs: 5
