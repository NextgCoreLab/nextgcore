# Demo D441D (nextgsim#467): predictive N2 handover vs A3, seeded A/B. The demo
# base (deploy/eks/overlays/demo) plus a second gNB (gnb-east), the demo's gNB/UE
# configs with the route parked (configs-patch.yaml), and, for mode onnx, the
# d440b reference model and its init container. ClusterIP only.
#
# The gNB image must be built with
# `--features demo-d441d-predictive-ho,demo-d446a-agent-conflict` and ONNX
# Runtime, and post-#1752 core images: build-images.sh (one tag for both,
# demo-d441d-predictive-ho-<core8>-<sim8>; CORE_IMAGE_TAG=SIM_IMAGE_TAG=<tag>).
# The core NFs are stock (no D441D core change).
#
#   k8s/demo-check.sh d441d-predictive-ho a3|lsq|onnx
#   k8s/demo-check.sh d441d-predictive-ho off
#   DEMO_VARIANT=invalid|conflict k8s/demo-check.sh d441d-predictive-ho lsq
#   DEMO_VARIANT=runtime-switch k8s/demo-check.sh d441d-predictive-ho a3
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nextg-demo

resources:
  - ../demo
  - toggles.yaml
  - gnb-east.yaml

configMapGenerator:
  - name: d441d-model
    files:
      - model/nwdaf-trajectory-cv.onnx
      - model/nwdaf-trajectory-cv.manifest.json

generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: configs-patch.yaml
  - path: patches/gnb-d441d-ort.yaml
    target:
      kind: Deployment
      name: ^gnb(-east)?$
  - path: patches/gnb-d441d-onnx.yaml
    target:
      kind: Deployment
      name: ^gnb(-east)?$
