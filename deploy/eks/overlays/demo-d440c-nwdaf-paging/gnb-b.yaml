# gNB B of demo d440c-nwdaf-paging (nextgsim#464): nextgsim's
# config/demo-nwdaf-paging/gnb-b.yaml with Service names for the AMF
# and UPF and no demo block (toggles.yaml adds it with the run's mode). One TAC
# with the base gNB (gNB A), so the UE's registration area holds all three:
#
#   Deployment  NCI    gNB ID  TAC  sim_position
#   gnb         0x010  1       1    (0, 0)     gNB A, sim-lap.yaml
#   gnb-b       0x020  2       1    (100, 0)   gNB B, gnb-b.yaml
#   gnb-c       0x030  3       1    (50, 87)   gNB C, gnb-c.yaml
#
# A copy of the base gNB Deployment as the 5G profile renders it (wait-amf,
# resolve-dns, probes), reading its own ConfigMap. Headless ClusterIP Service,
# so the UE's gnb_search_list resolves it to the pod IP, like the base gNB.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gnb-b-config
  labels:
    app.kubernetes.io/part-of: nextgsim
data:
  gnb-b.yaml: |
    nci: 0x000000020
    gnb_id_length: 32
    plmn:
      mcc: 999
      mnc: 70
      long_mnc: false
    tac: 1
    nssai:
      - sst: 1
        sd: null
    amf_configs:
      - address: amf.nextg-system.svc.cluster.local
        port: 38412
    sctp_backend: userspace
    link_ip: 0.0.0.0
    ngap_ip: 0.0.0.0
    gtp_ip: 0.0.0.0
    ignore_stream_ids: false
    upf_addr: upf.nextg-system.svc.cluster.local
    upf_port: 2152
    si_broadcast_period_ms: 80
    reselection:
      broadcast: true
      q_hyst_db: 4
      t_reselection_s: 1
      cell_reselection_priority: 4
      s_intra_search_p: 31
      thresh_serving_low_p: 4
      intra_freq_neighbours: []
      inter_freq_carriers: []
    accept_raw_nas_on_dcch: false
    rlc_am_psis: []
    energy_saving_enabled: false
    she_enabled: false
    nwdaf_enabled: false
    nkef_enabled: false
    isac_enabled: false
    agent_enabled: false
    as_security_enabled: false
    sim_position: { x: 100, y: 0, z: 0 }
    handover_neighbours:
      - nci: 0x000000010
        tac: 1
      - nci: 0x000000030
        tac: 1
---
apiVersion: v1
kind: Service
metadata:
  name: gnb-b
  labels:
    app.kubernetes.io/name: gnb-b
    app.kubernetes.io/part-of: nextgsim
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: gnb-b
  ports:
    - name: rls
      port: 4997
      targetPort: 4997
      protocol: UDP
    - name: gtpu
      port: 2152
      targetPort: 2152
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnb-b
  labels:
    app.kubernetes.io/name: gnb-b
    app.kubernetes.io/part-of: nextgsim
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gnb-b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gnb-b
        app.kubernetes.io/part-of: nextgsim
    spec:
      initContainers:
        - name: wait-amf
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              i=0
              until nc -z amf.nextg-system.svc.cluster.local 7777; do
                i=$((i+1))
                [ "$i" -ge 60 ] && { echo "[wait-amf] FATAL: AMF SBI never accepted"; exit 1; }
                echo "[wait-amf] waiting for AMF SBI... ($i/60)"
                sleep 2
              done
              echo "[wait-amf] AMF ready."
        - name: resolve-dns
          image: busybox:1.36
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command:
            - sh
            - -c
            - |
              set -eu
              case "$POD_IP" in
                *[0-9].[0-9]*) ;;
                *) echo "[resolve-dns] FATAL: POD_IP is not an IPv4 address: '$POD_IP'" >&2; exit 1 ;;
              esac
              cp /tmp/config-template/gnb-b.yaml /etc/nextgsim/gnb.yaml
              sed -i \
                -e "s|^\( *link_ip:\).*|\1 $POD_IP|" \
                -e "s|^\( *ngap_ip:\).*|\1 $POD_IP|" \
                -e "s|^\( *gtp_ip:\).*|\1 $POD_IP|" \
                /etc/nextgsim/gnb.yaml
              if grep -qE '0\.0\.0\.0' /etc/nextgsim/gnb.yaml; then
                echo "[resolve-dns] FATAL: a wildcard bind address survived" >&2
                exit 1
              fi
              cat /etc/nextgsim/gnb.yaml
          volumeMounts:
            - name: config-template
              mountPath: /tmp/config-template/gnb-b.yaml
              subPath: gnb-b.yaml
              readOnly: true
            - name: config-resolved
              mountPath: /etc/nextgsim
      containers:
        - name: gnb
          image: nextgsim-gnb:latest
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/nextgsim/gnb.yaml"]
          env:
            - name: RUST_LOG
              value: info,nextgsim_gnb=debug,nextgsim_ngap=debug
          ports:
            - containerPort: 4997
              name: rls
              protocol: UDP
            - containerPort: 2152
              name: gtpu
              protocol: UDP
          readinessProbe:
            exec:
              command: ["sh", "-c", "grep -qi ':1385' /proc/net/udp"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "grep -qi ':1385' /proc/net/udp"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config-resolved
              mountPath: /etc/nextgsim
              readOnly: true
      volumes:
        - name: config-template
          configMap:
            name: gnb-b-config
        - name: config-resolved
          emptyDir: {}
