# nwdafd for demo d440c-nwdaf-paging (nextgsim#464). ClusterIP only.
#
# The image is nwdafd built with --features amf-mobility
# (deploy/eks/profiles/demo/profile.env adds it for this overlay). It serves
# UE_MOBILITY from amfd's LOCATION_REPORTs through its base knob
# nwdaf.amf_mobility.enabled, not through demo d441c-amf-mobility: nwdafd is not
# a toggles target, so it logs no DEMO MODE ACTIVE line in this run. The revert
# arm (scenario.sh, DEMO_VARIANT=revert) switches the knob off, so nwdafd keeps
# no history and answers UE_MOBILITY with 204.
#
# Host names say nextg-system; the 6G post-render rewrites them to this
# namespace, as for every other NF.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nwdaf-config
  labels:
    app.kubernetes.io/part-of: nextgcore
data:
  nwdaf.yaml: |
    logger:
      level: info
    nwdaf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
      amf_mobility:
        enabled: true
---
apiVersion: v1
kind: Service
metadata:
  name: nwdaf
  labels:
    app.kubernetes.io/name: nwdaf
    app.kubernetes.io/part-of: nextgcore
spec:
  selector:
    app.kubernetes.io/name: nwdaf
  ports:
    - name: sbi
      port: 7777
      targetPort: 7777
    # /metrics, cluster-internal: this Service is ClusterIP.
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nwdaf
  labels:
    app.kubernetes.io/name: nwdaf
    app.kubernetes.io/part-of: nextgcore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nwdaf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nwdaf
        app.kubernetes.io/part-of: nextgcore
    spec:
      initContainers:
        - name: wait-nrf
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z nrf.nextg-system.svc.cluster.local 7777; do echo waiting for nrf; sleep 2; done']
      containers:
        - name: nwdaf
          image: nextgcore-rust/nwdaf:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/nextgcore/nwdaf.yaml"
            - "--nrf-uri"
            - "http://nrf.nextg-system.svc.cluster.local:7777"
          ports:
            - containerPort: 7777
              name: sbi
            - containerPort: 9090
              name: metrics
          env:
            - name: NEXTGCORE_SBI_PROFILE
              value: "dev"
            - name: RUST_LOG
              value: info
            # /metrics on the pod IP for the in-pod scrape; reached through the
            # ClusterIP Service only.
            - name: NEXTGCORE_METRICS_BIND
              value: "0.0.0.0"
            # Registered with the NRF and used in the eventNotifyUri given to amfd.
            - name: NEXTGCORE_SBI_ADVERTISE
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RUST_BACKTRACE
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nextgcore/nwdaf.yaml
              subPath: nwdaf.yaml
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: nwdaf-config
