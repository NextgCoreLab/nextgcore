# The AnLF of demo d441e-model-retrain (nextgsim#468): discovers the MTLF at the
# NRF, subscribes for a model with a 0.70 accuracy threshold, verifies and loads
# it, registers it for monitoring and reports its accuracy. ClusterIP only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nwdaf-anlf-config
  labels:
    app.kubernetes.io/part-of: nextgcore
data:
  # A toggle target (toggles.yaml): the post-render merges the demo: block in.
  nwdaf-anlf.yaml: |
    logger:
      level: info
    nwdaf:
      role: anlf
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
      # No mtlf_uri: the AnLF discovers the MTLF at the NRF.
      anlf:
        accuracy_threshold: 70
      # The seeded series (model_refit.rs), the defaults written out:
      # every 600 s of unix time, calm for 120 s, then alternating.
      retrain_series:
        enabled: true
        seed: 468
        step_secs: 1
        cycle_steps: 600
        change_at_step: 120
---
apiVersion: v1
kind: Service
metadata:
  name: nwdaf-anlf
  labels:
    app.kubernetes.io/name: nwdaf-anlf
    app.kubernetes.io/part-of: nextgcore
spec:
  selector:
    app.kubernetes.io/name: nwdaf-anlf
  ports:
    - name: sbi
      port: 7777
      targetPort: 7777
    # /metrics, cluster-internal: this Service is ClusterIP.
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nwdaf-anlf
  labels:
    app.kubernetes.io/name: nwdaf-anlf
    app.kubernetes.io/part-of: nextgcore
spec:
  replicas: 1
  # Never two of one role at once: scenario.sh restarts both NWDAFs at a chosen
  # point of the series, and an old pod must be gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nwdaf-anlf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nwdaf-anlf
        app.kubernetes.io/part-of: nextgcore
    spec:
      # #1617: the nf-tls files are group fsGroup, mode 0440, and every container
      # of the pod runs with fsGroup as a supplementary group, so the NF reads
      # its key as the image's non-root user (any gid works; 999 is the image's).
      securityContext:
        fsGroup: 999
      initContainers:
        - name: wait-nrf
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w 2 nrf.nextg-system.svc.cluster.local 7777; do echo waiting for nrf; sleep 2; done']
      containers:
        - name: nwdaf
          image: nextgcore-rust/nwdaf:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/nextgcore/nwdaf.yaml"
            - "--nrf-uri"
            - "https://nrf.nextg-system.svc.cluster.local:7777"
            # Pinned, so a restarted pod re-registers under the same NRF
            # profile (the old pod's address is replaced, not left beside it).
            - "--nf-instance-id"
            - "d441e000-0468-4000-8000-00000000a001"
          ports:
            - containerPort: 7777
              name: sbi
            - containerPort: 9090
              name: metrics
          env:
            # #1617: NF -> NRF over TLS with this pod's own certificate (Secret
            # nf-tls-nwdaf-anlf, issued at deploy time by k8s/nf-tls-secrets.sh). The NRF URI
            # dials the cluster FQDN; nrf.crt names DNS:nrf, so that is the name checked.
            - name: NEXTGCORE_NRF_TLS_CA
              value: /etc/nextgcore/certs/ca.crt
            - name: NEXTGCORE_NRF_TLS_CLIENT_CERT
              value: /etc/nextgcore/certs/nwdaf-anlf.crt
            - name: NEXTGCORE_NRF_TLS_CLIENT_KEY
              value: /etc/nextgcore/certs/nwdaf-anlf.key
            - name: NEXTGCORE_NRF_TLS_SERVER_NAME
              value: nrf
            - name: NEXTGCORE_SBI_PROFILE
              value: "dev"
            - name: RUST_LOG
              value: info
            # /metrics on the pod IP for the in-pod scrape; reached through the
            # ClusterIP Service only.
            - name: NEXTGCORE_METRICS_BIND
              value: "0.0.0.0"
            # Registered with the NRF; used in the model URLs and callback URIs.
            - name: NEXTGCORE_SBI_ADVERTISE
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RUST_BACKTRACE
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            # Its own Secret only (#1617).
            - name: nf-tls
              mountPath: /etc/nextgcore/certs
              readOnly: true
            - name: config
              mountPath: /etc/nextgcore/nwdaf.yaml
              subPath: nwdaf-anlf.yaml
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        # #1617: this pod's certificate and key and the CA certificate, mode 0440
        # to the pod's fsGroup. Never the CA key: it does not leave the deploy host.
        - name: nf-tls
          secret:
            secretName: nf-tls-nwdaf-anlf
            defaultMode: 0440
        - name: config
          configMap:
            name: nwdaf-anlf-config
