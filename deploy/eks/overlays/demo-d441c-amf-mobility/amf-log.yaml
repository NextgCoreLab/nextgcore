# amfd's Namf_EventExposure delivery line ("Event notification delivered:
# sub=<id>") is DEBUG; the demo's ordered chain (nextgsim#466 acceptance item 1:
# subscribe, then the amfd notify, then the nwdafd ingest) needs it, so this
# overlay raises that one module. Everything else stays at info.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amf
  namespace: nextg-demo
spec:
  template:
    spec:
      containers:
        - name: amf
          env:
            - name: RUST_LOG
              value: info,nextgcore_amfd::namf_server=debug
