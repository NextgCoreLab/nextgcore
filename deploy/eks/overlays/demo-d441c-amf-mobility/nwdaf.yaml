# nwdafd for demo d441c-amf-mobility (nextgsim#466). ClusterIP only.
#
# The image is the overlay's nwdaf build with --features amf-mobility
# (deploy/eks/profiles/demo/profile.env adds it for this overlay). The demo
# block is merged into nwdaf.yaml at render time (toggles.yaml), so one overlay
# serves both modes.
#
# Host names say nextg-system; the 6G post-render rewrites them to this
# namespace, as for every other NF.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nwdaf-config
  labels:
    app.kubernetes.io/part-of: nextgcore
data:
  nwdaf.yaml: |
    logger:
      level: info
    nwdaf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
---
apiVersion: v1
kind: Service
metadata:
  name: nwdaf
  labels:
    app.kubernetes.io/name: nwdaf
    app.kubernetes.io/part-of: nextgcore
spec:
  selector:
    app.kubernetes.io/name: nwdaf
  ports:
    - name: sbi
      port: 7777
      targetPort: 7777
    # /metrics, cluster-internal: this Service is ClusterIP.
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nwdaf
  labels:
    app.kubernetes.io/name: nwdaf
    app.kubernetes.io/part-of: nextgcore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nwdaf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nwdaf
        app.kubernetes.io/part-of: nextgcore
    spec:
      # #1617: the nf-tls files are group fsGroup, mode 0440, and every container
      # of the pod runs with fsGroup as a supplementary group, so the NF reads
      # its key as the image's non-root user (any gid works; 999 is the image's).
      securityContext:
        fsGroup: 999
      initContainers:
        - name: wait-nrf
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w 2 nrf.nextg-system.svc.cluster.local 7777; do echo waiting for nrf; sleep 2; done']
      containers:
        - name: nwdaf
          image: nextgcore-rust/nwdaf:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/nextgcore/nwdaf.yaml"
            - "--nrf-uri"
            - "https://nrf.nextg-system.svc.cluster.local:7777"
          ports:
            - containerPort: 7777
              name: sbi
            - containerPort: 9090
              name: metrics
          env:
            # #1617: NF -> NRF over TLS with this pod's own certificate (Secret
            # nf-tls-nwdaf, issued at deploy time by k8s/nf-tls-secrets.sh). The NRF URI
            # dials the cluster FQDN; nrf.crt names DNS:nrf, so that is the name checked.
            - name: NEXTGCORE_NRF_TLS_CA
              value: /etc/nextgcore/certs/ca.crt
            - name: NEXTGCORE_NRF_TLS_CLIENT_CERT
              value: /etc/nextgcore/certs/nwdaf.crt
            - name: NEXTGCORE_NRF_TLS_CLIENT_KEY
              value: /etc/nextgcore/certs/nwdaf.key
            - name: NEXTGCORE_NRF_TLS_SERVER_NAME
              value: nrf
            # Pinned to the urn:uuid of nwdaf.crt (docker/rust/certs/nf-identities.txt).
            - name: NEXTGCORE_NWDAF_INSTANCE_ID
              value: "6b1d7e3c-0000-4000-8000-00000000fdaf"
            - name: NEXTGCORE_SBI_PROFILE
              value: "dev"
            - name: RUST_LOG
              value: info
            # /metrics on the pod IP for the in-pod scrape; reached through the
            # ClusterIP Service only.
            - name: NEXTGCORE_METRICS_BIND
              value: "0.0.0.0"
            # Registered with the NRF and used in the eventNotifyUri given to amfd.
            - name: NEXTGCORE_SBI_ADVERTISE
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RUST_BACKTRACE
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            # Its own Secret only (#1617).
            - name: nf-tls
              mountPath: /etc/nextgcore/certs
              readOnly: true
            - name: config
              mountPath: /etc/nextgcore/nwdaf.yaml
              subPath: nwdaf.yaml
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        # #1617: this pod's certificate and key and the CA certificate, mode 0440
        # to the pod's fsGroup. Never the CA key: it does not leave the deploy host.
        - name: nf-tls
          secret:
            secretName: nf-tls-nwdaf
            defaultMode: 0440
        - name: config
          configMap:
            name: nwdaf-config
