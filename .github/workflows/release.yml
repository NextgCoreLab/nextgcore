# Paired release for nextgcore (#423).
#
# nextgcore and nextgsim are ONE SYSTEM UNDER TEST: this repo's `docker-e2e`
# builds nextgsim's real gNB and UE and registers a live UE over N2. So the unit
# of release is a PAIR of commits that passed the E2E TOGETHER, and releasing is
# the PROMOTION of an already-validated pair -- never "tag main and hope".
#
# WHY ONE WORKFLOW PER REPO. The default GITHUB_TOKEN cannot write to a
# different repository, so a single workflow tagging both repos would need a PAT
# or GitHub App with push rights to both -- a long-lived credential, and PATs
# expire in a way that breaks releases silently months later. nextgsim carries a
# sibling of this file that tags itself. The pair is still enforced, because each
# workflow validates its input against #422's manifest and neither can tag a
# commit the E2E did not test.
#
# WHY DISPATCH ONLY. #422 produces a manifest from every green nightly, so this
# could cut releases by itself. It deliberately does not: that would tag
# unreviewed work most days and make the version meaningless. CONSTITUTION.md
# makes the human the final authority before anything reaches upstream.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release THIS repo as (e.g. 0.2.0). Independent of nextgsim's."
        required: true
        type: string
      validated_run_id:
        description: "CI run id whose validated-pair.json authorises this release (from a green nightly)."
        required: true
        type: string
      paired_version:
        description: "The nextgsim version released alongside this one, for the recorded mapping."
        required: true
        type: string
      dry_run:
        description: "Validate and print everything WITHOUT committing, tagging or publishing."
        required: true
        type: boolean
        default: true
  # #420: a pushed version tag publishes that tag's images to Docker Hub. The
  # tag `release` creates below is pushed with GITHUB_TOKEN, which starts no
  # workflow (a GitHub Actions rule), so a dispatched release publishes in its
  # own run instead (the publish-* jobs below); the two paths never both fire.
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    name: Release nextgcore
    # A tag push has no release to cut: the tag already exists.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      # Full history: the notes are generated from `git log <prev-tag>..<sha>`,
      # and the ancestry check needs the graph. A shallow clone has neither.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The manifest is the AUTHORISATION. Without it this workflow has no
      # evidence the commit it is about to tag was ever tested against a
      # nextgsim commit, which is the entire premise of a paired release.
      - name: Download the validated-pair manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-pair
          run-id: ${{ inputs.validated_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: manifest

      - name: Validate the manifest and resolve the pair
        id: pair
        run: |
          set -euo pipefail
          f=manifest/validated-pair.json
          if [ ! -s "$f" ]; then
            echo "::error::run ${{ inputs.validated_run_id }} carries no validated-pair.json."
            echo "That artifact is written only when docker-build, docker-e2e AND"
            echo "docker-e2e-epc all succeeded (#422), so its absence means this run"
            echo "did not validate a pair. Refusing to release."
            exit 1
          fi
          cat "$f"
          core=$(jq -re '.nextgcore_sha' "$f")
          sim=$(jq -re '.nextgsim_sha' "$f")
          run_url=$(jq -re '.run_url' "$f")
          # `jq -re` already fails on null/absent, but an EMPTY string would pass
          # it and produce a release pointing at nothing.
          for v in "$core" "$sim"; do
            if [ -z "$v" ]; then
              echo "::error::manifest carries an empty sha; refusing."
              exit 1
            fi
          done
          # The validated sha may have been reverted or force-pushed out since the
          # nightly ran. Tagging a commit no longer on the branch would publish a
          # release of code that is not in the history.
          if ! git merge-base --is-ancestor "$core" HEAD; then
            echo "::error::validated nextgcore sha ${core} is NOT an ancestor of ${{ github.ref_name }}."
            echo "It may have been reverted or force-pushed away. Refusing to release it."
            exit 1
          fi
          echo "nextgcore_sha=${core}" >> "$GITHUB_OUTPUT"
          echo "nextgsim_sha=${sim}" >> "$GITHUB_OUTPUT"
          echo "run_url=${run_url}" >> "$GITHUB_OUTPUT"
          echo "Validated pair: nextgcore ${core} / nextgsim ${sim}"

      # A second tag on one pair is not a release. Checked before anything is
      # written, so a re-dispatch of an already-released pair stops early rather
      # than failing halfway through with a tag created and no Release published.
      - name: Refuse to re-release an existing tag
        run: |
          set -euo pipefail
          tag='${{ inputs.version }}'
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} already exists. A release is not re-runnable;"
            echo "choose a new version or delete the tag deliberately."
            exit 1
          fi
          echo "tag ${tag} is free."

      - name: Determine the previous tag
        id: prev
        run: |
          set -euo pipefail
          # Most recent tag by creation date, which is what "since the last
          # release" means. `--sort=-creatordate` rather than version sort: a
          # version sort would pick 0.10.0 over 0.9.0 correctly but mis-order any
          # tag that is not strictly semver, and this repo's history has both.
          prev=$(git tag --list --sort=-creatordate | head -n 1 || true)
          if [ -z "$prev" ]; then
            echo "::error::no previous tag found; cannot scope release notes."
            exit 1
          fi
          echo "tag=${prev}" >> "$GITHUB_OUTPUT"
          echo "previous tag: ${prev}"

      # Grouped by conventional-commit prefix. 158 fix / 50 feat / 15 docs across
      # the 347 commits since 0.1.0, and 144 carry a (#NNN) PR number -- so the
      # grouping is worth doing rather than emitting one flat 347-line list.
      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          prev='${{ steps.prev.outputs.tag }}'
          core='${{ steps.pair.outputs.nextgcore_sha }}'
          range="${prev}..${core}"
          count=$(git rev-list --count "$range")
          # Counted WITHOUT merges, because that is what the grouped lists below
          # contain (`--no-merges`). Reporting the total would claim 347 commits
          # above a list of 260 and leave a reader hunting for 87 that were never
          # missing -- the buckets are verified to sum to exactly this number.
          listed=$(git log "$range" --format='%s' --no-merges | wc -l)
          merges=$(( count - listed ))
          if [ "$count" -eq 0 ]; then
            echo "::error::no commits in ${range}; an empty release is a mistake, not a release."
            exit 1
          fi
          {
            echo "## Provenance"
            echo
            echo "This release is the promotion of a commit pair that passed the cross-repo"
            echo "end-to-end test **together** (#422)."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| nextgcore validated commit | \`${core}\` |"
            echo "| nextgsim paired commit | \`${{ steps.pair.outputs.nextgsim_sha }}\` |"
            echo "| nextgsim version | \`${{ inputs.paired_version }}\` |"
            echo "| validated by | [CI run ${{ inputs.validated_run_id }}](${{ steps.pair.outputs.run_url }}) |"
            echo
            echo "**The tag is on the version-bump commit, which is one commit after the"
            echo "validated sha above.** That bump touches only \`[workspace.package] version\`"
            echo "in \`src/Cargo.toml\`; the validated code is \`${core}\`."
            echo
            echo "### What the validation covered"
            echo
            echo "* **5GC:** a real UE registration over N2 through nextgsim's gNB, plus a"
            echo "  Service Request CM-IDLE cycle with Namf event-delivery assertions."
            echo "* **EPC:** bring-up **only** — no attach, no GTP-U user-plane forwarding, no"
            echo "  S5/S8 transaction. See \`specs/epc-e2e-scope.md\`."
            echo "* **Not covered:** these jobs run nightly or on demand, **not per-PR**, so a"
            echo "  commit merged between nightlies has not been through them individually."
            echo
            echo "## Changes since ${prev}"
            echo
            echo "${listed} commits, grouped by type (plus ${merges} merge commits, not listed)."
            echo
            for kind in feat fix refactor test docs ci chore; do
              case "$kind" in
                feat) heading="Features";;
                fix) heading="Fixes";;
                refactor) heading="Refactoring";;
                test) heading="Tests";;
                docs) heading="Documentation";;
                ci) heading="CI";;
                chore) heading="Chores";;
              esac
              body=$(git log "$range" --format='%s' --no-merges \
                | grep -E "^${kind}(\([^)]*\))?:" || true)
              if [ -n "$body" ]; then
                echo "### ${heading}"
                echo
                echo "$body" | sed 's/^/* /'
                echo
              fi
            done
            # Anything whose subject does not start with a known prefix. Emitted
            # rather than dropped: a commit silently missing from the notes is how
            # a release under-reports what it contains.
            other=$(git log "$range" --format='%s' --no-merges \
              | grep -vE '^(feat|fix|refactor|test|docs|ci|chore)(\([^)]*\))?:' || true)
            if [ -n "$other" ]; then
              echo "### Other"
              echo
              echo "$other" | sed 's/^/* /'
              echo
            fi
          } > notes.md
          echo "generated $(wc -l < notes.md) lines of notes for ${count} commits"
          cat notes.md

      - name: Bump the workspace version
        id: bump
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          f=src/Cargo.toml
          # Anchored to the [workspace.package] section's `version` line. Both
          # repos declare it there and every member crate inherits with
          # `version.workspace = true`, so this single line releases the whole
          # workspace.
          awk -v v="$version" '
            /^\[workspace\.package\]/ { inpkg=1 }
            inpkg && /^version = / && !done { print "version = \"" v "\""; done=1; next }
            { print }
          ' "$f" > "$f.new"
          mv "$f.new" "$f"
          # ASSERT rather than trust the edit. A regex that silently matched
          # nothing would produce a tag whose declared version is the old one.
          got=$(awk '/^\[workspace\.package\]/{p=1} p && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' "$f")
          if [ "$got" != "$version" ]; then
            echo "::error::version bump did not take: Cargo.toml says '${got}', expected '${version}'"
            git diff -- "$f" || true
            exit 1
          fi
          echo "src/Cargo.toml now declares ${got}"
          git diff --stat -- "$f"

      - name: Dry run — stop before writing anything
        if: ${{ inputs.dry_run }}
        run: |
          echo "### DRY RUN — nothing was committed, tagged or published" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Would tag **${{ inputs.version }}** on a bump commit atop \`${{ steps.pair.outputs.nextgcore_sha }}\`," >> "$GITHUB_STEP_SUMMARY"
          echo "paired with nextgsim \`${{ inputs.paired_version }}\` (\`${{ steps.pair.outputs.nextgsim_sha }}\`)." >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          echo "Every validation above passed. Re-dispatch with dry_run=false to release."

      - name: Commit, tag and publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          core='${{ steps.pair.outputs.nextgcore_sha }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Cargo.toml
          git commit -m "chore(release): nextgcore ${version}" \
            -m "Promotes the commit pair validated by CI run ${{ inputs.validated_run_id }}:" \
            -m "nextgcore ${core}, nextgsim ${{ steps.pair.outputs.nextgsim_sha }} (nextgsim ${{ inputs.paired_version }})." \
            -m "Spec: specs/paired-release-from-a-validated-pair.md"
          git tag -a "$version" -m "nextgcore ${version} (paired with nextgsim ${{ inputs.paired_version }})"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "refs/tags/${version}"
          gh release create "$version" \
            --title "nextgcore ${version}" \
            --notes-file notes.md
          echo "released ${version}" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #420: publish the release's images to Docker Hub.
  #
  # WHAT. Every image in docker/release-images.json (ci.yml's release-images
  # job fails when a daemon, Dockerfile or deployed image is missing from it),
  # built from the VERSION TAG, pushed as <namespace>/<image>:<version>, and
  # :latest moved only after every versioned push succeeded.
  #
  # WHEN. Only for a version tag: a pushed x.y.z tag, or the tag a non-dry-run
  # dispatch of `release` above just created. Never from a PR, a branch or the
  # nightly, so `latest` always means "the last release".
  #
  # CREDENTIALS. The repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
  # (a Docker Hub access token with push scope, not a password). The optional
  # repository VARIABLE DOCKERHUB_NAMESPACE names the Docker Hub organisation;
  # without it the images go under the username. With either secret absent,
  # publish-gate prints a notice and every publish job is skipped: the release
  # itself still succeeds. See docs/ci-and-release.md, "Docker Hub images".
  # ==========================================================================
  publish-gate:
    name: Docker Hub publish gate
    needs: release
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && needs.release.result == 'success' && !inputs.dry_run)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      version: ${{ steps.gate.outputs.version }}
      latest: ${{ steps.gate.outputs.latest }}
      nextgsim_sha: ${{ steps.gate.outputs.nextgsim_sha }}
      revision: ${{ steps.gate.outputs.revision }}
      matrix: ${{ steps.gate.outputs.matrix }}
      images: ${{ steps.gate.outputs.images }}
    steps:
      - name: Checkout the version tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          # The ancestry check below needs main's history.
          fetch-depth: 0

      - name: Decide whether to publish, and what
        id: gate
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          # Whether the secrets are SET, never their values.
          HAS_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_USERNAME" != true ] || [ "$HAS_TOKEN" != true ]; then
            echo "::notice title=Docker Hub publish skipped::The DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are not both set, so no image was pushed for ${VERSION}. Add them (docs/ci-and-release.md, \"Docker Hub images\") and re-run this job to publish this tag."
            echo "### Docker Hub publish skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set; nothing was pushed." >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::${VERSION} is not a version tag (x.y.z or x.y.z-pre); refusing to publish."
            exit 1
          fi
          # Only reviewed code is published (#420 review): any writer can push a
          # tag, so the tagged commit must be reachable from main, which only
          # reviewed merges reach. A dispatched release's bump commit is on main.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::tag ${VERSION} ($(git rev-parse HEAD)) is not on main; refusing to publish an unreviewed commit."
            exit 1
          fi
          # A pre-release is published under its version only.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then latest=true; else latest=false; fi
          docker/check-release-images.sh
          # The nextgsim commit `release` paired this tag with, from its commit
          # message. Dockerfile.builder needs a nextgsim tree to run; no nextgsim
          # code goes into these images (nextgsim publishes its own).
          sim=$(git log -1 --format=%B HEAD | grep -oE 'nextgsim [0-9a-f]{40}' | head -n 1 | cut -d' ' -f2 || true)
          if [ -z "$sim" ]; then
            echo "::warning::the tagged commit names no nextgsim sha (not a release.yml bump commit); building with nextgsim main. The published images hold only nextgcore binaries."
            sim=main
          fi
          {
            echo "enabled=true"
            echo "version=${VERSION}"
            echo "latest=${latest}"
            echo "nextgsim_sha=${sim}"
            echo "revision=$(git rev-parse HEAD)"
            echo "matrix=$(jq -c '[.images[] | select(.base != true)]' docker/release-images.json)"
            echo "images=$(jq -r '[.images[].image] | join(" ")' docker/release-images.json)"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $(jq '.images | length' docker/release-images.json) images as ${VERSION} (latest: ${latest})."

  publish-binaries:
    name: Build the release binaries
    needs: publish-gate
    if: ${{ !cancelled() && needs.publish-gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout nextgcore at the version tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.publish-gate.outputs.version }}
          path: nextgcore

      - name: Checkout nextgsim (sibling tree Dockerfile.builder COPYs)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: NextgCoreLab/nextgsim
          ref: ${{ needs.publish-gate.outputs.nextgsim_sha }}
          path: nextgsim

      # The same build ci.yml's docker-build runs: Dockerfile.builder in a
      # Debian bookworm toolchain, matching the runtime base in Dockerfile.core.
      - name: Build the binaries
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker build -f Dockerfile.builder -t nextg-builder ../../../
          docker create --name builder nextg-builder /bin/true
          mkdir -p /tmp/out /tmp/release-binaries
          docker cp builder:/out/. /tmp/out/
          docker rm builder

      # Only the binaries an image COPYs, each asserted present: a binary
      # missing here would otherwise surface as one matrix leg's COPY failure.
      - name: Select and check the NF binaries
        run: |
          set -euo pipefail
          missing=""
          for nf in $(jq -r '.images[] | select(.nf_name) | .nf_name' nextgcore/docker/release-images.json); do
            if [ -x "/tmp/out/${nf}" ]; then
              cp "/tmp/out/${nf}" /tmp/release-binaries/
            else
              missing="${missing} ${nf}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Dockerfile.builder produced no binary for:${missing}"
            ls -la /tmp/out
            exit 1
          fi
          ls -la /tmp/release-binaries

      - name: Upload the NF binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-binaries
          path: /tmp/release-binaries/
          retention-days: 1
          if-no-files-found: error

  publish-core:
    name: Publish nextgcore-core
    needs: publish-gate
    if: ${{ !cancelled() && needs.publish-gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
      VERSION: ${{ needs.publish-gate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.publish-gate.outputs.version }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The base every NF image is built FROM, so it is pushed first.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/rust
          file: docker/rust/Dockerfile.core
          push: true
          tags: ${{ env.NAMESPACE }}/nextgcore-core:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ needs.publish-gate.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  publish-images:
    name: Publish ${{ matrix.image }}
    needs: [publish-gate, publish-binaries, publish-core]
    if: ${{ !cancelled() && needs.publish-gate.outputs.enabled == 'true' && needs.publish-binaries.result == 'success' && needs.publish-core.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Every leg runs: one failed image must not leave the others unpushed,
      # and publish-latest below waits for all of them.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.publish-gate.outputs.matrix) }}
    env:
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
      VERSION: ${{ needs.publish-gate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.publish-gate.outputs.version }}
      - name: Download the NF binaries
        if: ${{ matrix.nf_name }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-binaries
          path: docker/rust/binaries
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Ignored by images that declare neither ARG (the WebUI).
          build-args: |
            CORE_IMAGE=${{ env.NAMESPACE }}/nextgcore-core:${{ env.VERSION }}
            NF_NAME=${{ matrix.nf_name }}
          tags: ${{ env.NAMESPACE }}/${{ matrix.image }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ needs.publish-gate.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # `latest` moves only after EVERY versioned image pushed (publish-images
  # succeeds only when all of its legs did), and never for a pre-release.
  publish-latest:
    name: Move latest to this release
    needs: [publish-gate, publish-core, publish-images]
    if: ${{ !cancelled() && needs.publish-gate.outputs.latest == 'true' && needs.publish-core.result == 'success' && needs.publish-images.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
      VERSION: ${{ needs.publish-gate.outputs.version }}
      IMAGES: ${{ needs.publish-gate.outputs.images }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag every image latest
        run: |
          set -euo pipefail
          for image in $IMAGES; do
            docker buildx imagetools create \
              -t "${NAMESPACE}/${image}:latest" "${NAMESPACE}/${image}:${VERSION}"
          done
          {
            echo "### Published to Docker Hub as ${VERSION} and latest"
            for image in $IMAGES; do echo "* \`${image}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
