name: Deploy to GitHub Pages

on:
  # Deploy the docs site only when a release is published (versioned docs),
  # not on every docs push. workflow_dispatch allows a manual re-deploy.
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update API index
        run: bash docs/scripts/update-api-docs.sh

      # #2168: the book is built here from docs-book/ rather than committed, so
      # the published book cannot drift from its sources (it once did for 127
      # commits). mdBook is pinned: 0.5.4 reproduces the last committed build
      # byte for byte (#2167). `--locked` takes its dependency versions from the
      # crate's own lockfile, checked against crates.io's checksums.
      - name: Install mdBook 0.5.4
        run: cargo install mdbook --version 0.5.4 --locked

      - name: Build the book
        run: mdbook build docs-book

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
