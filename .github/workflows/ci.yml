name: CI

on:
  push:
    branches: [initial_commit, main]
  pull_request:
    branches: [initial_commit, main]
  # Heavy Docker image/E2E jobs recompile both workspaces in a container and
  # need a cross-repo checkout, so they stay off the per-PR path. They run
  # NIGHTLY (schedule, below) and on demand via the Actions tab "Run workflow".
  # The fast gate (check/test/clippy/fmt) runs on every push/PR to the branches
  # above.
  #
  # Nightly rather than dispatch-only because a cross-repo E2E that runs only
  # when someone remembers to press a button gates nothing while reading as
  # covered. See specs/cross-repo-e2e-gating.md (#349).
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: cargo check
        run: cd src && cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: cargo test
        # No retry, and nothing left for one to hide. There was one, for two named
        # races: process-global state and the free_port TOCTOU.
        #
        # #308 fixed the first (one ambient test lock per crate, covering readers
        # as well as writers) and measured what the retry had been hiding -- about
        # 1 whole-workspace run in 5, in three smfd tests, for months, because a
        # single retry passes ~96% of the time at that rate and the warning
        # annotation went unread. A retry that can hide a 20% flake is not a flake
        # mitigation, it is a detector for exactly the failures nobody
        # investigates.
        #
        # #313 CLOSED the second. `free_port` used to hand out a port and unbind it
        # before the caller bound it, with a per-BINARY issued-port set, so two
        # crates could be given the same port and one would fail to bind.
        # `test_support::bound_listener` now keeps the port bound and
        # `SbiServer::on_listener` serves that listener, so there is no window:
        # all 243 ephemeral-port server starts in this workspace now reserve.
        # `free_port` survives only for the 10 callers that want a port with
        # NOTHING listening on it (transport-error and degrade-open tests), where
        # being unbound is the point, plus one integration test that hands ports to
        # a child PROCESS and so cannot pass a socket at all.
        #
        # So a red here is a real failure. Read it, do not re-run it.
        run: cd src && cargo test --workspace

      - name: cargo test (non-default features)
        # Feature-gated paths are invisible to the default build, so a gated
        # module rots uncompiled -- the reason this project normally prefers a
        # runtime switch to a cargo feature. easdfd's `dns-udp` listener (#276)
        # has to be a feature (it binds a privileged port), so it gets an
        # explicit build+test here instead. Add a line per gated feature.
        run: cd src && cargo test -p nextgcore-easdfd --features dns-udp

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: cargo clippy
        # Pre-existing codebase has many style lints from Rust 1.95.
        # Gate on errors only; warnings shown but don't fail CI until the
        # tail is cleaned up incrementally. See Phase 8 follow-ups.
        run: cd src && cargo clippy --workspace

      - name: cargo clippy (non-default features)
        # Same reasoning as the test job's non-default step: a gated module is
        # invisible to a default-feature lint. One line per gated feature.
        run: cd src && cargo clippy -p nextgcore-easdfd --features dns-udp --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cd src && cargo fmt --all -- --check

  docker-build:
    name: Docker Build
    # Nightly OR on demand. A disjunction, not a replacement: the dispatch path
    # is unchanged. Both E2E jobs declare `needs: docker-build`, so gating this
    # one job gates all three. See specs/cross-repo-e2e-gating.md (#349).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout nextgcore
        uses: actions/checkout@v4
        with:
          path: nextgcore

      - name: Checkout nextgsim (sibling repo required by Dockerfile.builder)
        uses: actions/checkout@v4
        with:
          repository: NextgCoreLab/nextgsim
          # nextgsim renamed its default branch; `first_implementation` no longer
          # exists, so every cross-repo checkout failed with "git failed with exit
          # code 1". Tracking `main` rather than re-pinning: a pinned ref is what
          # rotted, and the E2E is only meaningful against current nextgsim.
          ref: main
          path: nextgsim

      - name: Build builder image
        run: |
          cd nextgcore/docker/rust
          # Build context = parent (./) so Dockerfile.builder can COPY both
          # nextgcore/src and nextgsim subtrees.
          docker build -f Dockerfile.builder -t nextg-builder ../../../

      - name: Extract binaries
        run: |
          cd nextgcore
          docker create --name builder nextg-builder /bin/true
          mkdir -p docker/rust/binaries
          docker cp builder:/out/. docker/rust/binaries/
          docker rm builder
          ls -la docker/rust/binaries/

      - name: Build core base image
        run: |
          cd nextgcore/docker/rust
          docker build -f Dockerfile.core -t nextgcore-core:latest .

      - name: Build 5GC NF images
        run: |
          cd nextgcore/docker/rust
          for nf in amfd ausfd bsfd dccfd eesd lmfd mbsmfd nrfd nsacfd nssfd nwdafd pcfd pind scpd seppd smfd udmd udrd upfd; do
            echo "Building 5GC nextgcore-${nf}..."
            docker build -f Dockerfile.nf \
              --build-arg CORE_IMAGE=nextgcore-core:latest \
              --build-arg NF_NAME=nextgcore-${nf} \
              -t nextgcore-rust/${nf%%d}:latest . || echo "WARN: ${nf} build failed"
          done

      - name: Build EPC NF images
        run: |
          cd nextgcore/docker/rust
          for nf in mmed sgwcd sgwud hssd pcrfd; do
            echo "Building EPC nextgcore-${nf}..."
            docker build -f Dockerfile.nf \
              --build-arg CORE_IMAGE=nextgcore-core:latest \
              --build-arg NF_NAME=nextgcore-${nf} \
              -t nextgcore-rust/${nf%%d}:latest . || echo "WARN: ${nf} build failed"
          done

      - name: Verify images
        run: |
          echo "Built images:"
          docker images | grep nextgcore | sort

  docker-e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout nextgcore
        uses: actions/checkout@v4
        with:
          path: nextgcore
      - name: Checkout nextgsim
        uses: actions/checkout@v4
        with:
          repository: NextgCoreLab/nextgsim
          # nextgsim renamed its default branch; `first_implementation` no longer
          # exists, so every cross-repo checkout failed with "git failed with exit
          # code 1". Tracking `main` rather than re-pinning: a pinned ref is what
          # rotted, and the E2E is only meaningful against current nextgsim.
          ref: main
          path: nextgsim

      - name: Build all images (repeat for job isolation)
        run: |
          cd nextgcore/docker/rust
          docker build -f Dockerfile.builder -t nextg-builder ../../../
          docker create --name builder nextg-builder /bin/true
          mkdir -p binaries
          docker cp builder:/out/. binaries/
          docker rm builder
          docker build -f Dockerfile.core -t nextgcore-core:latest .
          for nf in amfd ausfd bsfd nrfd nssfd pcfd smfd udmd udrd upfd; do
            docker build -f Dockerfile.nf \
              --build-arg CORE_IMAGE=nextgcore-core:latest \
              --build-arg NF_NAME=nextgcore-${nf} \
              -t nextgcore-rust/${nf%%d}:latest .
          done

      # Issue #397: the RAN. The builder image above already compiles nr-gnb and
      # nr-ue out of the sibling nextgsim checkout, but this job never turned them
      # into images, so no stage here had ever originated a registration -- the
      # baseline stage below is bring-up plus a /healthz probe.
      #
      # The gNB is why this PR deleted its in-process SCTP stand-in: the real one
      # lives in nextgsim and this repo must not grow a second.
      - name: "Build the nextgsim gNB + UE images (the REAL RAN, #397)"
        run: |
          cd nextgcore/docker/rust
          test -f binaries/nr-gnb && test -f binaries/nr-ue \
            || { echo "::error::binaries/nr-gnb or nr-ue missing -- Dockerfile.builder \
                 tolerates a nextgsim build failure with '|| true', so check the builder \
                 log for the nextgsim compile"; ls -la binaries/; exit 1; }
          mkdir -p ../../../nextgsim/binaries
          cp binaries/nr-gnb binaries/nr-ue ../../../nextgsim/binaries/
          docker build -f ../../../nextgsim/Dockerfile.gnb-local \
            -t nextgsim-gnb:latest ../../../nextgsim
          docker build -f ../../../nextgsim/Dockerfile.ue-local \
            -t nextgsim-ue:latest ../../../nextgsim

      - name: Start core network
        run: |
          cd nextgcore/docker/rust
          docker compose up -d mongodb nrf
          sleep 5
          docker compose up -d ausf udm udr pcf nssf bsf
          sleep 5
          docker compose up -d amf smf upf
          sleep 10

      - name: Health check
        run: |
          cd nextgcore/docker/rust
          echo "=== Container status ==="
          docker compose ps
          echo "=== NRF health ==="
          curl -sf http://172.23.0.10:7777/healthz || echo "NRF not responding"
          echo "=== AMF health ==="
          curl -sf http://172.23.0.5:7777/healthz || echo "AMF not responding"

      # ====================================================================
      # Issue #397: the Namf_EventExposure DELIVERY assertion.
      #
      # WHY THIS IS HERE AND NOT A UNIT TEST. The three registration-path
      # emitters fire from `send_registration_accept` AFTER
      # `send_to_association(..).await?` -- deliberately, because the event is
      # "the Accept has egressed", not "the Accept was built" (TS 24.501
      # §5.5.1.2.4: the UE enters 5GMM-REGISTERED on RECEIVING the Accept).
      # With no NG-RAN association that `?` returns early and the fire point is
      # never reached, so an in-process test with no transport asserts an
      # UNREACHABLE site and passes whether the wiring exists or not.
      #
      # PR #402's first revision solved that with a synthetic in-process SCTP
      # peer inside amfd's unit tests. The repository owner refused it, and the
      # facts back him: the real gNB lives in NextgCoreLab/nextgsim, which this
      # job already checks out and whose nr-gnb the builder image already
      # compiles. A second loopback gNB inside nextgcore would duplicate a peer
      # that exists properly next door. So the coverage lives HERE, against the
      # real thing, or nowhere.
      #
      # WHY IT IS POSITIVE. #187's history is the reason: its first CI assertion
      # grepped a log for `invalid_client` and passed because the log contained
      # ZERO token requests. A negative assertion is satisfied by every path
      # that never arrives. So `namf_event_probe` asserts the notification
      # BODIES -- the SUPI, `rmInfoList[0].rmState == REGISTERED`, the MCC/MNC/
      # TAC the gNB reported -- and carries its own negative control (a second
      # subscription for a SUPI that never registers, which must receive
      # nothing, so a pass cannot come from an AMF that broadcasts to everyone).
      #
      # ORDERING IS LOAD-BEARING. Nothing is delivered to a subscription that
      # does not exist yet, so the probe prints `SUBSCRIBED` and the gNB/UE are
      # started only after that line appears. Not a sleep: a sleep that is too
      # short makes this stage fail for a reason that is not the wiring.
      #
      # SCOPE. This stage asserts the REGISTRATION fire point
      # (REGISTRATION_STATE_REPORT, LOCATION_REPORT, ACCESS_TYPE_REPORT). The
      # SERVICE REQUEST fire point (REACHABILITY_REPORT + LOCATION_REPORT from
      # `handle_service_request_nas`) is asserted by the SECOND PHASE below,
      # added by #403 -- which found that the "no control surface" blocker #403
      # was filed with is FALSE: `ue-suspend` on nextgsim's own gNB CLI reaches
      # RRC_INACTIVE, so no nextgsim change was needed.
      #
      # TWO PROBE PROCESSES, not one subscribing to five types: LOCATION_REPORT
      # fires at BOTH sites (deliberately -- TS 29.518 §6.2's trigger is "when
      # AMF becomes aware of a location change", and it becomes aware at each),
      # so one probe could not attribute it. The service-request phase subscribes
      # only after this phase has passed.
      # ====================================================================
      - name: Start the namf-evts notification sink and SUBSCRIBE (before any UE)
        run: |
          cd nextgcore/docker/rust
          test -f binaries/namf_event_probe \
            || { echo "::error::binaries/namf_event_probe missing -- the builder did not \
                 produce it (see Dockerfile.builder)"; exit 1; }
          # Run the probe inside the SMF container: the AMF POSTs the notification to
          # the callback URI it was handed, so the sink needs an address on the
          # 172.23.0.0/24 core network. The SMF is already on it, and port 8397 does
          # not clash with its own SBI port (7777).
          docker cp binaries/namf_event_probe nextgcore-smf:/tmp/namf_event_probe
          docker compose exec -T --user root smf chmod 0755 /tmp/namf_event_probe
          # mcc/mnc/tac are the DEPLOYED values: nextgsim/config/gnb.yaml carries
          # `plmn: {mcc: 999, mnc: 70}` and `tac: 1`, matching configs/5gc/amf.yaml's
          # `tai`. The AMF encodes a TAC <= 0xFFFF as 4 hex digits (TS 29.571), so
          # tac 1 is "0001". A report assembled from a default `Tai5gs` would say
          # mcc 000 / mnc 000 / tac 0000 -- which is what makes the assertion
          # discriminating rather than merely satisfiable.
          #
          # The exit code is captured to /tmp/probe.rc because the process is
          # detached: a detached `exec` discards its status, and a step that cannot
          # read the probe's verdict would be exactly the green-proving-nothing
          # outcome this assertion exists to avoid.
          docker compose exec -T -d smf sh -c \
            '/tmp/namf_event_probe registration 172.23.0.5:7777 8397 172.23.0.4 \
               imsi-999700000000001 imsi-999709999999999 999 70 0001 240 \
               > /tmp/probe.log 2>&1; echo $? > /tmp/probe.rc'
          # Wait for the probe's own SUBSCRIBED line, NOT a sleep: the AMF matches a
          # notification against STORED subscriptions, so a registration that lands
          # before the subscription exists is delivered to nobody and this stage would
          # fail for a reason that is not the wiring.
          for _ in $(seq 1 60); do
            if docker compose exec -T smf sh -c 'cat /tmp/probe.log 2>/dev/null' \
                 | grep -qF SUBSCRIBED; then
              echo "subscriptions are in place:"
              docker compose exec -T smf sh -c 'cat /tmp/probe.log'
              exit 0
            fi
            sleep 1
          done
          echo "::error::the probe never reported SUBSCRIBED, so no registration can be \
                observed. Its log follows; a subscribe failure means the AMF's \
                namf-evts POST surface refused the request."
          docker compose exec -T smf sh -c 'cat /tmp/probe.log 2>/dev/null' || true
          exit 1

      - name: Register a REAL UE through nextgsim's gNB over N2
        run: |
          cd nextgcore/docker/rust
          docker compose up -d gnb ue
          # The gNB must associate and answer NG Setup before the UE's Registration
          # Request can cross N2 at all, so failing here is a RAN problem and is worth
          # distinguishing from a missing notification below.
          #
          # The two grep strings are the EXACT `info!` text nextgsim emits --
          # "Received NG Setup Response from AMF {}: name={}"
          # (nextgsim-gnb/src/ngap/task.rs) and "Received Registration Accept: UE is
          # now {}" (nextgsim-ue/src/nas/mm/orchestrator.rs). Both are `info!` and both
          # services run at RUST_LOG=info or finer, so neither is filtered out. A
          # PARAPHRASE here would make this step silently unfalsifiable, which is why
          # they were read out of nextgsim rather than guessed.
          #
          # `docker compose logs` is captured to a FILE and the file is grepped, never
          # `docker compose logs | grep -q`: under pipefail, grep -q exits on first
          # match, docker logs dies with SIGPIPE and the pipeline reports failure --
          # turning a real match into a false negative. e2e-test.sh records the same
          # rule at the top of the file.
          for _ in $(seq 1 60); do
            docker compose logs gnb > /tmp/gnb.log 2>&1 || true
            if grep -qF 'Received NG Setup Response' /tmp/gnb.log; then break; fi
            sleep 2
          done
          grep -F 'Received NG Setup Response' /tmp/gnb.log \
            || { echo "::error::nextgsim's gNB never completed NG Setup with the AMF, so \
                 no UE could register and the delivery assertion below cannot run"; \
                 tail -60 /tmp/gnb.log; docker compose logs --tail=60 amf; exit 1; }
          # A POSITIVE check that the UE really registered, so a later "nothing was
          # delivered" is attributable: either the registration did not happen (this
          # fails) or it happened and the notification did not (the probe fails).
          for _ in $(seq 1 60); do
            docker compose logs ue > /tmp/ue.log 2>&1 || true
            if grep -qF 'Received Registration Accept' /tmp/ue.log; then break; fi
            sleep 2
          done
          grep -F 'Received Registration Accept' /tmp/ue.log \
            || { echo "::error::the UE never received a Registration Accept"; \
                 tail -80 /tmp/ue.log; docker compose logs --tail=80 amf; exit 1; }

      - name: Assert the AMF DELIVERED the registration Namf event notifications
        run: |
          cd nextgcore/docker/rust
          # The probe's own budget is 240s; poll a little past it so a timeout is
          # reported by the probe (with its diagnostic naming the missing types)
          # rather than by this loop.
          for _ in $(seq 1 130); do
            if docker compose exec -T smf sh -c 'cat /tmp/probe.rc 2>/dev/null' \
                 | grep -qE '^[0-9]+'; then break; fi
            sleep 2
          done
          docker compose exec -T smf sh -c 'cat /tmp/probe.log' || true
          RC=$(docker compose exec -T smf sh -c 'cat /tmp/probe.rc 2>/dev/null' | tr -d '\r\n')
          if [ -z "$RC" ]; then
            echo "::error::the probe never exited, so its verdict is unknown. A step that \
                  cannot read the verdict proves nothing, so this fails."
            docker compose logs --tail=80 amf
            exit 1
          fi
          if [ "$RC" != "0" ]; then
            # Single-quoted: the diagnostic names Rust code, and a backtick inside a
            # double-quoted shell string is command substitution.
            echo '::error::the Namf_EventExposure delivery assertion FAILED. The probe'"'"'s \
                  own message above names which report or which value was wrong. If \
                  reports are missing entirely, the #397 emitters placed after \
                  send_to_association(..).await? in send_registration_accept are not \
                  firing.'
            echo "probe exit code: $RC"
            docker compose logs --tail=120 amf
            exit 1
          fi
          echo "the AMF delivered the registration-path Namf event notifications, \
                asserted on their bodies, against nextgsim's real gNB"

      # ====================================================================
      # Issue #403: the SERVICE REQUEST fire point.
      #
      # WHAT #403 GOT WRONG. The issue says there is "no control surface on nr-ue
      # to request an idle transition from outside the process", and proposes
      # adding one in nextgsim. It looked at the wrong node: nextgsim's gNB
      # already has a UDP CLI whose command set (GnbCliCommandType) includes
      # `ue-suspend`, which is exactly the right lever.
      #
      # STILL BLOCKED, and the three steps below stay `continue-on-error` BECAUSE
      # OF IT -- but the blocker has now MOVED TWICE, and the distinction matters
      # to anyone reading a red step here. THREE nextgsim defects, in series, each
      # one masking the next.
      #
      # BLOCKER 1 (discovery) -- FIXED. Run 35882746859 returned:
      #
      #   ERROR: No node found with name 'gnb'. Use --dump to list available nodes.
      #
      # because the gNB used its OWN CliServer, which never called
      # `register_nodes` and so wrote no /tmp/nextgsim.proc-table/ entry. Filed as
      # nextgsim #197 and FIXED by nextgsim PR #198, which deleted the duplicate
      # and converged the gNB onto nextgsim-common's registering CliServer.
      #
      # BLOCKER 2 (an empty CLI UE registry) -- FIXED. Run 35957375665 reached the
      # gNB and got `ues: []` from `handle_ue_list` for a UE that had already
      # logged an ACTIVE PDU session: `AppTask.ue_contexts` had no production
      # writer. Filed as nextgsim #199 and FIXED by nextgsim PR #200, which added
      # `AppMessage::UeContextUpdate`/`UeContextRemove` and sends them from the
      # NGAP task's own context lifecycle.
      #
      # BOTH fixes are REAL and are CONFIRMED HERE. Run 36045644289, against
      # nextgsim main @ 685e50b, got no discovery error and a POPULATED registry:
      #
      #   $ nr-cli gnb --exec 'ue-list'
      #   ues:
      #     - ue_id: 0
      #       ran_ngap_id: 1
      #       amf_ngap_id: 2
      #   UE[0] suspended to RRC_INACTIVE: I-RNTI=0x1, ... NCC=0   (gNB)
      #   Suspended to RRC_INACTIVE: I-RNTI=0x1, ... NCC=0         (UE)
      #   RRC connection released                                  (UE NAS -> CM-IDLE)
      #   Sending Service Request (Data), T3517 started            (UE)
      #
      # So `ue-suspend` now WORKS end to end, the UE really does reach CM-IDLE,
      # and the TUN write really does originate a Service Request. Links 1-8 of
      # the chain in specs/prove-service-request-namf-fire-point-e2e.md are now
      # VERIFIED LIVE rather than by inspection.
      #
      # BLOCKER 3, which is what stops us today: THE UE CANNOT RESUME. It never
      # sends an `RRCResumeRequest1`. `initiate_resume`
      # (nextgsim-ue/src/rrc/task.rs:3248) requires `self.as_security`, which is
      # written only via `handle_as_security_mode_command` -- and that is gated on
      # `as_security_enabled`, which BOTH shipped configs set to `false`
      # (nextgsim config/ue.yaml:286, config/gnb.yaml:199). So the UE takes the
      # `falling back to RRC_IDLE` arm on every resume. The gNB does NOT consult
      # that flag before suspending, so it commits to RRC_INACTIVE for a UE that
      # structurally cannot come back -- that asymmetry is the defect.
      #
      # The consequence is visible on the wire, and it is exactly the cause-#9
      # trap this step was designed to avoid:
      #
      #   Parsed Initial UE Message: ran_ue_ngap_id=2, nas_pdu_len=24, ...
      #   Unhandled NAS message type 0xf7 in Initial UE Message
      #
      # ran_ue_ngap_id went 1 -> 2, so that is a NEW RRC connection, not a resume;
      # and 0xf7 is not a 5GMM type at all but a CIPHERED byte -- the UE NAS-
      # protected the Service Request (correctly, TS 24.501 §4.4.2) and it rode an
      # InitialUEMessage, where the AMF has no context to unwrap it with. Filed as
      # nextgsim #201.
      #
      # These steps are therefore SHIPPED BUT NON-BLOCKING, deliberately rather
      # than deleted or left red: every link up to the resume is now verified LIVE
      # (the UE registered, got a PDU session, was suspended, went CM-IDLE, and
      # sent a real Service Request; the registration-phase assertion above
      # PASSED). When nextgsim #201 lands they start proving the fire point with
      # no further change here, and until then they must not report a nextgsim
      # defect as a nextgcore regression. The honest status of the SERVICE REQUEST
      # fire point remains UNPROVEN -- see
      # specs/prove-service-request-namf-fire-point-e2e.md, which states it.
      #
      # READING THIS JOB'S RESULT. `continue-on-error` means the JOB goes green
      # even when these steps exit 1 -- runs 35957375665 AND 36045644289 both
      # reported `success` with the drive step and the probe-verdict step having
      # genuinely FAILED, and `gh run view --job` shows a green tick beside every
      # step in both. A green tick on this job does NOT mean the fire point is
      # proven. Open the step logs and find the step's own PASS:/FAIL: line. That
      # is exactly why the tolerance must come off the moment nextgsim #201 lands.
      #
      # WHY `ue-suspend` AND NOT `ue-release`. This is the trap, and it is the
      # obvious first choice. `ue-release` makes the gNB send a
      # UEContextReleaseRequest, the AMF answers with a Release Command and BOTH
      # sides delete the NGAP UE context. The UE then returns in RRC_IDLE, so the
      # gNB sends an InitialUEMessage -- and nextgcore's
      # `handle_initial_ue_message` has exactly one arm for a Service Request
      # there: reject with cause #9, unconditionally, with no 5G-S-TMSI lookup.
      # `handle_service_request_nas` would never run.
      #
      # `ue-suspend` is RAN-LOCAL: the gNB sends an RRCRelease CARRYING a
      # suspendConfig (TS 38.331 §5.3.8.3) and deliberately does NOT tell the AMF,
      # so the NGAP context survives on both sides. The UE goes RRC_INACTIVE and
      # its NAS goes CM-IDLE. A TUN write then takes the MO-resume arm
      # (§5.3.13.2), the Service Request rides the RRCResumeComplete (§5.3.13.4),
      # and the gNB forwards it as an UplinkNASTransport -- which is the dispatch
      # path that reaches the fire point with `security_context_available &&
      # registered` still true.
      #
      # WHY THE ASSERTION IS NOT VACUOUS. REACHABILITY_REPORT is the
      # discriminating type: `fire_reachability_report` has exactly ONE caller in
      # the whole tree, inside `handle_service_request_nas`. The probe asserts its
      # VALUE (`reachability == REACHABLE`) and the SUPI, never the absence of an
      # error, and it keeps the negative control. The AMF can synthesise a
      # REACHABILITY_REPORT for a subscription carrying `immediateFlag`, which
      # would describe current state rather than prove the fire point ran -- the
      # probe never sets that flag, and immediate reports go in the 201 BODY
      # rather than to the callback the probe asserts on.
      # ====================================================================
      - name: "Subscribe the SERVICE REQUEST probe (phase 2, #403)"
        # Non-blocking until nextgsim #201 lands: `ue-suspend` now WORKS (#197/#198
        # fixed discovery, #199/#200 gave the CLI registry a production writer) and
        # the UE reaches CM-IDLE and sends a real Service Request -- but it cannot
        # RESUME, because `initiate_resume` needs an AS security context that
        # `as_security_enabled: false` never creates, so it falls back to RRC_IDLE
        # and the return leg is an InitialUEMessage. See the block comment above.
        continue-on-error: true
        run: |
          cd nextgcore/docker/rust
          # Port 8403 and not 8397: the registration probe's sink has exited, but
          # binding the same port in the same netns while it is in TIME_WAIT would
          # fail for a reason unrelated to the wiring.
          #
          # Started only AFTER the registration assertion passed, which is what makes
          # this phase attributable: the registration's own LOCATION_REPORT has already
          # been delivered, so every notification this probe receives was fired later.
          docker compose exec -T -d smf sh -c \
            '/tmp/namf_event_probe service-request 172.23.0.5:7777 8403 172.23.0.4 \
               imsi-999700000000001 imsi-999709999999999 999 70 0001 240 \
               > /tmp/probe2.log 2>&1; echo $? > /tmp/probe2.rc'
          for _ in $(seq 1 60); do
            if docker compose exec -T smf sh -c 'cat /tmp/probe2.log 2>/dev/null' \
                 | grep -qF SUBSCRIBED; then
              echo "service-request subscriptions are in place:"
              docker compose exec -T smf sh -c 'cat /tmp/probe2.log'
              exit 0
            fi
            sleep 1
          done
          echo "::error::the service-request probe never reported SUBSCRIBED, so no \
                Service Request can be observed."
          docker compose exec -T smf sh -c 'cat /tmp/probe2.log 2>/dev/null' || true
          exit 1

      - name: "Drive the REAL UE to CM-IDLE and back through a Service Request (#403)"
        # Non-blocking until nextgsim #201 lands: `ue-suspend` now WORKS (#197/#198
        # fixed discovery, #199/#200 gave the CLI registry a production writer) and
        # the UE reaches CM-IDLE and sends a real Service Request -- but it cannot
        # RESUME, because `initiate_resume` needs an AS security context that
        # `as_security_enabled: false` never creates, so it falls back to RRC_IDLE
        # and the return leg is an InitialUEMessage. See the block comment above.
        continue-on-error: true
        run: |
          cd nextgcore/docker/rust
          # The PDU session must exist first: the Service Request's Uplink data status
          # IE names the session with pending uplink data (TS 24.501 §5.6.1.2 /
          # §9.11.3.44), and the TUN device that carries the trigger IS the session's.
          # Exact `info!` text from nextgsim-ue/src/main.rs.
          for _ in $(seq 1 60); do
            docker compose logs ue > /tmp/ue.log 2>&1 || true
            if grep -qF 'is now ACTIVE' /tmp/ue.log; then break; fi
            sleep 2
          done
          grep -F 'is now ACTIVE' /tmp/ue.log \
            || { echo "::error::the UE never activated a PDU session, so it has no TUN \
                 device to originate uplink data on and cannot trigger a Service \
                 Request"; tail -60 /tmp/ue.log; exit 1; }

          # nr-cli must run INSIDE the gNB container: the CLI server binds 127.0.0.1
          # and is discovered through /tmp/nextgsim.proc-table/, so neither is
          # reachable from outside. Built by Dockerfile.builder; nextgsim's gNB image
          # ships only nr-gnb.
          test -f binaries/nr-cli \
            || { echo "::error::binaries/nr-cli missing -- Dockerfile.builder tolerates a \
                 nextgsim build failure with '|| true', so check the builder log"; \
                 ls -la binaries/; exit 1; }
          docker cp binaries/nr-cli nextgsim-gnb:/tmp/nr-cli
          docker compose exec -T --user root gnb chmod 0755 /tmp/nr-cli

          # The ue_id is READ from ue-list, never assumed to be 1: it is the gNB's
          # internal identifier, and hardcoding it would make this step fail for a
          # reason unrelated to the wiring if allocation ever changed.
          docker compose exec -T gnb /tmp/nr-cli gnb --exec 'ue-list' > /tmp/uelist.txt 2>&1 \
            || { echo "::error::nr-cli could not reach the gNB's CLI server"; \
                 cat /tmp/uelist.txt; exit 1; }
          cat /tmp/uelist.txt
          UE_ID=$(grep -oE 'ue_id: [0-9]+' /tmp/uelist.txt | head -1 | grep -oE '[0-9]+')
          if [ -z "$UE_ID" ]; then
            # This is NO LONGER the expected failure: run 36045644289 got a
            # POPULATED registry here (`ue_id: 0 / ran_ngap_id: 1 / amf_ngap_id: 2`)
            # once nextgsim #199/#200 gave `AppTask.ue_contexts` a production writer.
            # So an empty answer now means a REGRESSION of that writer, not the
            # known gap -- #200 sends `AppMessage::UeContextUpdate` from the NGAP
            # task's `create_ue_context` and every site that adopts the AMF UE NGAP
            # ID, and `UeContextRemove` from `delete_ue_context`.
            echo "::error::the gNB answered ue-list with no UE contexts, so there is \
                  nothing to suspend. nr-cli DID reach the gNB (nextgsim #197/#198 \
                  fixed discovery) and #199/#200 gave this registry a production \
                  writer, which run 36045644289 confirmed populated -- so this is a \
                  REGRESSION of that writer, not the known resume gap (nextgsim \
                  #201). The registration assertion above passed and the UE reached \
                  an ACTIVE PDU session, so a RAN context demonstrably exists."
            cat /tmp/uelist.txt; exit 1
          fi
          echo "suspending gNB UE context ${UE_ID} to RRC_INACTIVE"

          # RRC_INACTIVE, NOT a plain release: see the block comment above. This is
          # RAN-local, so the AMF keeps the NGAP context and the return leg is an
          # UplinkNASTransport rather than an InitialUEMessage.
          docker compose exec -T gnb /tmp/nr-cli gnb --exec "ue-suspend ${UE_ID}" \
            > /tmp/suspend.txt 2>&1 || true
          cat /tmp/suspend.txt

          # Both ends must AGREE the suspension happened, and the gNB-side check also
          # rules out the fallback: `initiate_rrc_suspend` returns None when there is no
          # AS security context, and the RRC task then RELEASES instead
          # ("UE[..] could not be suspended; releasing instead") -- which would leave
          # the UE in RRC_IDLE and silently put us on the cause-#9 path. Asserted
          # absent rather than assumed.
          #
          # Exact `info!` text: "UE[{ue_id}] suspended to RRC_INACTIVE: I-RNTI=..."
          # (nextgsim-gnb/src/rrc/connection.rs) and "Suspended to RRC_INACTIVE:
          # I-RNTI=..." (nextgsim-ue/src/rrc/task.rs). The case differs because they
          # are two statements in two crates; both matched with grep -F.
          for _ in $(seq 1 30); do
            docker compose logs gnb > /tmp/gnb.log 2>&1 || true
            if grep -qF 'suspended to RRC_INACTIVE: I-RNTI=' /tmp/gnb.log; then break; fi
            sleep 2
          done
          if grep -qF 'could not be suspended; releasing instead' /tmp/gnb.log; then
            echo "::error::the gNB could not suspend the UE and RELEASED it instead, so \
                  the UE is in RRC_IDLE. Its return leg would be an InitialUEMessage, \
                  which handle_initial_ue_message rejects with cause #9 -- the fire \
                  point would never run. This means the AS security context was missing \
                  (no Initial Context Setup)."
            tail -80 /tmp/gnb.log; exit 1
          fi
          grep -F 'suspended to RRC_INACTIVE: I-RNTI=' /tmp/gnb.log \
            || { echo "::error::the gNB never reported suspending the UE to RRC_INACTIVE"; \
                 tail -80 /tmp/gnb.log; exit 1; }
          for _ in $(seq 1 30); do
            docker compose logs ue > /tmp/ue.log 2>&1 || true
            if grep -qF 'Suspended to RRC_INACTIVE: I-RNTI=' /tmp/ue.log; then break; fi
            sleep 2
          done
          grep -F 'Suspended to RRC_INACTIVE: I-RNTI=' /tmp/ue.log \
            || { echo "::error::the UE never entered RRC_INACTIVE, so its NAS did not go \
                 CM-IDLE and a later TUN write would not originate a Service Request"; \
                 tail -80 /tmp/ue.log; exit 1; }
          # CM-IDLE is the state the fire point's precondition is about (TS 24.501
          # §5.6.1): `start_service_request` only runs when the UE is registered AND
          # idle. Exact `info!` from nextgsim-ue/src/main.rs's RrcConnectionRelease arm.
          grep -F 'RRC connection released' /tmp/ue.log \
            || { echo "::error::the UE's NAS was never told the RRC connection was gone, \
                 so it is still CM-CONNECTED and will not start a Service Request"; \
                 tail -80 /tmp/ue.log; exit 1; }
          echo "the UE is CM-IDLE (RRC_INACTIVE); originating uplink data on its TUN"

          # THE TRIGGER. A TUN write while registered and idle is what makes nr-ue
          # originate a real SERVICE REQUEST (TS 24.501 §5.6.1.2); the PSI travels with
          # it to become the Uplink data status bit.
          #
          # 10.45.0.1 is the UPF gateway, and this is the EXACT invocation
          # docker/rust/e2e-test.sh already uses for the data-plane check -- deliberately
          # without `-I`. The TUN is created with a /24 netmask around the UE's assigned
          # address (nextgsim-ue/src/main.rs), and the pool is 10.45.0.0/24, so
          # 10.45.0.1 is ON-LINK and the kernel routes the packet out of the tunnel
          # without an explicit interface. Naming an interface that turned out to be
          # numbered differently would make the ping fail WITHOUT ever writing to the
          # TUN, leaving the trigger silently un-fired -- the vacuous outcome to avoid.
          #
          # `|| true` because the first packets are EXPECTED to be lost: the tunnel is
          # being re-established by the very procedure they trigger. The assertion is on
          # the NAS exchange below, never on ICMP -- a ping that succeeded would prove
          # the data plane, not the fire point.
          docker compose exec -T ue ping -c 5 -W 5 10.45.0.1 || true

          # POSITIVE, and attributable: the UE must have SENT a Service Request and the
          # network must have ACCEPTED it. A Service REJECT (the cause-#9 arm) would
          # leave "Service Accept received" absent, which distinguishes "the UE came
          # back wrong" from "the emitters are not wired" -- the probe below would then
          # be the thing that failed, and this named assertion is what stops that being
          # ambiguous. Exact `info!` from nextgsim-ue/src/nas/mm/orchestrator.rs.
          for _ in $(seq 1 45); do
            docker compose logs ue > /tmp/ue.log 2>&1 || true
            if grep -qF 'Service Accept received' /tmp/ue.log; then break; fi
            sleep 2
          done
          grep -F 'Sending Service Request (' /tmp/ue.log \
            || { echo "::error::the UE never sent a Service Request after the uplink \
                 data. It reached CM-IDLE, so either the TUN write did not raise \
                 UplinkData or the UE did not consider itself registered."; \
                 tail -100 /tmp/ue.log; exit 1; }
          # THIS IS THE CURRENT FAILURE POINT (run 36045644289), and the cause is
          # nextgsim #201: the UE reaches CM-IDLE and sends a real Service Request,
          # but it never sends an RRCResumeRequest1, because `initiate_resume` needs
          # an `as_security` context that `as_security_enabled: false` never creates.
          # It falls back to RRC_IDLE, so the return leg is an InitialUEMessage with
          # a FRESH ran_ue_ngap_id carrying a NAS-ciphered Service Request the AMF
          # cannot unwrap ("Unhandled NAS message type 0xf7"). The two greps below
          # are what distinguish that from a nextgcore regression, so both are kept.
          if ! grep -qF 'Service Accept received' /tmp/ue.log; then
            echo "::error::the UE sent a Service Request but never got a Service \
                  Accept. Expected while nextgsim #201 is open: the UE could not RESUME, \
                  so it returned on an InitialUEMessage instead of an \
                  UplinkNASTransport and the fire point does not run on that path."
            # PRINT the discriminating lines rather than telling a human to find them:
            # the UE log is dominated by per-SIB DEBUG output, so the one `warn!` that
            # names the cause is invisible in a plain `tail`. `warn!` survives
            # RUST_LOG=info, so absence here is meaningful, not a log-level artefact.
            echo "--- the resume attempt (nextgsim #201 signature) ---"
            grep -E 'Cannot resume|falling back to RRC_IDLE|Sending RRCResumeRequest1' \
              /tmp/ue.log || echo "(none: the UE neither resumed nor reported why -- \
                that is NOT the #201 signature, so investigate as a new failure)"
            echo "--- how the request reached the AMF ---"
            docker compose logs amf > /tmp/amf.log 2>&1 || true
            # An InitialUEMessage here is #201. An UplinkNASTransport that still produced
            # no Accept would be a NEXTGCORE defect, and this is the line that tells
            # them apart -- so it is printed rather than left to inference.
            grep -E 'Initial UE Message|Unhandled NAS message type|Service Reject|rejecting \(#9\)' \
              /tmp/amf.log | tail -20 || true
            tail -40 /tmp/ue.log
            exit 1
          fi
          # The AMF's own view of the same moment: this is the line immediately before
          # the emitters in `handle_service_request_nas`, so it separates "the Accept
          # egressed but nothing fired" from "the Accept never egressed".
          docker compose logs amf > /tmp/amf.log 2>&1 || true
          grep -F 'Service Accept sent to UE' /tmp/amf.log \
            || { echo "::error::the AMF never logged sending a Service Accept, so \
                 handle_service_request_nas did not reach the emitters"; \
                 tail -100 /tmp/amf.log; exit 1; }
          echo "the UE went CM-IDLE and came back through a real Service Request"

      - name: "Assert the AMF DELIVERED the SERVICE REQUEST Namf notifications (#403)"
        # Non-blocking until nextgsim #201 lands: `ue-suspend` now WORKS (#197/#198
        # fixed discovery, #199/#200 gave the CLI registry a production writer) and
        # the UE reaches CM-IDLE and sends a real Service Request -- but it cannot
        # RESUME, because `initiate_resume` needs an AS security context that
        # `as_security_enabled: false` never creates, so it falls back to RRC_IDLE
        # and the return leg is an InitialUEMessage. See the block comment above.
        continue-on-error: true
        run: |
          cd nextgcore/docker/rust
          for _ in $(seq 1 130); do
            if docker compose exec -T smf sh -c 'cat /tmp/probe2.rc 2>/dev/null' \
                 | grep -qE '^[0-9]+'; then break; fi
            sleep 2
          done
          docker compose exec -T smf sh -c 'cat /tmp/probe2.log' || true
          RC=$(docker compose exec -T smf sh -c 'cat /tmp/probe2.rc 2>/dev/null' | tr -d '\r\n')
          if [ -z "$RC" ]; then
            echo "::error::the service-request probe never exited, so its verdict is \
                  unknown. A step that cannot read the verdict proves nothing."
            docker compose logs --tail=80 amf
            exit 1
          fi
          if [ "$RC" != "0" ]; then
            echo '::error::the SERVICE REQUEST Namf_EventExposure delivery assertion \
                  FAILED. The probe'"'"'s own message above names which report or which \
                  value was wrong. The step before this one already proved the UE went \
                  CM-IDLE and came back with an ACCEPTED Service Request, so if reports \
                  are missing entirely the emitters placed after \
                  send_to_association(..).await? in handle_service_request_nas are not \
                  firing.'
            echo "probe exit code: $RC"
            docker compose logs --tail=120 amf
            exit 1
          fi
          echo "the AMF delivered REACHABILITY_REPORT (REACHABLE) and LOCATION_REPORT \
                from handle_service_request_nas, asserted on their bodies, against \
                nextgsim's real gNB and UE"

      - name: Collect logs on failure
        if: failure()
        run: |
          cd nextgcore/docker/rust
          docker compose logs --tail=50

      - name: Teardown
        if: always()
        run: |
          cd nextgcore/docker/rust
          docker compose down -v

      # Issue #187: the OAuth2 overlay is the project's only end-to-end
      # demonstration of SBI OAuth2, and it used to run with token-endpoint
      # client authentication DISABLED, because nothing could pin an
      # nfInstanceId and so no CCA trust store could be provisioned. Both are
      # fixed; this stage is what keeps them fixed.
      #
      # SCHEDULED half of the two-gate split in specs/cross-repo-e2e-gating.md.
      # The per-PR half is the in-process nrfd test
      # `a_cca_signed_by_a_directory_published_key_is_accepted_and_an_unpublished_one_is_not`,
      # which asserts the same positive AND negative outcomes against the real
      # token handler. Neither substitutes for the other: the unit test cannot
      # prove two containers complete the exchange over the wire, and this stage
      # cannot run on a PR.
      #
      # SCOPE CEILING, stated rather than implied: this reuses the 10 NF images
      # the build step above produces, so it exercises nrf/udr/udm/ausf/pcf/
      # nssf/bsf/amf/smf/upf. The overlay also configures dccf, lmf, mbsmf,
      # nsacf and nwdaf, and those five are NOT covered here because no image for
      # them is built in this job. Extending the build list would roughly double
      # an already ~20-minute stage; the five are Rel-17 NFs off the
      # registration + PDU-session path this stage asserts.
      - name: Start the OAuth2 overlay (authenticated token endpoint)
        run: |
          cd nextgcore/docker/rust
          C="-f docker-compose.yml -f docker-compose.oauth2.yml"
          docker compose $C up -d mongodb nrf
          sleep 5
          docker compose $C up -d ausf udm udr pcf nssf bsf
          sleep 5
          docker compose $C up -d amf smf upf
          sleep 15

      - name: Assert client authentication is REQUIRED, not opted out
        run: |
          cd nextgcore/docker/rust
          C="-f docker-compose.yml -f docker-compose.oauth2.yml"
          LOG=$(docker compose $C logs nrf)
          echo "$LOG" | grep -F 'token-endpoint client authentication required' \
            || { echo "::error::the NRF did not log client authentication as REQUIRED"; \
                 echo "$LOG" | tail -60; exit 1; }
          # The escape hatch this issue removed must not be back by any route
          # (the config key, or NRF_SBI_OAUTH2_ALLOW_UNAUTHENTICATED).
          if echo "$LOG" | grep -F 'client authentication is DISABLED'; then
            echo "::error::the NRF opted OUT of client authentication -- #187 regressed"
            exit 1
          fi

      - name: Assert consumers published CCA keys and no private key leaked
        run: |
          cd nextgcore/docker/rust
          C="-f docker-compose.yml -f docker-compose.oauth2.yml"
          PUBLISHED=$(docker compose $C exec -T nrf \
            sh -c 'ls /etc/nextgcore/cca-public/*.jwk 2>/dev/null | wc -l' | tr -d '\r')
          echo "published CCA public JWKs: $PUBLISHED"
          if [ "${PUBLISHED:-0}" -lt 2 ]; then
            echo "::error::expected several published CCA public keys, found ${PUBLISHED:-0}"
            docker compose $C logs nrf | tail -40
            exit 1
          fi
          # Criterion 4: only PUBLIC material in the shared directory.
          if docker compose $C exec -T nrf sh -c 'ls /etc/nextgcore/cca-public/' \
               | grep -q '\.key$'; then
            echo "::error::a private key is in the PUBLIC JWK directory"
            exit 1
          fi

      # POSITIVE assertion, and it has to be positive. The first version of this
      # step grepped the logs for `invalid_client` and passed when it found none —
      # which a dispatched run proved VACUOUS: the log contained zero token
      # requests, because a bring-up-only run gives the NFs no reason to need a
      # token. A negative assertion is satisfied by every path that never arrives.
      #
      # So drive the live token endpoint over the wire with a CCA signed by a key
      # the NRF actually holds (from the shared trust-store directory), and require
      # a real token back. The probe ALSO presents a CCA signed by an untrusted key
      # and requires `invalid_client`, so a pass cannot come from an NRF that
      # authenticates nobody — the posture #187 removed.
      #
      # Run inside the AMF container: it is the only place that can reach both the
      # private key (on the `cca_keys` volume, deliberately not shared with the
      # host) and the NRF on the core network.
      - name: Assert the authenticated token exchange succeeded (positive + negative)
        run: |
          cd nextgcore/docker/rust
          C="-f docker-compose.yml -f docker-compose.oauth2.yml"
          docker compose $C ps
          # The probe is extracted from the builder image into binaries/ alongside
          # the NF binaries (see Dockerfile.builder).
          test -f binaries/cca_token_probe \
            || { echo "::error::binaries/cca_token_probe missing -- the builder did not produce it"; exit 1; }
          docker cp binaries/cca_token_probe nextgcore-amf:/tmp/cca_token_probe
          docker compose $C exec -T --user root amf chmod 0755 /tmp/cca_token_probe
          # Issue #393: capture the output so the mechanism line can be asserted
          # POSITIVELY below. `tee` keeps it in the log for a human too, and the
          # pipefail guard means the probe's own exit code still gates the step.
          set -o pipefail
          docker compose $C exec -T amf /tmp/cca_token_probe \
            http://172.23.0.10:7777 \
            /var/lib/nextgcore/cca/amf-cca.key \
            6b1d7e3c-0000-4000-8000-000000000af0 \
            AMF UDM nudm-sdm | tee /tmp/probe-amf.log
          # Issue #393: assert WHICH binding mechanism this stage exercised, as a
          # POSITIVE grep for a line the probe always prints. This is deliberately
          # not a claim that x5c works — it is a claim about what was covered, so
          # that if someone later wires cca_trust_anchors into the overlay and the
          # NFs silently keep using the trust store, this step FAILS and says so
          # instead of staying green while proving less than it appears to.
          #
          # Proven able to fail: an earlier local run with the grep inverted (to
          # expect "x5c certificate chain") failed here, confirming the line is
          # really emitted and really read rather than matching by accident.
          grep -F 'binding mechanism: cca_trusted_keys store' /tmp/probe-amf.log \
            || { echo "::error::the probe did not report the trust-store binding. If \
                 cca_trust_anchors is now configured in the overlay, update this \
                 assertion to expect 'binding mechanism: x5c certificate chain' and \
                 update specs/fix-cca-x5c-certificate-binding.md, which records that \
                 this stage does NOT cover x5c."; \
                 cat /tmp/probe-amf.log; exit 1; }

      - name: Assert the NRF authenticates to ITSELF under its own policy
        run: |
          cd nextgcore/docker/rust
          C="-f docker-compose.yml -f docker-compose.oauth2.yml"
          # Criterion 5: with oauth2.require: true the NRF requests tokens from its
          # own endpoint for outbound notifications and is not exempt from its own
          # policy. It needs its own CCA key AND a registration in its own registry.
          #
          # CCA_PROBE_AUTH_ONLY=1, and the reason is a real finding rather than a
          # workaround: a dispatched run returned
          #   unauthorized_client ... "NRF" is not in allowedNfTypes of any UDM producer
          # which is the CORRECT SBA authorization decision — every producer in the
          # overlay restricts allowedNfTypes to its actual consumers and none lists
          # NRF. Authorization is a different question from authentication and
          # happens after it (TS 33.501 §13.4.1.1.2 step 2).
          #
          # So this asserts what criterion 5 actually claims: the NRF gets PAST
          # client authentication against its own endpoint. `invalid_client` — the
          # authentication failure — still fails the step.
          docker cp binaries/cca_token_probe nextgcore-nrf:/tmp/cca_token_probe
          docker compose $C exec -T --user root nrf chmod 0755 /tmp/cca_token_probe
          docker compose $C exec -T -e CCA_PROBE_AUTH_ONLY=1 nrf /tmp/cca_token_probe \
            http://172.23.0.10:7777 \
            /var/lib/nextgcore/cca/nrf-cca.key \
            6b1d7e3c-0000-4000-8000-0000000000f0 \
            NRF UDM nudm-sdm

      - name: Collect overlay logs on failure
        if: failure()
        run: |
          cd nextgcore/docker/rust
          docker compose -f docker-compose.yml -f docker-compose.oauth2.yml logs --tail=80

      - name: Teardown the overlay
        if: always()
        run: |
          cd nextgcore/docker/rust
          docker compose -f docker-compose.yml -f docker-compose.oauth2.yml down -v

  # NOT an end-to-end attach, and named so deliberately (#328). Nothing in either
  # repo speaks S1AP or LTE NAS on the UE side, so no UE attach can be
  # originated. This stage asserts bring-up and PFCP association health, which is
  # the largest honest claim available today, and catches the
  # compose-drifts-from-the-binaries defect class.
  #
  # #380 closed one of the three gaps this comment used to list: the S5/S8 leg now
  # HAS a container to reach, so the chain MME -> SGW-C -> SGW-U -> PGW-C -> PGW-U
  # is deployed and both of its PFCP associations (Sxa and Sxb) are asserted below.
  # The remaining gap is the originator.
  #
  # Option A (an LTE eNB + UE simulator in nextgsim) is what would make this a
  # true mirror of the 5G stage. See specs/epc-e2e-scope.md.
  docker-e2e-epc:
    name: EPC bring-up (no attach; see specs/epc-e2e-scope.md)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout nextgcore
        uses: actions/checkout@v4
        with:
          path: nextgcore
      - name: Checkout nextgsim
        uses: actions/checkout@v4
        with:
          repository: NextgCoreLab/nextgsim
          # nextgsim renamed its default branch; `first_implementation` no longer
          # exists, so every cross-repo checkout failed with "git failed with exit
          # code 1". Tracking `main` rather than re-pinning: a pinned ref is what
          # rotted, and the E2E is only meaningful against current nextgsim.
          ref: main
          path: nextgsim

      - name: Build builder + extract binaries
        run: |
          cd nextgcore/docker/rust
          docker build -f Dockerfile.builder -t nextg-builder ../../../
          docker create --name builder nextg-builder /bin/true
          mkdir -p binaries
          docker cp builder:/out/. binaries/
          docker rm builder
          docker build -f Dockerfile.core -t nextgcore-core:latest .

      - name: Build EPC NF images
        run: |
          cd nextgcore/docker/rust
          # smfd and upfd are in this list because #380 deploys them as the PGW-C and
          # PGW-U (TS 23.401 4.2.1 combined SGW/PGW, realised per TS 29.244 5.2.6).
          # One image per BINARY, not per role -- the role is which config and which
          # network a container gets, so `nextgcore-rust/smf` is the PGW-C image here
          # and the SMF image in the 5G stage.
          for nf in mmed sgwcd sgwud hssd pcrfd smfd upfd; do
            docker build -f Dockerfile.nf \
              --build-arg CORE_IMAGE=nextgcore-core:latest \
              --build-arg NF_NAME=nextgcore-${nf} \
              -t nextgcore-rust/${nf%%d}:latest .
          done

      - name: Start EPC network
        run: |
          cd nextgcore/docker/rust
          docker compose -f docker-compose-epc.yml up -d mongodb-epc
          # #380: the PGW-U before the PGW-C, so the first Association Setup the
          # PGW-C sends has a peer to reach rather than having to wait out its
          # re-association hold-off.
          docker compose -f docker-compose-epc.yml up -d hss pcrf sgwc sgwu pgwu pgwc
          docker compose -f docker-compose-epc.yml up -d mme

      # Gates on the daemons' own runtime rather than a timer. The fixed sleeps
      # this replaces passed whether or not anything associated, so the stage
      # could not fail -- which is the #303 criterion-2 complaint.
      - name: Wait for PFCP association (SGW-C <-> SGW-U over Sxa)
        run: |
          cd nextgcore/docker/rust
          for attempt in $(seq 1 60); do
            associated=$(docker compose -f docker-compose-epc.yml exec -T sgwu \
              sh -c "curl -fsS http://localhost:9090/metrics 2>/dev/null \
                     | awk '/^sgwu_pfcp_associations /{print \$2}'" 2>/dev/null || echo "")
            if [ -n "$associated" ] && [ "$associated" -ge 1 ] 2>/dev/null; then
              echo "sgwu_pfcp_associations=$associated after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::sgwu_pfcp_associations never reached 1; the SGW-C did not establish Sxa"
          docker compose -f docker-compose-epc.yml logs --tail=80 sgwc sgwu
          exit 1

      # #380 criterion 2: the same gate, one hop further down the chain. The PGW-C
      # is the node the S5/S8 leg terminates at, and TS 29.244 6.2.6.2 forbids
      # session signalling without a PFCP association -- so a PGW-C that bound its
      # S5/S8 socket but never established Sxb with its PGW-U would answer every
      # relayed Create Session Request with a failure, while reporting itself
      # perfectly healthy.
      #
      # BOTH ends are asserted, not one:
      #   * `smf_n4_associations` on the PGW-C says the CP function believes it is
      #     associated (it received an Association Setup RESPONSE);
      #   * `upf_pfcp_associations` on the PGW-U says the UP function agrees (it
      #     accepted an Association Setup REQUEST and stored the peer).
      # Asserting only the CP side would pass on a PGW-C that had decided it was
      # associated to a peer that had since flushed the association; asserting only
      # the UP side would pass on an association some OTHER CP function set up.
      #
      # POSITIVE assertions on state only reachable when the association is real --
      # never "no error in the log", which is satisfied by every path that never
      # arrives.
      - name: Wait for PFCP association (PGW-C <-> PGW-U over Sxb/N4)
        run: |
          cd nextgcore/docker/rust
          for attempt in $(seq 1 60); do
            cp_side=$(docker compose -f docker-compose-epc.yml exec -T pgwc \
              sh -c "curl -fsS http://localhost:9090/metrics 2>/dev/null \
                     | awk '/^smf_n4_associations /{print \$2}'" 2>/dev/null || echo "")
            up_side=$(docker compose -f docker-compose-epc.yml exec -T pgwu \
              sh -c "curl -fsS http://localhost:9090/metrics 2>/dev/null \
                     | awk '/^upf_pfcp_associations /{print \$2}'" 2>/dev/null || echo "")
            if [ -n "$cp_side" ] && [ "$cp_side" -ge 1 ] 2>/dev/null \
               && [ -n "$up_side" ] && [ "$up_side" -ge 1 ] 2>/dev/null; then
              echo "smf_n4_associations=$cp_side upf_pfcp_associations=$up_side after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the PGW-C/PGW-U Sxb association never came up (smf_n4_associations='$cp_side' upf_pfcp_associations='$up_side'); the S5/S8 leg cannot anchor a session"
          docker compose -f docker-compose-epc.yml logs --tail=80 pgwc pgwu
          exit 1

      # #380 criterion 2, the other half: the PGW-C's S5/S8 socket is actually
      # SERVING, not merely configured. `smf_s5s8_bound` is 1 only once
      # `gtp_path::s5s8_open` has bound the socket and installed the server -- a
      # PGW-C whose `smf.gtpc.server` were missing or unparsable would log a
      # warning, come up healthy, associate over Sxb, pass the gate above, and
      # still have nothing listening on 2123.
      #
      # Separate from the association gate because it fails for a different reason
      # and wants a different error message. An operator reading
      # "the S5/S8 socket is not bound" goes to pgwc.yaml; one reading
      # "Sxb never came up" goes to the PGW-U.
      - name: Assert the PGW-C's S5/S8 socket is serving
        run: |
          cd nextgcore/docker/rust
          bound=$(docker compose -f docker-compose-epc.yml exec -T pgwc \
            sh -c "curl -fsS http://localhost:9090/metrics 2>/dev/null \
                   | awk '/^smf_s5s8_bound /{print \$2}'" 2>/dev/null || echo "")
          echo "smf_s5s8_bound=$bound"
          if [ "$bound" != "1" ]; then
            echo "::error::the PGW-C did not bind its S5/S8 GTP-C socket (smf_s5s8_bound='$bound'); a Create Session Request relayed by the SGW-C would reach nothing"
            docker compose -f docker-compose-epc.yml logs --tail=80 pgwc
            exit 1
          fi

      - name: Assert every EPC NF is healthy
        run: |
          cd nextgcore/docker/rust
          docker compose -f docker-compose-epc.yml ps
          rc=0
          # A service missing from the compose file fails here rather than being
          # silently skipped -- the compose-drift defect class this stage exists
          # to catch.
          #
          # #380 criterion 3: `pgwc` and `pgwu` are in this list. Note what the list
          # could NOT do before they were declared -- it cannot catch a service that
          # was never in the compose file, which is exactly why #380 was filed
          # separately rather than assumed covered by this loop. Adding a name here
          # is therefore load-bearing: if the compose file ever loses its session
          # anchor again, THIS is what fails.
          for svc in hss pcrf sgwc sgwu pgwc pgwu mme; do
            state=$(docker inspect "nextgcore-$svc" --format '{{.State.Status}}' 2>/dev/null || echo "absent")
            health=$(docker inspect "nextgcore-$svc" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>/dev/null || echo "absent")
            echo "$svc: state=$state health=$health"
            if [ "$state" != "running" ]; then
              echo "::error::$svc is $state, expected running"
              rc=1
            fi
            if [ "$health" = "unhealthy" ]; then
              echo "::error::$svc reports unhealthy"
              rc=1
            fi
          done
          exit $rc

      # Stated where an operator reads it, not only in the spec: a green stage
      # here must not be mistaken for a working EPC attach.
      - name: State what this stage does NOT assert
        if: always()
        run: |
          cat <<'NOTE'
          === EPC bring-up stage: scope (see nextgcore specs/epc-e2e-scope.md, #328,
              and specs/epc-pgw-container.md, #380) ===
          ASSERTED: all seven EPC NFs run and report healthy; BOTH PFCP associations in
                    the chain came up, each read from the daemons' own live metrics
                    rather than from a timer --
                      * Sxa: SGW-C <-> SGW-U   (sgwu_pfcp_associations >= 1)
                      * Sxb: PGW-C <-> PGW-U   (smf_n4_associations >= 1 AND
                                                upf_pfcp_associations >= 1)
                    and the PGW-C's S5/S8 GTP-C socket is serving
                    (smf_s5s8_bound == 1), so a Create Session Request relayed by the
                    SGW-C has a bound socket to reach.

          NOT ASSERTED, and why:
            * No UE attach. Neither repo has an LTE eNB or UE simulator -- no S1AP
              (TS 36.413) and no EMM/ESM (TS 24.301) UE side exists, and the compose
              file has no enb/ue service. The MME's attach chain IS complete in code
              (s1ap_handler.rs -> nas_dispatch -> s11_handler.rs), and as of #380 the
              S5/S8 hop it ends at is now DEPLOYED as well; only the originator is
              missing. Tracked as option A in #328 / nextgsim #186.
            * No GTP-U user-plane forwarding, and so no 0%-loss claim: that needs an
              attach to establish a bearer first.
            * No S5/S8 TRANSACTION. The PGW-C's socket is bound and its Sxb
              association is up, which is every precondition for anchoring a session
              -- but nothing here sends a Create Session Request, because only an
              attach originates one. This is the ceiling #380 leaves in place, and it
              is the same ceiling as the first bullet, not a second gap.
          NOTE

      - name: Collect logs on failure
        if: failure()
        run: |
          cd nextgcore/docker/rust
          docker compose -f docker-compose-epc.yml logs --tail=50

      - name: Teardown
        if: always()
        run: |
          cd nextgcore/docker/rust
          docker compose -f docker-compose-epc.yml down -v
