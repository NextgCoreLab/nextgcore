name: CI

on:
  push:
    branches: [initial_commit, main]
  pull_request:
    branches: [initial_commit, main]
  # Heavy Docker image/E2E jobs recompile both workspaces in a container and
  # need a cross-repo checkout, so they stay off the per-PR path. They run
  # NIGHTLY (schedule, below) and on demand via the Actions tab "Run workflow".
  # The fast gate (check/test/clippy/fmt) runs on every push/PR to the branches
  # above.
  #
  # Nightly rather than dispatch-only because a cross-repo E2E that runs only
  # when someone remembers to press a button gates nothing while reading as
  # covered. See specs/cross-repo-e2e-gating.md (#349).
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: cargo check
        run: cd src && cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: cargo test
        # No retry, and nothing left for one to hide. There was one, for two named
        # races: process-global state and the free_port TOCTOU.
        #
        # #308 fixed the first (one ambient test lock per crate, covering readers
        # as well as writers) and measured what the retry had been hiding -- about
        # 1 whole-workspace run in 5, in three smfd tests, for months, because a
        # single retry passes ~96% of the time at that rate and the warning
        # annotation went unread. A retry that can hide a 20% flake is not a flake
        # mitigation, it is a detector for exactly the failures nobody
        # investigates.
        #
        # #313 CLOSED the second. `free_port` used to hand out a port and unbind it
        # before the caller bound it, with a per-BINARY issued-port set, so two
        # crates could be given the same port and one would fail to bind.
        # `test_support::bound_listener` now keeps the port bound and
        # `SbiServer::on_listener` serves that listener, so there is no window:
        # all 243 ephemeral-port server starts in this workspace now reserve.
        # `free_port` survives only for the 10 callers that want a port with
        # NOTHING listening on it (transport-error and degrade-open tests), where
        # being unbound is the point, plus one integration test that hands ports to
        # a child PROCESS and so cannot pass a socket at all.
        #
        # So a red here is a real failure. Read it, do not re-run it.
        run: cd src && cargo test --workspace

      - name: cargo test (non-default features)
        # Feature-gated paths are invisible to the default build, so a gated
        # module rots uncompiled -- the reason this project normally prefers a
        # runtime switch to a cargo feature. easdfd's `dns-udp` listener (#276)
        # has to be a feature (it binds a privileged port), so it gets an
        # explicit build+test here instead. Add a line per gated feature.
        run: cd src && cargo test -p nextgcore-easdfd --features dns-udp

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: cargo clippy
        # Pre-existing codebase has many style lints from Rust 1.95.
        # Gate on errors only; warnings shown but don't fail CI until the
        # tail is cleaned up incrementally. See Phase 8 follow-ups.
        run: cd src && cargo clippy --workspace

      - name: cargo clippy (non-default features)
        # Same reasoning as the test job's non-default step: a gated module is
        # invisible to a default-feature lint. One line per gated feature.
        run: cd src && cargo clippy -p nextgcore-easdfd --features dns-udp --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cd src && cargo fmt --all -- --check

  docker-build:
    name: Docker Build
    # Nightly OR on demand. A disjunction, not a replacement: the dispatch path
    # is unchanged. Both E2E jobs declare `needs: docker-build`, so gating this
    # one job gates all three. See specs/cross-repo-e2e-gating.md (#349).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout nextgcore
        uses: actions/checkout@v4
        with:
          path: nextgcore

      - name: Checkout nextgsim (sibling repo required by Dockerfile.builder)
        uses: actions/checkout@v4
        with:
          repository: NextgCoreLab/nextgsim
          # nextgsim renamed its default branch; `first_implementation` no longer
          # exists, so every cross-repo checkout failed with "git failed with exit
          # code 1". Tracking `main` rather than re-pinning: a pinned ref is what
          # rotted, and the E2E is only meaningful against current nextgsim.
          ref: main
          path: nextgsim

      - name: Build builder image
        run: |
          cd nextgcore/docker/rust
          # Build context = parent (./) so Dockerfile.builder can COPY both
          # nextgcore/src and nextgsim subtrees.
          docker build -f Dockerfile.builder -t nextg-builder ../../../

      - name: Extract binaries
        run: |
          cd nextgcore
          docker create --name builder nextg-builder /bin/true
          mkdir -p docker/rust/binaries
          docker cp builder:/out/. docker/rust/binaries/
          docker rm builder
          ls -la docker/rust/binaries/

      - name: Build core base image
        run: |
          cd nextgcore/docker/rust
          docker build -f Dockerfile.core -t nextgcore-core:latest .

      - name: Build 5GC NF images
        run: |
          cd nextgcore/docker/rust
          for nf in amfd ausfd bsfd dccfd eesd lmfd mbsmfd nrfd nsacfd nssfd nwdafd pcfd pind scpd seppd smfd udmd udrd upfd; do
            echo "Building 5GC nextgcore-${nf}..."
            docker build -f Dockerfile.nf \
              --build-arg CORE_IMAGE=nextgcore-core:latest \
              --build-arg NF_NAME=nextgcore-${nf} \
              -t nextgcore-rust/${nf%%d}:latest . || echo "WARN: ${nf} build failed"
          done

      - name: Build EPC NF images
        run: |
          cd nextgcore/docker/rust
          for nf in mmed sgwcd sgwud hssd pcrfd; do
            echo "Building EPC nextgcore-${nf}..."
            docker build -f Dockerfile.nf \
              --build-arg CORE_IMAGE=nextgcore-core:latest \
              --build-arg NF_NAME=nextgcore-${nf} \
              -t nextgcore-rust/${nf%%d}:latest . || echo "WARN: ${nf} build failed"
          done

      - name: Verify images
        run: |
          echo "Built images:"
          docker images | grep nextgcore | sort

  docker-e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout nextgcore
        uses: actions/checkout@v4
        with:
          path: nextgcore
      - name: Checkout nextgsim
        uses: actions/checkout@v4
        with:
          repository: NextgCoreLab/nextgsim
          # nextgsim renamed its default branch; `first_implementation` no longer
          # exists, so every cross-repo checkout failed with "git failed with exit
          # code 1". Tracking `main` rather than re-pinning: a pinned ref is what
          # rotted, and the E2E is only meaningful against current nextgsim.
          ref: main
          path: nextgsim

      - name: Build all images (repeat for job isolation)
        run: |
          cd nextgcore/docker/rust
          docker build -f Dockerfile.builder -t nextg-builder ../../../
          docker create --name builder nextg-builder /bin/true
          mkdir -p binaries
          docker cp builder:/out/. binaries/
          docker rm builder
          docker build -f Dockerfile.core -t nextgcore-core:latest .
          for nf in amfd ausfd bsfd nrfd nssfd pcfd smfd udmd udrd upfd; do
            docker build -f Dockerfile.nf \
              --build-arg CORE_IMAGE=nextgcore-core:latest \
              --build-arg NF_NAME=nextgcore-${nf} \
              -t nextgcore-rust/${nf%%d}:latest .
          done

      - name: Start core network
        run: |
          cd nextgcore/docker/rust
          docker compose up -d mongodb nrf
          sleep 5
          docker compose up -d ausf udm udr pcf nssf bsf
          sleep 5
          docker compose up -d amf smf upf
          sleep 10

      - name: Health check
        run: |
          cd nextgcore/docker/rust
          echo "=== Container status ==="
          docker compose ps
          echo "=== NRF health ==="
          curl -sf http://172.23.0.10:7777/healthz || echo "NRF not responding"
          echo "=== AMF health ==="
          curl -sf http://172.23.0.5:7777/healthz || echo "AMF not responding"

      - name: Collect logs on failure
        if: failure()
        run: |
          cd nextgcore/docker/rust
          docker compose logs --tail=50

      - name: Teardown
        if: always()
        run: |
          cd nextgcore/docker/rust
          docker compose down -v

      # Issue #187: the OAuth2 overlay is the project's only end-to-end
      # demonstration of SBI OAuth2, and it used to run with token-endpoint
      # client authentication DISABLED, because nothing could pin an
      # nfInstanceId and so no CCA trust store could be provisioned. Both are
      # fixed; this stage is what keeps them fixed.
      #
      # SCHEDULED half of the two-gate split in specs/cross-repo-e2e-gating.md.
      # The per-PR half is the in-process nrfd test
      # `a_cca_signed_by_a_directory_published_key_is_accepted_and_an_unpublished_one_is_not`,
      # which asserts the same positive AND negative outcomes against the real
      # token handler. Neither substitutes for the other: the unit test cannot
      # prove two containers complete the exchange over the wire, and this stage
      # cannot run on a PR.
      #
      # SCOPE CEILING, stated rather than implied: this reuses the 10 NF images
      # the build step above produces, so it exercises nrf/udr/udm/ausf/pcf/
      # nssf/bsf/amf/smf/upf. The overlay also configures dccf, lmf, mbsmf,
      # nsacf and nwdaf, and those five are NOT covered here because no image for
      # them is built in this job. Extending the build list would roughly double
      # an already ~20-minute stage; the five are Rel-17 NFs off the
      # registration + PDU-session path this stage asserts.
      - name: Start the OAuth2 overlay (authenticated token endpoint)
        run: |
          cd nextgcore/docker/rust
          C="-f docker-compose.yml -f docker-compose.oauth2.yml"
          docker compose $C up -d mongodb nrf
          sleep 5
          docker compose $C up -d ausf udm udr pcf nssf bsf
          sleep 5
          docker compose $C up -d amf smf upf
          sleep 15

      - name: Assert client authentication is REQUIRED, not opted out
        run: |
          cd nextgcore/docker/rust
          C="-f docker-compose.yml -f docker-compose.oauth2.yml"
          LOG=$(docker compose $C logs nrf)
          echo "$LOG" | grep -F 'token-endpoint client authentication required' \
            || { echo "::error::the NRF did not log client authentication as REQUIRED"; \
                 echo "$LOG" | tail -60; exit 1; }
          # The escape hatch this issue removed must not be back by any route
          # (the config key, or NRF_SBI_OAUTH2_ALLOW_UNAUTHENTICATED).
          if echo "$LOG" | grep -F 'client authentication is DISABLED'; then
            echo "::error::the NRF opted OUT of client authentication -- #187 regressed"
            exit 1
          fi

      - name: Assert consumers published CCA keys and no private key leaked
        run: |
          cd nextgcore/docker/rust
          C="-f docker-compose.yml -f docker-compose.oauth2.yml"
          PUBLISHED=$(docker compose $C exec -T nrf \
            sh -c 'ls /etc/nextgcore/cca-public/*.jwk 2>/dev/null | wc -l' | tr -d '\r')
          echo "published CCA public JWKs: $PUBLISHED"
          if [ "${PUBLISHED:-0}" -lt 2 ]; then
            echo "::error::expected several published CCA public keys, found ${PUBLISHED:-0}"
            docker compose $C logs nrf | tail -40
            exit 1
          fi
          # Criterion 4: only PUBLIC material in the shared directory.
          if docker compose $C exec -T nrf sh -c 'ls /etc/nextgcore/cca-public/' \
               | grep -q '\.key$'; then
            echo "::error::a private key is in the PUBLIC JWK directory"
            exit 1
          fi

      # POSITIVE assertion, and it has to be positive. The first version of this
      # step grepped the logs for `invalid_client` and passed when it found none —
      # which a dispatched run proved VACUOUS: the log contained zero token
      # requests, because a bring-up-only run gives the NFs no reason to need a
      # token. A negative assertion is satisfied by every path that never arrives.
      #
      # So drive the live token endpoint over the wire with a CCA signed by a key
      # the NRF actually holds (from the shared trust-store directory), and require
      # a real token back. The probe ALSO presents a CCA signed by an untrusted key
      # and requires `invalid_client`, so a pass cannot come from an NRF that
      # authenticates nobody — the posture #187 removed.
      #
      # Run inside the AMF container: it is the only place that can reach both the
      # private key (on the `cca_keys` volume, deliberately not shared with the
      # host) and the NRF on the core network.
      - name: Assert the authenticated token exchange succeeded (positive + negative)
        run: |
          cd nextgcore/docker/rust
          C="-f docker-compose.yml -f docker-compose.oauth2.yml"
          docker compose $C ps
          # The probe is extracted from the builder image into binaries/ alongside
          # the NF binaries (see Dockerfile.builder).
          test -f binaries/cca_token_probe \
            || { echo "::error::binaries/cca_token_probe missing -- the builder did not produce it"; exit 1; }
          docker cp binaries/cca_token_probe nextgcore-amf:/tmp/cca_token_probe
          docker compose $C exec -T --user root amf chmod 0755 /tmp/cca_token_probe
          docker compose $C exec -T amf /tmp/cca_token_probe \
            http://172.23.0.10:7777 \
            /var/lib/nextgcore/cca/amf-cca.key \
            6b1d7e3c-0000-4000-8000-000000000af0 \
            AMF UDM nudm-sdm

      - name: Assert the NRF authenticates to ITSELF under its own policy
        run: |
          cd nextgcore/docker/rust
          C="-f docker-compose.yml -f docker-compose.oauth2.yml"
          # Criterion 5: with oauth2.require: true the NRF requests tokens from its
          # own endpoint for outbound notifications and is not exempt from its own
          # policy. It needs its own CCA key AND a registration in its own registry.
          docker cp binaries/cca_token_probe nextgcore-nrf:/tmp/cca_token_probe
          docker compose $C exec -T --user root nrf chmod 0755 /tmp/cca_token_probe
          docker compose $C exec -T nrf /tmp/cca_token_probe \
            http://172.23.0.10:7777 \
            /var/lib/nextgcore/cca/nrf-cca.key \
            6b1d7e3c-0000-4000-8000-0000000000f0 \
            NRF UDM nudm-sdm

      - name: Collect overlay logs on failure
        if: failure()
        run: |
          cd nextgcore/docker/rust
          docker compose -f docker-compose.yml -f docker-compose.oauth2.yml logs --tail=80

      - name: Teardown the overlay
        if: always()
        run: |
          cd nextgcore/docker/rust
          docker compose -f docker-compose.yml -f docker-compose.oauth2.yml down -v

  # NOT an end-to-end attach, and named so deliberately (#328). Nothing in either
  # repo speaks S1AP or LTE NAS on the UE side, so no UE attach can be
  # originated. This stage asserts bring-up and PFCP association health, which is
  # the largest honest claim available today, and catches the
  # compose-drifts-from-the-binaries defect class.
  #
  # #380 closed one of the three gaps this comment used to list: the S5/S8 leg now
  # HAS a container to reach, so the chain MME -> SGW-C -> SGW-U -> PGW-C -> PGW-U
  # is deployed and both of its PFCP associations (Sxa and Sxb) are asserted below.
  # The remaining gap is the originator.
  #
  # Option A (an LTE eNB + UE simulator in nextgsim) is what would make this a
  # true mirror of the 5G stage. See specs/epc-e2e-scope.md.
  docker-e2e-epc:
    name: EPC bring-up (no attach; see specs/epc-e2e-scope.md)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout nextgcore
        uses: actions/checkout@v4
        with:
          path: nextgcore
      - name: Checkout nextgsim
        uses: actions/checkout@v4
        with:
          repository: NextgCoreLab/nextgsim
          # nextgsim renamed its default branch; `first_implementation` no longer
          # exists, so every cross-repo checkout failed with "git failed with exit
          # code 1". Tracking `main` rather than re-pinning: a pinned ref is what
          # rotted, and the E2E is only meaningful against current nextgsim.
          ref: main
          path: nextgsim

      - name: Build builder + extract binaries
        run: |
          cd nextgcore/docker/rust
          docker build -f Dockerfile.builder -t nextg-builder ../../../
          docker create --name builder nextg-builder /bin/true
          mkdir -p binaries
          docker cp builder:/out/. binaries/
          docker rm builder
          docker build -f Dockerfile.core -t nextgcore-core:latest .

      - name: Build EPC NF images
        run: |
          cd nextgcore/docker/rust
          # smfd and upfd are in this list because #380 deploys them as the PGW-C and
          # PGW-U (TS 23.401 4.2.1 combined SGW/PGW, realised per TS 29.244 5.2.6).
          # One image per BINARY, not per role -- the role is which config and which
          # network a container gets, so `nextgcore-rust/smf` is the PGW-C image here
          # and the SMF image in the 5G stage.
          for nf in mmed sgwcd sgwud hssd pcrfd smfd upfd; do
            docker build -f Dockerfile.nf \
              --build-arg CORE_IMAGE=nextgcore-core:latest \
              --build-arg NF_NAME=nextgcore-${nf} \
              -t nextgcore-rust/${nf%%d}:latest .
          done

      - name: Start EPC network
        run: |
          cd nextgcore/docker/rust
          docker compose -f docker-compose-epc.yml up -d mongodb-epc
          # #380: the PGW-U before the PGW-C, so the first Association Setup the
          # PGW-C sends has a peer to reach rather than having to wait out its
          # re-association hold-off.
          docker compose -f docker-compose-epc.yml up -d hss pcrf sgwc sgwu pgwu pgwc
          docker compose -f docker-compose-epc.yml up -d mme

      # Gates on the daemons' own runtime rather than a timer. The fixed sleeps
      # this replaces passed whether or not anything associated, so the stage
      # could not fail -- which is the #303 criterion-2 complaint.
      - name: Wait for PFCP association (SGW-C <-> SGW-U over Sxa)
        run: |
          cd nextgcore/docker/rust
          for attempt in $(seq 1 60); do
            associated=$(docker compose -f docker-compose-epc.yml exec -T sgwu \
              sh -c "curl -fsS http://localhost:9090/metrics 2>/dev/null \
                     | awk '/^sgwu_pfcp_associations /{print \$2}'" 2>/dev/null || echo "")
            if [ -n "$associated" ] && [ "$associated" -ge 1 ] 2>/dev/null; then
              echo "sgwu_pfcp_associations=$associated after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::sgwu_pfcp_associations never reached 1; the SGW-C did not establish Sxa"
          docker compose -f docker-compose-epc.yml logs --tail=80 sgwc sgwu
          exit 1

      # #380 criterion 2: the same gate, one hop further down the chain. The PGW-C
      # is the node the S5/S8 leg terminates at, and TS 29.244 6.2.6.2 forbids
      # session signalling without a PFCP association -- so a PGW-C that bound its
      # S5/S8 socket but never established Sxb with its PGW-U would answer every
      # relayed Create Session Request with a failure, while reporting itself
      # perfectly healthy.
      #
      # BOTH ends are asserted, not one:
      #   * `smf_n4_associations` on the PGW-C says the CP function believes it is
      #     associated (it received an Association Setup RESPONSE);
      #   * `upf_pfcp_associations` on the PGW-U says the UP function agrees (it
      #     accepted an Association Setup REQUEST and stored the peer).
      # Asserting only the CP side would pass on a PGW-C that had decided it was
      # associated to a peer that had since flushed the association; asserting only
      # the UP side would pass on an association some OTHER CP function set up.
      #
      # POSITIVE assertions on state only reachable when the association is real --
      # never "no error in the log", which is satisfied by every path that never
      # arrives.
      - name: Wait for PFCP association (PGW-C <-> PGW-U over Sxb/N4)
        run: |
          cd nextgcore/docker/rust
          for attempt in $(seq 1 60); do
            cp_side=$(docker compose -f docker-compose-epc.yml exec -T pgwc \
              sh -c "curl -fsS http://localhost:9090/metrics 2>/dev/null \
                     | awk '/^smf_n4_associations /{print \$2}'" 2>/dev/null || echo "")
            up_side=$(docker compose -f docker-compose-epc.yml exec -T pgwu \
              sh -c "curl -fsS http://localhost:9090/metrics 2>/dev/null \
                     | awk '/^upf_pfcp_associations /{print \$2}'" 2>/dev/null || echo "")
            if [ -n "$cp_side" ] && [ "$cp_side" -ge 1 ] 2>/dev/null \
               && [ -n "$up_side" ] && [ "$up_side" -ge 1 ] 2>/dev/null; then
              echo "smf_n4_associations=$cp_side upf_pfcp_associations=$up_side after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the PGW-C/PGW-U Sxb association never came up (smf_n4_associations='$cp_side' upf_pfcp_associations='$up_side'); the S5/S8 leg cannot anchor a session"
          docker compose -f docker-compose-epc.yml logs --tail=80 pgwc pgwu
          exit 1

      # #380 criterion 2, the other half: the PGW-C's S5/S8 socket is actually
      # SERVING, not merely configured. `smf_s5s8_bound` is 1 only once
      # `gtp_path::s5s8_open` has bound the socket and installed the server -- a
      # PGW-C whose `smf.gtpc.server` were missing or unparsable would log a
      # warning, come up healthy, associate over Sxb, pass the gate above, and
      # still have nothing listening on 2123.
      #
      # Separate from the association gate because it fails for a different reason
      # and wants a different error message. An operator reading
      # "the S5/S8 socket is not bound" goes to pgwc.yaml; one reading
      # "Sxb never came up" goes to the PGW-U.
      - name: Assert the PGW-C's S5/S8 socket is serving
        run: |
          cd nextgcore/docker/rust
          bound=$(docker compose -f docker-compose-epc.yml exec -T pgwc \
            sh -c "curl -fsS http://localhost:9090/metrics 2>/dev/null \
                   | awk '/^smf_s5s8_bound /{print \$2}'" 2>/dev/null || echo "")
          echo "smf_s5s8_bound=$bound"
          if [ "$bound" != "1" ]; then
            echo "::error::the PGW-C did not bind its S5/S8 GTP-C socket (smf_s5s8_bound='$bound'); a Create Session Request relayed by the SGW-C would reach nothing"
            docker compose -f docker-compose-epc.yml logs --tail=80 pgwc
            exit 1
          fi

      - name: Assert every EPC NF is healthy
        run: |
          cd nextgcore/docker/rust
          docker compose -f docker-compose-epc.yml ps
          rc=0
          # A service missing from the compose file fails here rather than being
          # silently skipped -- the compose-drift defect class this stage exists
          # to catch.
          #
          # #380 criterion 3: `pgwc` and `pgwu` are in this list. Note what the list
          # could NOT do before they were declared -- it cannot catch a service that
          # was never in the compose file, which is exactly why #380 was filed
          # separately rather than assumed covered by this loop. Adding a name here
          # is therefore load-bearing: if the compose file ever loses its session
          # anchor again, THIS is what fails.
          for svc in hss pcrf sgwc sgwu pgwc pgwu mme; do
            state=$(docker inspect "nextgcore-$svc" --format '{{.State.Status}}' 2>/dev/null || echo "absent")
            health=$(docker inspect "nextgcore-$svc" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>/dev/null || echo "absent")
            echo "$svc: state=$state health=$health"
            if [ "$state" != "running" ]; then
              echo "::error::$svc is $state, expected running"
              rc=1
            fi
            if [ "$health" = "unhealthy" ]; then
              echo "::error::$svc reports unhealthy"
              rc=1
            fi
          done
          exit $rc

      # Stated where an operator reads it, not only in the spec: a green stage
      # here must not be mistaken for a working EPC attach.
      - name: State what this stage does NOT assert
        if: always()
        run: |
          cat <<'NOTE'
          === EPC bring-up stage: scope (see nextgcore specs/epc-e2e-scope.md, #328,
              and specs/epc-pgw-container.md, #380) ===
          ASSERTED: all seven EPC NFs run and report healthy; BOTH PFCP associations in
                    the chain came up, each read from the daemons' own live metrics
                    rather than from a timer --
                      * Sxa: SGW-C <-> SGW-U   (sgwu_pfcp_associations >= 1)
                      * Sxb: PGW-C <-> PGW-U   (smf_n4_associations >= 1 AND
                                                upf_pfcp_associations >= 1)
                    and the PGW-C's S5/S8 GTP-C socket is serving
                    (smf_s5s8_bound == 1), so a Create Session Request relayed by the
                    SGW-C has a bound socket to reach.

          NOT ASSERTED, and why:
            * No UE attach. Neither repo has an LTE eNB or UE simulator -- no S1AP
              (TS 36.413) and no EMM/ESM (TS 24.301) UE side exists, and the compose
              file has no enb/ue service. The MME's attach chain IS complete in code
              (s1ap_handler.rs -> nas_dispatch -> s11_handler.rs), and as of #380 the
              S5/S8 hop it ends at is now DEPLOYED as well; only the originator is
              missing. Tracked as option A in #328 / nextgsim #186.
            * No GTP-U user-plane forwarding, and so no 0%-loss claim: that needs an
              attach to establish a bearer first.
            * No S5/S8 TRANSACTION. The PGW-C's socket is bound and its Sxb
              association is up, which is every precondition for anchoring a session
              -- but nothing here sends a Create Session Request, because only an
              attach originates one. This is the ceiling #380 leaves in place, and it
              is the same ceiling as the first bullet, not a second gap.
          NOTE

      - name: Collect logs on failure
        if: failure()
        run: |
          cd nextgcore/docker/rust
          docker compose -f docker-compose-epc.yml logs --tail=50

      - name: Teardown
        if: always()
        run: |
          cd nextgcore/docker/rust
          docker compose -f docker-compose-epc.yml down -v
