# NextGCore AUSF Steering of Roaming Protection Service OpenAPI Specification
# Honest stub reflecting the implemented surface (bins/nextgcore-ausfd)
# Based on 3GPP TS 29.509 v18 / TS 33.501 §6.14

openapi: 3.0.3
info:
  title: AUSF SoR Protection Service
  version: 1.0.0
  description: AUSF Steering of Roaming protection (nausf-sorprotection) per 3GPP TS 29.509 — computes SoR-MAC-I_AUSF from K_AUSF so the UDM can deliver integrity-protected steering lists (TS 33.501 §6.14, fail-closed)

servers:
  - url: "{apiRoot}/nausf-sorprotection/v1"
    variables:
      apiRoot:
        default: http://localhost:7777

paths:
  /{supi}/ue-sor:
    post:
      summary: Compute SoR protection material for a steering list
      operationId: SorProtection
      parameters:
        - $ref: "#/components/parameters/Supi"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SorInfo"
      responses:
        "200":
          description: SoR security material (SoR-MAC-I_AUSF, CounterSoR, optional SoR-XMAC-I_UE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SorSecurityInfo"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    Supi:
      name: supi
      in: path
      required: true
      schema:
        type: string

  schemas:
    SorInfo:
      type: object
      required:
        - ackInd
      properties:
        steeringContainer:
          type: array
          description: Steering info list (preferred PLMN/access-technology combinations) or secured packet
          items:
            $ref: "#/components/schemas/SteeringInfo"
        ackInd:
          type: boolean
          description: Whether UE acknowledgement (SoR-MAC-I_UE) is requested

    SteeringInfo:
      type: object
      properties:
        plmnId:
          $ref: "#/components/schemas/PlmnId"
        accessTechList:
          type: array
          items:
            type: string

    SorSecurityInfo:
      type: object
      required:
        - sorMacIausf
        - counterSor
      properties:
        sorMacIausf:
          type: string
          pattern: '^[A-Fa-f0-9]{32}$'
        counterSor:
          type: string
          pattern: '^[A-Fa-f0-9]{4}$'
        sorXmacIue:
          type: string
          pattern: '^[A-Fa-f0-9]{32}$'
          description: Expected UE acknowledgement MAC, returned when ackInd is true

    PlmnId:
      type: object
      required:
        - mcc
        - mnc
      properties:
        mcc:
          type: string
          pattern: '^[0-9]{3}$'
        mnc:
          type: string
          pattern: '^[0-9]{2,3}$'

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

  responses:
    NotFound:
      description: Not found (no K_AUSF for this SUPI)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
