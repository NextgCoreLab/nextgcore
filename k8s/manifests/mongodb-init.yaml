apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-scripts
  namespace: nextg-system
  labels:
    app.kubernetes.io/part-of: nextgcore
data:
  mongo-init.js: |
    db = db.getSiblingDB('nextgcore');
    db.subscribers.createIndex({ "imsi": 1 }, { unique: true });
    db.subscribers.createIndex({ "msisdn": 1 });
    db.nfInstances.createIndex({ "nfInstanceId": 1 }, { unique: true });
    db.nfInstances.createIndex({ "nfType": 1 });
    db.nfInstances.createIndex({ "nfStatus": 1 });
    db.sessions.createIndex({ "supi": 1 });
    db.sessions.createIndex({ "pduSessionId": 1 });
    db.sessions.createIndex({ "dnn": 1 });
    db.policyData.createIndex({ "supi": 1 });
    db.accounts.createIndex({ "username": 1 }, { unique: true });
    // The subscriber seed below is updateOne+upsert rather than insertOne: this
    // Job is re-applied by every deploy.sh run, and insertOne against an existing
    // unique index aborts the script with "E11000 duplicate key error",
    // CrashLoopBackOff-ing the Job even though the seed data was already correct.
    // No WebUI account is seeded (#692, as #118 did for the compose stack):
    // TS 33.117 4.2.3.4.2.2 forbids shipping a predefined privileged credential.
    // Create the first admin with webui/server/bin/create-admin.js <username>.
    db.subscribers.updateOne({ imsi: "999700000000001" }, { $setOnInsert: {
        imsi: "999700000000001",
        msisdn: ["821000000001"],
        security: {
            k: "465B5CE8B199B49FAA5F0A2EE238A6BC",
            opc: "E8ED289DEBA952E4283B54E88E6D834D",
            amf: "8000"
        },
        ambr: {
            uplink: { value: 1, unit: 3 },
            downlink: { value: 1, unit: 3 }
        },
        slice: [{
            sst: 1,
            default_indicator: true,
            session: [{
                name: "internet",
                type: 3,
                qos: { index: 9, arp: { priority_level: 8, pre_emption_capability: 1, pre_emption_vulnerability: 1 } },
                ambr: { uplink: { value: 1, unit: 3 }, downlink: { value: 1, unit: 3 } }
            }]
        }],
        access_restriction_data: 32,
        subscriber_status: 0,
        network_access_mode: 0,
        subscribed_rau_tau_timer: 12,
        created: new Date()
    } }, { upsert: true });
    db.subscribers.updateOne({ imsi: "001010123456789" }, { $setOnInsert: {
        imsi: "001010123456789",
        msisdn: ["821012345678"],
        security: {
            k: "465B5CE8B199B49FAA5F0A2EE238A6BC",
            opc: "E8ED289DEBA952E4283B54E88E6183CA",
            amf: "8000"
        },
        ambr: {
            uplink: { value: 1, unit: 3 },
            downlink: { value: 1, unit: 3 }
        },
        slice: [{
            sst: 1,
            default_indicator: true,
            session: [{
                name: "internet",
                type: 3,
                qos: { index: 9, arp: { priority_level: 8, pre_emption_capability: 1, pre_emption_vulnerability: 1 } },
                ambr: { uplink: { value: 1, unit: 3 }, downlink: { value: 1, unit: 3 } }
            }]
        }],
        access_restriction_data: 32,
        subscriber_status: 0,
        network_access_mode: 0,
        subscribed_rau_tau_timer: 12,
        created: new Date()
    } }, { upsert: true });
    print("NextGCore MongoDB initialization completed.");
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
  namespace: nextg-system
  labels:
    app.kubernetes.io/part-of: nextgcore
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-mongodb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongodb.nextg-system.svc.cluster.local 27017; do echo waiting for mongodb; sleep 2; done']
      containers:
        - name: init
          image: mongo:6.0
          command: ["mongosh", "mongodb://mongodb.nextg-system.svc.cluster.local:27017/nextgcore", "/scripts/mongo-init.js"]
          volumeMounts:
            - name: init-scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: init-scripts
          configMap:
            name: mongodb-init-scripts
