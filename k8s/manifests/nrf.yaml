# ClusterIP, never NodePort (#1365): the SBI is unauthenticated in the dev
# profile, and a NodePort opens it on every node IP. From a workstation use
#   kubectl -n nextg-system port-forward svc/nrf 7777:7777
apiVersion: v1
kind: Service
metadata:
  name: nrf
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: nrf
    app.kubernetes.io/part-of: nextgcore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nrf
  ports:
    - name: sbi
      port: 7777
      targetPort: 7777
      protocol: TCP
---
# /metrics (#1334) has its own ClusterIP Service. Prometheus scrapes
# nrf-metrics:9090 from inside the cluster; nothing publishes it (#1365).
apiVersion: v1
kind: Service
metadata:
  name: nrf-metrics
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: nrf
    app.kubernetes.io/part-of: nextgcore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nrf
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nrf
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: nrf
    app.kubernetes.io/part-of: nextgcore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nrf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nrf
        app.kubernetes.io/part-of: nextgcore
    spec:
      initContainers:
        - name: wait-mongodb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongodb.nextg-system.svc.cluster.local 27017; do echo waiting for mongodb; sleep 2; done']
      containers:
        - name: nrf
          image: nextgcore-rust/nrf:latest
          imagePullPolicy: IfNotPresent
          # --sbi-addr overrides nrf.sbi.server (#1311; loopback with neither,
          # #1308): every pod
          # interface, so the Service and the other NFs reach it.
          args: ["-c", "/etc/nextgcore/nrf.yaml", "--sbi-addr", "0.0.0.0"]
          ports:
            - containerPort: 7777
              name: sbi
            - containerPort: 9090
              name: metrics
          env:
            - name: RUST_LOG
              value: info
            - name: RUST_BACKTRACE
              value: "1"
            # /metrics (#1334) defaults to 127.0.0.1 (#837); in the pod it must
            # accept the pod IP for Prometheus. Reached only through the
            # nrf-metrics ClusterIP Service.
            - name: NEXTGCORE_METRICS_BIND
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nextgcore/nrf.yaml
              subPath: nrf.yaml
              readOnly: true
            - name: logs
              mountPath: /var/log/nextgcore
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: nextgcore-configs
        - name: logs
          emptyDir: {}
