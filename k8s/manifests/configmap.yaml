apiVersion: v1
kind: ConfigMap
metadata:
  name: nextgcore-configs
  namespace: nextg-system
  labels:
    app.kubernetes.io/part-of: nextgcore
data:
  nrf.yaml: |
    logger:
      file:
        path: /var/log/nextgcore/nrf.log
      level: info
    global:
      max:
        ue: 1024
        peer: 64
    nrf:
      serving:
        - plmn_id:
            mcc: "999"
            mnc: "70"
      sbi:
        server:
          - address: 0.0.0.0
            advertise: nrf.nextg-system.svc.cluster.local
            port: 7777
            # TLS on the NRF's one SBI listener (#1617), as in every compose
            # stack. The NRF asks each client for a certificate (client_auth:
            # optional): a presented one must chain to `ca`, and its urn:uuid URI
            # SAN and RFC 9310 NFTypes are the registrant identity NFRegister /
            # NFUpdate / NFDeregister bind to (TS 33.310 §6.1.3c.3, TS 33.501
            # §13.1.0); a client without one still completes the handshake. The
            # files are Secret nf-tls-nrf, issued at deploy time from
            # docker/rust/certs/nf-identities.txt by k8s/nf-tls-secrets.sh.
            tls:
              enabled: true
              cert: /etc/nextgcore/certs/nrf.crt
              key: /etc/nextgcore/certs/nrf.key
              ca: /etc/nextgcore/certs/ca.crt
              client_auth: optional
              # Minimum TLS version per 3GPP TS 33.501 §13.2
              min_version: "1.2"
      # #2052: who may claim which NF Set (#1719), and which AMF may list GUAMIs
      # of which AMF Set (#2035, TS 23.003 §2.10.1, §28.12). Under the
      # production profile the NRF refuses an AMF's guamiList unless an entry
      # admits that AMF for its AMF Set; under dev, once this list is present,
      # it is enforced too. The one entry is this stack's AMF: amf.yaml below
      # (guami PLMN 999/70, amf_id region 2, set 1) and NEXTGCORE_AMF_INSTANCE_ID
      # in amf.yaml's Deployment (docker/rust/certs/nf-identities.txt). These
      # are static manifests: when you change the AMF's PLMN, region, set or
      # instance ID, change this entry with it. The NF Set ID is
      # set<set, 3 hex digits>.region<region, 2 hex digits>.amfset.5gc.mnc<MNC,
      # 3 digits>.mcc<MCC>; region 2, set 1 are 02 and 001. An AMF Set's other
      # AMFs go into its nf_instance_ids; another AMF Set needs its own entry.
      nf_set_allowlist:
        - nf_set_id: set001.region02.amfset.5gc.mnc070.mcc999
          nf_types: [AMF]
          nf_instance_ids:
            - "6b1d7e3c-0000-4000-8000-000000000af0"

  ausf.yaml: |
    logger:
      file:
        path: /var/log/nextgcore/ausf.log
      level: info
    global:
      max:
        ue: 1024
        peer: 64
    ausf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          nrf:
            - uri: https://nrf.nextg-system.svc.cluster.local:7777

  udm.yaml: |
    logger:
      file:
        path: /var/log/nextgcore/udm.log
      level: info
    global:
      max:
        ue: 1024
        peer: 64
    udm:
      hnet:
        - id: 1
          scheme: 1
          key: /etc/nextgcore/hnet/curve25519-1.key
        - id: 2
          scheme: 2
          key: /etc/nextgcore/hnet/secp256r1-2.key
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          nrf:
            - uri: https://nrf.nextg-system.svc.cluster.local:7777

  udr.yaml: |
    db_uri: mongodb://mongodb.nextg-system.svc.cluster.local:27017/nextgcore
    logger:
      file:
        path: /var/log/nextgcore/udr.log
      level: info
    global:
      max:
        ue: 1024
        peer: 64
    udr:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          nrf:
            - uri: https://nrf.nextg-system.svc.cluster.local:7777

  pcf.yaml: |
    db_uri: mongodb://mongodb.nextg-system.svc.cluster.local:27017/nextgcore
    logger:
      file:
        path: /var/log/nextgcore/pcf.log
      level: info
    global:
      max:
        ue: 1024
        peer: 64
    pcf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          nrf:
            - uri: https://nrf.nextg-system.svc.cluster.local:7777
      # Whether the subscribed Session-AMBR the SMF reports (subsSessAmbr) caps
      # the Session-AMBR the PCF authorises, on the SM policy create, the
      # UpdateNotify and the SE_AMBR_CH update alike (#1402). subscribed (the
      # default): per direction min(policy, subscribed). none: the policy value.
      # Any other value fails start-up.
      #   session_ambr_cap: subscribed
      # Whether a policy create is refused (500 SYSTEM_FAILURE) when the NRF does
      # not answer the UDR discovery and no UDR is known: none discovered since
      # start-up, none remembered, and no NRF answer saying none is deployed (#1639).
      # true: refused (fail closed, production). false: the local default policy
      # (fail open, dev/sim/compose). Not a boolean: start-up fails.
      policy:
        udr_required: true

  nssf.yaml: |
    logger:
      file:
        path: /var/log/nextgcore/nssf.log
      level: info
    global:
      max:
        ue: 1024
        peer: 64
    nssf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          nrf:
            - uri: https://nrf.nextg-system.svc.cluster.local:7777
          nsi:
            - uri: https://nrf.nextg-system.svc.cluster.local:7777
              s_nssai:
                sst: 1
        # #94: SBI OAuth2 enforcement now defaults to ENABLED. This dev/E2E
        # deployment has no token issuance wired up, so it opts out EXPLICITLY:
        # requests are not authenticated and NSSAI-availability writes cannot be
        # bound to the owning AMF.
        oauth2:
          require: false

  bsf.yaml: |
    logger:
      file:
        path: /var/log/nextgcore/bsf.log
      level: info
    global:
      max:
        ue: 1024
        peer: 64
    bsf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          nrf:
            - uri: https://nrf.nextg-system.svc.cluster.local:7777

  amf.yaml: |
    logger:
      file:
        path: /var/log/nextgcore/amf.log
      level: info
    global:
      max:
        ue: 1024
        peer: 64
    amf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          nrf:
            - uri: https://nrf.nextg-system.svc.cluster.local:7777
      ngap:
        server:
          - address: 0.0.0.0
            port: 38412
      guami:
        - plmn_id:
            mcc: "999"
            mnc: "70"
          amf_id:
            region: 2
            set: 1
      tai:
        - plmn_id:
            mcc: "999"
            mnc: "70"
          tac: 1
      plmn_support:
        - plmn_id:
            mcc: "999"
            mnc: "70"
          s_nssai:
            - sst: 1
      security:
        integrity_order: [NIA2, NIA1, NIA0]
        ciphering_order: [NEA0, NEA1, NEA2]
      network_name:
        full: NextGCore
        short: Next
      amf_name: nextgcore-amf0
      time:
        t3512:
          value: 540

  smf.yaml: |
    logger:
      file:
        path: /var/log/nextgcore/smf.log
      level: info
    global:
      max:
        ue: 1024
        peer: 64
    smf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          nrf:
            - uri: https://nrf.nextg-system.svc.cluster.local:7777
      pfcp:
        server:
          - address: 0.0.0.0
            port: 8805
        client:
          upf:
            - address: upf.nextg-system.svc.cluster.local
      gtpc:
        server:
          - address: 0.0.0.0
      gtpu:
        server:
          - address: 0.0.0.0
      session:
        - subnet: 10.45.0.0/16
          gateway: 10.45.0.1
        - subnet: 2001:db8:cafe::/48
          gateway: 2001:db8:cafe::1
      dns:
        - 8.8.8.8
        - 8.8.4.4
        - 2001:4860:4860::8888
        - 2001:4860:4860::8844
      mtu: 1400

  upf.yaml: |
    logger:
      file:
        path: /var/log/nextgcore/upf.log
      level: info
    global:
      max:
        ue: 1024
        peer: 64
    upf:
      pfcp:
        server:
          - address: 0.0.0.0
            port: 8805
      gtpu:
        server:
          - address: 0.0.0.0
            port: 2152
      session:
        - subnet: 10.45.0.0/16
          gateway: 10.45.0.1
          dev: ogstun
        - subnet: 2001:db8:cafe::/48
          gateway: 2001:db8:cafe::1
          dev: ogstun