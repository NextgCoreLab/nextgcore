apiVersion: v1
kind: Service
metadata:
  name: udr
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: udr
    app.kubernetes.io/part-of: nextgcore
spec:
  selector:
    app.kubernetes.io/name: udr
  ports:
    - name: sbi
      port: 7777
      targetPort: 7777
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udr
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: udr
    app.kubernetes.io/part-of: nextgcore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: udr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: udr
        app.kubernetes.io/part-of: nextgcore
    spec:
      initContainers:
        # Rewrite sbi.server[0].address from 0.0.0.0 to the pod IP. That single
        # config value is used for BOTH the listen socket and the ipv4Addresses
        # registered with the NRF, so 0.0.0.0 made discovery hand consumers an
        # address they cannot dial. A ConfigMap mount is read-only and the pod
        # IP is unknown until scheduling, so the rewrite lands in an emptyDir.
        - name: rewrite-advertise-addr
          image: busybox:1.36
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NF_NAME
              value: udr
          command:
            - sh
            - -c
            - |
              set -eu
              echo "[advertise] pod IP: $POD_IP"
              case "$POD_IP" in
                *[0-9].[0-9]*) ;;
                *) echo "[advertise] FATAL: POD_IP is not IPv4: '$POD_IP'" >&2; exit 1 ;;
              esac
              cp "/tmp/config-template/${NF_NAME}.yaml" "/etc/nextgcore-resolved/${NF_NAME}.yaml"
              sed -i "s|^\( *- address:\) *0\.0\.0\.0 *$|\1 $POD_IP|" "/etc/nextgcore-resolved/${NF_NAME}.yaml"
              if grep -qE '^ *- address: *0\.0\.0\.0 *$' "/etc/nextgcore-resolved/${NF_NAME}.yaml"; then
                echo "[advertise] FATAL: a 0.0.0.0 advertise address survived" >&2
                exit 1
              fi
              echo "[advertise] ${NF_NAME}.yaml advertise address set to $POD_IP"
          volumeMounts:
            - name: config
              mountPath: /tmp/config-template
              readOnly: true
            - name: config-resolved
              mountPath: /etc/nextgcore-resolved
        - name: wait-nrf
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z nrf.nextg-system.svc.cluster.local 7777; do echo waiting for nrf; sleep 2; done']
        - name: wait-mongodb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongodb.nextg-system.svc.cluster.local 27017; do echo waiting for mongodb; sleep 2; done']
      containers:
        - name: udr
          image: nextgcore-rust/udr:latest
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/nextgcore/udr.yaml"]
          ports:
            - containerPort: 7777
              name: sbi
          env:
            - name: RUST_LOG
              value: info
            - name: RUST_BACKTRACE
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config-resolved
              mountPath: /etc/nextgcore/udr.yaml
              subPath: udr.yaml
              readOnly: true
            - name: logs
              mountPath: /var/log/nextgcore
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: nextgcore-configs
        - name: config-resolved
          emptyDir: {}
        - name: logs
          emptyDir: {}
