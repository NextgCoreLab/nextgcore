apiVersion: v1
kind: Service
metadata:
  name: smf
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: smf
    app.kubernetes.io/part-of: nextgcore
spec:
  selector:
    app.kubernetes.io/name: smf
  ports:
    - name: sbi
      port: 7777
      targetPort: 7777
    - name: pfcp
      port: 8805
      targetPort: 8805
      protocol: UDP
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smf
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: smf
    app.kubernetes.io/part-of: nextgcore
spec:
  replicas: 1
  # #718: never two SMF pods at once. Both signal the same PFCP Node ID (the
  # Service FQDN, #797), and a UPF that receives an Association Setup for a Node
  # ID it already has an association with replaces it, deleting the existing
  # association's sessions unless retention is requested (TS 29.244 §6.2.6.2.2).
  # A RollingUpdate surge pod holds no sessions, so it would delete every session
  # of the pod still serving the UEs. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: smf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smf
        app.kubernetes.io/part-of: nextgcore
    spec:
      # #718: a graceful SMF shutdown releases each UPF association (up to
      # T1 x (N1+1) = 12 s when a UPF is gone), sends every UE #39 and keeps
      # retransmitting its S5/S8 Delete Bearer Requests for up to 12 s.
      terminationGracePeriodSeconds: 45
      initContainers:
        # Rewrite sbi.server[0].address from 0.0.0.0 to the pod IP. That single
        # config value is used for BOTH the listen socket and the ipv4Addresses
        # registered with the NRF, so 0.0.0.0 made discovery hand consumers an
        # address they cannot dial. A ConfigMap mount is read-only and the pod
        # IP is unknown until scheduling, so the rewrite lands in an emptyDir.
        - name: rewrite-advertise-addr
          image: busybox:1.36
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NF_NAME
              value: smf
          command:
            - sh
            - -c
            - |
              set -eu
              echo "[advertise] pod IP: $POD_IP"
              case "$POD_IP" in
                *[0-9].[0-9]*) ;;
                *) echo "[advertise] FATAL: POD_IP is not IPv4: '$POD_IP'" >&2; exit 1 ;;
              esac
              cp "/tmp/config-template/${NF_NAME}.yaml" "/etc/nextgcore-resolved/${NF_NAME}.yaml"
              sed -i "s|^\( *- address:\) *0\.0\.0\.0 *$|\1 $POD_IP|" "/etc/nextgcore-resolved/${NF_NAME}.yaml"
              if grep -qE '^ *- address: *0\.0\.0\.0 *$' "/etc/nextgcore-resolved/${NF_NAME}.yaml"; then
                echo "[advertise] FATAL: a 0.0.0.0 advertise address survived" >&2
                exit 1
              fi
              echo "[advertise] ${NF_NAME}.yaml advertise address set to $POD_IP"
          volumeMounts:
            - name: config
              mountPath: /tmp/config-template
              readOnly: true
            - name: config-resolved
              mountPath: /etc/nextgcore-resolved
        - name: wait-nrf
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z nrf.nextg-system.svc.cluster.local 7777; do echo waiting for nrf; sleep 2; done']
      containers:
        - name: smf
          image: nextgcore-rust/smf:latest
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/nextgcore/smf.yaml"]
          ports:
            - containerPort: 7777
              name: sbi
            - containerPort: 8805
              name: pfcp
              protocol: UDP
            - containerPort: 9090
              name: metrics
          env:
            - name: NEXTGCORE_SBI_PROFILE
              # Issue #63: this NF defaults to the PRODUCTION SBI profile
              # (mutually-authenticated TLS + a required OAuth2 access token) and
              # REFUSES TO START without the certificates it names. These base
              # manifests mount none, so they opt out explicitly. Remove this to
              # run the secure posture once certs are mounted.
              value: "dev"
            - name: RUST_LOG
              value: info
            - name: RUST_BACKTRACE
              value: "1"
            - name: SMF_PFCP_ADDR
              value: "0.0.0.0"
            # #797: the PFCP Node ID identifies this CP function (TS 29.244
            # §5.8.1). The Service FQDN survives a pod restart, so the UPF sees the
            # SAME CP function come back; the 0.0.0.0 bind address identified
            # nothing, and the pod IP changes on every restart.
            - name: SMF_PFCP_NODE_ID
              value: "smf.nextg-system.svc.cluster.local"
            # The CP F-SEID carries this pod's IP: the address the UPF sends
            # Session Report Requests to (TS 29.244 §8.2.37).
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SMF_PFCP_ADVERTISE_ADDR
              value: "$(POD_IP)"
            # A hostname is accepted (#658): the SMF resolves it at startup
            # without failing when the record does not exist yet, and resolves
            # it AGAIN on every Association Setup attempt, so a UPF pod that
            # restarts at a new IP is re-associated with no SMF restart. This
            # replaces the resolve-upf initContainer, which pinned the IP once.
            - name: UPF_PFCP_ADDR
              value: "upf.nextg-system.svc.cluster.local"
            - name: UPF_PFCP_PORT
              value: "8805"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config-resolved
              mountPath: /etc/nextgcore/smf.yaml
              subPath: smf.yaml
              readOnly: true
            - name: logs
              mountPath: /var/log/nextgcore
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: nextgcore-configs
        - name: config-resolved
          emptyDir: {}
        - name: logs
          emptyDir: {}
