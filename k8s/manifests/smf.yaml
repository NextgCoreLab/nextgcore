apiVersion: v1
kind: Service
metadata:
  name: smf
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: smf
    app.kubernetes.io/part-of: nextgcore
spec:
  selector:
    app.kubernetes.io/name: smf
  ports:
    - name: sbi
      port: 7777
      targetPort: 7777
    - name: pfcp
      port: 8805
      targetPort: 8805
      protocol: UDP
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smf
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: smf
    app.kubernetes.io/part-of: nextgcore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smf
        app.kubernetes.io/part-of: nextgcore
    spec:
      initContainers:
        # Rewrite sbi.server[0].address from 0.0.0.0 to the pod IP. That single
        # config value is used for BOTH the listen socket and the ipv4Addresses
        # registered with the NRF, so 0.0.0.0 made discovery hand consumers an
        # address they cannot dial. A ConfigMap mount is read-only and the pod
        # IP is unknown until scheduling, so the rewrite lands in an emptyDir.
        - name: rewrite-advertise-addr
          image: busybox:1.36
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NF_NAME
              value: smf
          command:
            - sh
            - -c
            - |
              set -eu
              echo "[advertise] pod IP: $POD_IP"
              case "$POD_IP" in
                *[0-9].[0-9]*) ;;
                *) echo "[advertise] FATAL: POD_IP is not IPv4: '$POD_IP'" >&2; exit 1 ;;
              esac
              cp "/tmp/config-template/${NF_NAME}.yaml" "/etc/nextgcore-resolved/${NF_NAME}.yaml"
              sed -i "s|^\( *- address:\) *0\.0\.0\.0 *$|\1 $POD_IP|" "/etc/nextgcore-resolved/${NF_NAME}.yaml"
              if grep -qE '^ *- address: *0\.0\.0\.0 *$' "/etc/nextgcore-resolved/${NF_NAME}.yaml"; then
                echo "[advertise] FATAL: a 0.0.0.0 advertise address survived" >&2
                exit 1
              fi
              echo "[advertise] ${NF_NAME}.yaml advertise address set to $POD_IP"
          volumeMounts:
            - name: config
              mountPath: /tmp/config-template
              readOnly: true
            - name: config-resolved
              mountPath: /etc/nextgcore-resolved
        - name: wait-nrf
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z nrf.nextg-system.svc.cluster.local 7777; do echo waiting for nrf; sleep 2; done']
        # UPF_PFCP_ADDR is parsed as a SocketAddr
        # (nextgcore-smfd/src/main.rs:443), so a Service DNS name does not
        # deserialize and the SMF exits with "Invalid UPF PFCP address". PFCP
        # peers are fixed at startup, so the name has to be resolved to a
        # literal IP before the process runs.
        - name: resolve-upf
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              echo "[resolve-upf] resolving UPF PFCP address..."
              i=0
              while [ "$i" -lt 60 ]; do
                # busybox has no getent, so nslookup is the only resolver here.
                # Anchoring on ^Name: first and only then taking the following
                # Address: skips the "Server:/Address: <dns-ip>:53" preamble --
                # a plain `grep Address` returns the DNS server's own IP.
                IP=$(nslookup upf.nextg-system.svc.cluster.local 2>/dev/null \
                     | awk '/^Name:/{n=1;next} n&&/^Address( 1)?:/{print $NF; exit}')
                case "$IP" in
                  *.*.*.*) break ;;
                esac
                i=$((i+1))
                echo "[resolve-upf] waiting for UPF DNS ($i/60)"
                sleep 2
              done
              case "$IP" in
                *[0-9].[0-9]*) ;;
                *) echo "[resolve-upf] FATAL: could not resolve UPF to an IPv4 address" >&2; exit 1 ;;
              esac
              echo "[resolve-upf] UPF=$IP"
              printf '%s' "$IP" > /shared/upf-ip
          volumeMounts:
            - name: resolved
              mountPath: /shared
      containers:
        - name: smf
          image: nextgcore-rust/smf:latest
          imagePullPolicy: IfNotPresent
          # UPF_PFCP_ADDR is overridden from the resolved file before exec.
          # `exec` matters: the SMF must stay PID 1 so it receives SIGTERM
          # directly and the container's exit status is the SMF's.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              UPF_PFCP_ADDR="$(cat /shared/upf-ip)"
              export UPF_PFCP_ADDR
              echo "[smf] UPF_PFCP_ADDR=${UPF_PFCP_ADDR}"
              exec /usr/local/bin/nf-binary -c /etc/nextgcore/smf.yaml
          ports:
            - containerPort: 7777
              name: sbi
            - containerPort: 8805
              name: pfcp
              protocol: UDP
            - containerPort: 9090
              name: metrics
          env:
            - name: RUST_LOG
              value: info
            - name: RUST_BACKTRACE
              value: "1"
            - name: SMF_PFCP_ADDR
              value: "0.0.0.0"
            # Overridden at start from /shared/upf-ip (see args above). Kept
            # here as documentation of the expected shape; the literal value is
            # unusable because it is a DNS name, not an IP.
            - name: UPF_PFCP_ADDR
              value: "upf.nextg-system.svc.cluster.local"
            - name: UPF_PFCP_PORT
              value: "8805"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config-resolved
              mountPath: /etc/nextgcore/smf.yaml
              subPath: smf.yaml
              readOnly: true
            - name: logs
              mountPath: /var/log/nextgcore
            - name: resolved
              mountPath: /shared
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: nextgcore-configs
        - name: config-resolved
          emptyDir: {}
        - name: logs
          emptyDir: {}
        # Carries the resolved UPF IP from the resolve-upf initContainer to the
        # SMF container.
        - name: resolved
          emptyDir: {}
