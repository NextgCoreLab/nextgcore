apiVersion: v1
kind: Service
metadata:
  name: amf
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: amf
    app.kubernetes.io/part-of: nextgcore
spec:
  selector:
    app.kubernetes.io/name: amf
  ports:
    - name: ngap
      port: 38412
      targetPort: 38412
      protocol: UDP
    - name: sbi
      port: 7777
      targetPort: 7777
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amf
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: amf
    app.kubernetes.io/part-of: nextgcore
spec:
  replicas: 1
  # #753: one pinned nfInstanceId, so one pod and no overlapping rollout. The old
  # pod's NFDeregister would remove the new pod's NRF profile.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: amf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amf
        app.kubernetes.io/part-of: nextgcore
    spec:
      # #1617: the nf-tls files are group fsGroup, mode 0440, and every container
      # of the pod runs with fsGroup as a supplementary group, so the NF reads
      # its key as the image's non-root user (any gid works; 999 is the image's).
      securityContext:
        fsGroup: 999
      initContainers:
        - name: wait-nrf
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w 2 nrf.nextg-system.svc.cluster.local 7777; do echo waiting for nrf; sleep 2; done']
        - name: wait-ausf
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w 2 ausf.nextg-system.svc.cluster.local 7777; do echo waiting for ausf; sleep 2; done']
        - name: wait-udm
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w 2 udm.nextg-system.svc.cluster.local 7777; do echo waiting for udm; sleep 2; done']
      containers:
        - name: amf
          image: nextgcore-rust/amf:latest
          imagePullPolicy: IfNotPresent
          # --ngap-addr overrides amf.ngap.server (#1311; loopback with neither,
          # #1308): every pod
          # interface, so the gNB reaches it through the Service.
          args: ["-c", "/etc/nextgcore/amf.yaml", "--ngap-addr", "0.0.0.0:38412"]
          ports:
            - containerPort: 38412
              name: ngap
              protocol: UDP
            - containerPort: 7777
              name: sbi
            - containerPort: 9090
              name: metrics
          env:
            # #1617: NF -> NRF over TLS with this pod's own certificate (Secret
            # nf-tls-amf, issued at deploy time by k8s/nf-tls-secrets.sh). The NRF URI
            # dials the cluster FQDN; nrf.crt names DNS:nrf, so that is the name checked.
            - name: NEXTGCORE_NRF_TLS_CA
              value: /etc/nextgcore/certs/ca.crt
            - name: NEXTGCORE_NRF_TLS_CLIENT_CERT
              value: /etc/nextgcore/certs/amf.crt
            - name: NEXTGCORE_NRF_TLS_CLIENT_KEY
              value: /etc/nextgcore/certs/amf.key
            - name: NEXTGCORE_NRF_TLS_SERVER_NAME
              value: nrf
            - name: NEXTGCORE_SBI_PROFILE
              # Issue #63: this NF defaults to the PRODUCTION SBI profile
              # (mutually-authenticated TLS + a required OAuth2 access token) and
              # REFUSES TO START without the certificates it names. These base
              # manifests mount none, so they opt out explicitly. Remove this to
              # run the secure posture once certs are mounted.
              value: "dev"
            - name: RUST_LOG
              value: info
            - name: NEXTGCORE_SBI_ADVERTISE
              # #1312, #1322: the host registered with the NRF and put in every
              # callback URI, set apart from the bind so a wildcard bind can
              # never be advertised. The pod IP.
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # #753: a stable nfInstanceId for the UDM and the NRF. Unpinned, each
            # restart was a "new AMF", and the UDM's UE_INITIAL_REGISTRATION
            # dereg-notify tore down re-registering UEs.
            - name: NEXTGCORE_AMF_INSTANCE_ID
              value: "6b1d7e3c-0000-4000-8000-000000000af0"
            - name: RUST_BACKTRACE
              value: "1"
            # /metrics (port 9090, #1334) defaults to 127.0.0.1 (#837); in the pod
            # it must accept the pod IP for Prometheus. Reached through the
            # ClusterIP/headless Service only, never published beyond the cluster.
            - name: NEXTGCORE_METRICS_BIND
              value: "0.0.0.0"
            # The pod IP, NOT 0.0.0.0. The AMF uses its SBI address for BOTH the
            # listen socket and the ipv4Addresses it registers with the NRF. This
            # env var overrides amf.sbi.server[0].address in its YAML (#1311), so
            # it is the one place the pod IP has to be set.
            # With 0.0.0.0 the AMF advertised an unusable endpoint and, when it
            # resolved its own peers through discovery, dialled 0.0.0.0:7777 --
            # itself -- getting 404 from its own SBI router and failing every
            # registration. Binding to the pod IP is correct inside a pod.
            - name: AMF_SBI_ADDR
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SMF_SBI_ADDR
              value: "smf.nextg-system.svc.cluster.local"
            - name: SMF_SBI_PORT
              value: "7777"
            - name: AUSF_SBI_ADDR
              value: "ausf.nextg-system.svc.cluster.local"
            - name: AUSF_SBI_PORT
              value: "7777"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            # Its own Secret only (#1617).
            - name: nf-tls
              mountPath: /etc/nextgcore/certs
              readOnly: true
            - name: config
              mountPath: /etc/nextgcore/amf.yaml
              subPath: amf.yaml
              readOnly: true
            - name: logs
              mountPath: /var/log/nextgcore
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        # #1617: this pod's certificate and key and the CA certificate, mode 0440
        # to the pod's fsGroup. Never the CA key: it does not leave the deploy host.
        - name: nf-tls
          secret:
            secretName: nf-tls-amf
            defaultMode: 0440
        - name: config
          configMap:
            name: nextgcore-configs
        - name: logs
          emptyDir: {}
