# Kind cluster configuration for NextG 5G/6G deployment
# Usage: kind create cluster --config kind-config.yaml --name nextg
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # No extraPortMappings (#1365): every Service is ClusterIP, so there is no
    # node port to map. Reach the NRF and the monitoring UIs from the host with
    # `kubectl port-forward`, which binds 127.0.0.1 (deploy.sh prints the list).
