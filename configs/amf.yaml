# NextGCore AMF Configuration
# PLMN 999-70, TAC 1, S-NSSAI SST=1

amf:
  amf_name: "NextGCore AMF"

  guami:
    - plmn_id:
        mcc: "999"
        mnc: "70"
      amf_id:
        region: 1
        set: 1
        pointer: 1

  tai:
    - plmn_id:
        mcc: "999"
        mnc: "70"
      tac: 1

  plmn_support:
    - plmn_id:
        mcc: "999"
        mnc: "70"
      s_nssai:
        - sst: 1

  security:
    integrity_order: ["NIA2", "NIA1", "NIA0"]
    ciphering_order: ["NEA2", "NEA1", "NEA0"]

  # Paging strategy (#1442; TS 23.501 §5.4.3.1 makes it local policy).
  # `registration-area` (the default) pages every gNB serving the UE's
  # registration area on every attempt. `recommended-first` stores the RAN's
  # Recommended RAN Nodes for Paging from UE CONTEXT RELEASE COMPLETE (TS 38.413
  # §8.3.3.2) and pages those gNBs first, then the whole area on every T3513
  # retransmission. `nwdaf-mobility` (nextgsim#464, TS 23.501 §5.4.3.1) asks the
  # NWDAF for the UE's UE_MOBILITY prediction when paging starts (first PAGING
  # held at most 300 ms, at most 64 queries in flight; NWDAF from the NRF, else
  # NWDAF_SBI_ADDR/PORT) and pages the predicted cell's gNB plus the UE's last
  # known cell's gNB first, then the whole area. Any failure pages the area at
  # once. The NWDAF must serve UE Mobility (nwdafd --features amf-mobility,
  # nwdaf.amf_mobility.enabled: true), or every page falls back after <= 300 ms.
  # Both staged strategies also send Paging Attempt Information (count, intended
  # attempts, next paging area scope; TS 38.413 §9.3.1.72) in every PAGING.
  # See docs-book/src/configuration/amf.md "Paging strategy".
  # paging:
  #   strategy: registration-area

  # Emergency services (#361, TS 33.501 §10.2.2 / §5.1.2).
  #
  # REGULATORY setting, not a tuning knob. `true` (the default, shown explicitly
  # here so it is a visible decision rather than an omission) lets an EMERGENCY
  # registration proceed when the AUSF cannot be reached: NIA0/NEA0 forced, no UDM
  # update, no Allowed NSSAI, emergency DNN only. That is legally REQUIRED in some
  # jurisdictions (e.g. US FCC E911) and FORBIDDEN in others -- TS 33.501 §5.1.2:
  # "Serving networks located in regions where unauthenticated emergency services
  # are forbidden shall not support this feature." Set false where that applies.
  #
  # See docs-book/src/configuration/amf.md "Unauthenticated emergency service".
  emergency:
    allow_unauthenticated: true
