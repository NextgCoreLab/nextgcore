[book]
title = "NextGCore Documentation"
authors = ["NextGCore Lab"]
language = "en"
src = "src"

[build]
build-dir = "../docs/book"
# #2185: a SUMMARY.md entry whose file is missing fails the build rather than
# shipping an empty page (mdBook's default creates the file).
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/NextgCoreLab/nextgcore"
site-url = "/nextgcore/book/"
