# OAuth2 enforcement overlay (NRF auth stage 4b validation)
#
# Swaps each NF's config for an OAuth2 variant. The UDR/NSSF/NSACF/BSF servers
# then reject SBI requests without a valid NRF-issued bearer token (401), and
# answer 503 while the NRF's JWKS is unreachable; their outbound SBI calls also
# acquire and attach a token. The NRF variant enables the CLIENT side only
# (the NRF is the Authorization Server, so its own token/jwks endpoints stay
# open — see nrf-oauth2.yaml).
#
#   docker compose -f docker-compose.yml -f docker-compose.oauth2.yml up -d
#
# Keep this an overlay: enabling enforcement in the default deployment can
# break consumers that do not yet attach OAuth2 tokens, so it is opt-in.

services:
  nrf:
    volumes:
      - ./configs/5gc/nrf-oauth2.yaml:/etc/nextgcore/nrf.yaml:ro
      - ./certs:/etc/nextgcore/certs:ro
  udr:
    volumes:
      - ./configs/5gc/udr-oauth2.yaml:/etc/nextgcore/udr.yaml:ro
      - ./certs:/etc/nextgcore/certs:ro
  nssf:
    volumes:
      - ./configs/5gc/nssf-oauth2.yaml:/etc/nextgcore/nssf.yaml:ro
      - ./certs:/etc/nextgcore/certs:ro
  nsacf:
    volumes:
      - ./configs/5gc/nsacf-oauth2.yaml:/etc/nextgcore/nsacf.yaml:ro
      - ./certs:/etc/nextgcore/certs:ro
  bsf:
    volumes:
      - ./configs/5gc/bsf-oauth2.yaml:/etc/nextgcore/bsf.yaml:ro
      - ./certs:/etc/nextgcore/certs:ro
