# NWDAF (Network Data Analytics Function) Configuration
logger:
  level: info

nwdaf:
  sbi:
    server:
      - address: 0.0.0.0
        advertise: 172.23.0.30
        port: 7777
    # NRF NFProfile (#1412): the NF types the NRF lets discover this NWDAF and
    # get an nnwdaf-* access token. Omit it for the union of the TS 29.520
    # consumer lists (#1415): PCF, NSSF, AMF, SMF, NEF, AF, CEF, LMF, NWDAF,
    # DCCF, ADRF, UDM, NRF, SCP, UPF. Each service still registers its own
    # clause's list (AnalyticsInfo §4.3.1.3.2 has no CEF/UPF; MLModelProvision
    # §4.5.1.3.2 is NWDAF, LMF), and the NRF requires both levels to allow a
    # consumer, so this list can only narrow access: it cannot admit a type a
    # service's clause does not list. A present list must be non-empty NFType
    # tokens, or startup fails.
    # nrf_profile:
    #   allowed_nf_types: [PCF, NSSF, AMF, SMF, NEF, AF, CEF, LMF, NWDAF, DCCF, ADRF, UDM, NRF, SCP, UPF]
  nrf:
    uri: http://172.23.0.10:7777
  analytics:
    ml_model_dir: /var/lib/nextgcore/models
