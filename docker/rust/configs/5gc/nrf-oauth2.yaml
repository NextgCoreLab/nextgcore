# NRF (Network Repository Function) Configuration — OAuth2 variant
# Same as nrf.yaml but with the SBI OAuth2 knob enabled.
# Used via docker-compose.oauth2.yml:
#   docker compose -f docker-compose.yml -f docker-compose.oauth2.yml up -d
#
# IMPORTANT (TS 33.501 / TS 29.510): the NRF is itself the OAuth2
# Authorization Server. Its /nnrf-oauth2/v1/access-token and
# /nnrf-oauth2/v1/jwks endpoints MUST stay reachable WITHOUT a bearer token
# (no NF can obtain a token before calling the token endpoint). The SBI server
# middleware has no per-path exemption, so the NRF never blanket-enables
# require_oauth2 on its own server. This knob therefore drives the CLIENT side
# only: the NRF acquires and attaches NRF-issued tokens on its own outbound
# calls (NF status notifications to consumers). The default nrf.yaml leaves it
# off so the dev/E2E data-plane path keeps working.

logger:
  file:
    path: /var/log/nextgcore/nrf.log
  level: info

global:
  max:
    ue: 1024
    peer: 64

nrf:
  serving:
    - plmn_id:
        mcc: 999
        mnc: 70
  sbi:
    server:
      - address: 0.0.0.0
        advertise: 172.23.0.10
        port: 7777
        tls:
          enabled: false
          cert: /etc/nextgcore/certs/nrf.crt
          key: /etc/nextgcore/certs/nrf.key
          ca: /etc/nextgcore/certs/ca.crt
          min_version: "1.2"
    oauth2:
      require: true
      # ---------------------------------------------------------------------
      # Token-endpoint client authentication (TS 33.501 §13.3.1) is REQUIRED
      # here — by leaving `require_client_auth` unset, so this file inherits the
      # secure default rather than restating it. The NRF logs
      # "token-endpoint client authentication required" at startup; if you ever
      # see the DISABLED warn! instead, something set the escape hatch.
      #
      # Issue #187: the escape hatch (`require_client_auth: false`) that used to
      # live here is GONE. It was needed because no NF could pin its
      # nfInstanceId, so the trust store below — keyed by nfInstanceId — had
      # nothing stable to key on. Both halves are now provisioned by the
      # overlay, entirely from environment variables:
      #
      #   NEXTGCORE_<TYPE>_INSTANCE_ID       pins the NF's nfInstanceId
      #   NEXTGCORE_SBI_CCA_SIGNING_KEY_FILE where it keeps its ES256 CCA key
      #                                      (generated 0600 on first start,
      #                                      reused thereafter, never silently
      #                                      replaced)
      #   NEXTGCORE_SBI_CCA_PUBLIC_JWK_DIR   where it publishes the PUBLIC half
      #                                      as <nfInstanceId>.jwk
      #
      # See docker-compose.oauth2.yml for the values.
      #
      # The NRF trusts that directory. No private key is committed anywhere, and
      # nothing has to template this YAML: each NF writes its own public key and
      # the NRF reads whatever is there. Because the NRF boots BEFORE every NF
      # that publishes into it, a key that appears after startup is picked up on
      # first use — still fail-closed, so an NF with no published key is refused
      # `invalid_client` (TS 33.501 §13.3.8.3).
      #
      # `cca_trusted_keys` (the inline RFC 7517 JWK list) still works and takes
      # lower precedence; use it for keys you manage out of band.
      cca_trusted_keys_dir: /etc/nextgcore/cca-public
