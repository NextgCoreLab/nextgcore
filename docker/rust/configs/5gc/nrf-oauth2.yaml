# NRF (Network Repository Function) Configuration — OAuth2 variant
# Same as nrf.yaml but with the SBI OAuth2 knob enabled.
# Used via docker-compose.oauth2.yml:
#   docker compose -f docker-compose.yml -f docker-compose.oauth2.yml up -d
#
# IMPORTANT (TS 33.501 / TS 29.510): the NRF is itself the OAuth2
# Authorization Server. Its /nnrf-oauth2/v1/access-token and
# /nnrf-oauth2/v1/jwks endpoints MUST stay reachable WITHOUT a bearer token
# (no NF can obtain a token before calling the token endpoint). The SBI server
# middleware has no per-path exemption, so the NRF never blanket-enables
# require_oauth2 on its own server. This knob therefore drives the CLIENT side
# only: the NRF acquires and attaches NRF-issued tokens on its own outbound
# calls (NF status notifications to consumers). The default nrf.yaml leaves it
# off so the dev/E2E data-plane path keeps working.

logger:
  file:
    path: /var/log/nextgcore/nrf.log
  level: info

global:
  max:
    ue: 1024
    peer: 64

nrf:
  serving:
    - plmn_id:
        mcc: 999
        mnc: 70
  sbi:
    server:
      - address: 0.0.0.0
        advertise: 172.23.0.10
        port: 7777
        tls:
          enabled: false
          cert: /etc/nextgcore/certs/nrf.crt
          key: /etc/nextgcore/certs/nrf.key
          ca: /etc/nextgcore/certs/ca.crt
          min_version: "1.2"
    oauth2:
      require: true
      # ---------------------------------------------------------------------
      # ESCAPE HATCH (issue #64 gap 1). Client authentication at the token
      # endpoint now defaults ON: the NRF requires a CCA signed with a key it
      # trusts for the requesting nfInstanceId, or an mTLS client identity.
      #
      # This overlay cannot satisfy that yet, and the reason is concrete: the
      # NRF verifies a CCA against `cca_trusted_keys`, which is keyed by
      # nfInstanceId — but no NF in docker-compose.yml pins its instance ID, so
      # every NF generates a fresh UUID on each start and there is no stable key
      # to pre-register. Provisioning it needs (a) pinned nfInstanceIds per NF,
      # (b) a generated ES256 key per NF mounted at
      # NEXTGCORE_SBI_CCA_SIGNING_KEY_FILE, and (c) the matching public JWKs
      # listed under cca_trusted_keys here.
      #
      # Until then this overlay explicitly opts out, so the insecure posture is
      # asked for by name and announced with a startup warn! rather than being a
      # silent default. DO NOT copy this line into a production config.
      require_client_auth: false
