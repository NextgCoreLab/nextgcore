# NRF (Network Repository Function) Configuration
# Docker container configuration for 5G Core deployment

logger:
  file:
    path: /var/log/nextgcore/nrf.log
  level: info

global:
  max:
    ue: 1024
    peer: 64

nrf:
  serving:
    - plmn_id:
        mcc: 999
        mnc: 70
  sbi:
    server:
      - address: 0.0.0.0
        advertise: 172.23.0.10
        port: 7777
        # TLS on the NRF's one SBI listener (#1617): read by nrfd. With it on,
        # the NRF requests a client certificate (optional; a presented one must
        # chain to `ca`). NEXTGCORE_NRF_SERVER_TLS=true also turns it on.
        # Generate certs first: docker/rust/certs/generate-dev-certs.sh
        tls:
          enabled: false
          cert: /etc/nextgcore/certs/nrf.crt
          key: /etc/nextgcore/certs/nrf.key
          ca: /etc/nextgcore/certs/ca.crt
          # Minimum TLS version per 3GPP TS 33.501 §13.2
          min_version: "1.2"
