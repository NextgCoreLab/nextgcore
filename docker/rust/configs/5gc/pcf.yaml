# PCF (Policy Control Function) Configuration
# Docker container configuration for 5G Core deployment

db_uri: mongodb://172.23.0.2/nextgcore

logger:
  file:
    path: /var/log/nextgcore/pcf.log
  level: info

global:
  max:
    ue: 1024
    peer: 64

pcf:
  sbi:
    server:
      - address: 172.23.0.13
        port: 7777
    client:
      nrf:
        - uri: https://172.23.0.10:7777
  # Whether the subscribed Session-AMBR the SMF reports (subsSessAmbr) caps
  # the Session-AMBR the PCF authorises, on the SM policy create, the
  # UpdateNotify and the SE_AMBR_CH update alike (#1402). subscribed (the
  # default): per direction min(policy, subscribed). none: the policy value.
  # Any other value fails start-up.
  #   session_ambr_cap: subscribed
  # Whether a policy create is refused (500 SYSTEM_FAILURE) when the NRF does
  # not answer the UDR discovery and no UDR is known: none discovered since
  # start-up, none remembered, and no NRF answer saying none is deployed (#1639).
  # true: refused (fail closed, production). false: the local default policy
  # (fail open, dev/sim/compose). Not a boolean: start-up fails.
  policy:
    udr_required: false
  # TLS configuration (G36: SBI TLS)
  # Enable: TLS_ENABLED=true SBI_SCHEME=https docker compose up -d
  tls:
    enabled: false
    cert: /etc/nextgcore/certs/pcf.crt
    key: /etc/nextgcore/certs/pcf.key
    ca: /etc/nextgcore/certs/ca.crt
    min_version: "1.2"
  # Issue #24: intent-driven closed-loop policy spike (non-normative 6G
  # research). Declares ONE outcome — keep slice (sst/sd) latency below
  # max_latency_ms — for the PCF→NWDAF monitor→decide→act controller.
  # Requires a pcfd built with `--features intent-loop`; with the block
  # absent or enabled: false the controller never starts, and without the
  # feature the block is ignored. See docs/intent-driven-policy-loop.md.
  intent:
    enabled: false
    sst: 1
    sd: "000001"
    max_latency_ms: 20.0
    poll_interval_secs: 30
    aggressiveness: 0.5
    # Synthetic NF_LOAD -> latency proxy slope (ms per load percent):
    # today's nwdafd serves real data only for NF_LOAD.
    nf_load_latency_ms_per_pct: 0.5
