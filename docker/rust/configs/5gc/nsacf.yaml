# NSACF (Network Slice Admission Control Function) Configuration
logger:
  level: info

nsacf:
  sbi:
    server:
      - address: 172.23.0.34
        port: 7777
  nrf:
    uri: http://172.23.0.10:7777
  slice_quotas:
    - sst: 1
      max_ues: 1000
      max_pdu_sessions: 2000
    - sst: 2
      max_ues: 500
      max_pdu_sessions: 1000
    - sst: 3
      max_ues: 2000
      max_pdu_sessions: 4000
  # Issue #27: observe-only slice-SLA assurance (non-normative; requires a
  # build with --features sla-observe). Evaluates per-slice admission
  # utilization against the thresholds and emits breach gauges + log
  # transitions. Off by default; metrics_port 0/absent binds NO listener.
  # See docs/slice-sla-observe.md.
  sla:
    enabled: false
    poll_interval_secs: 30
    metrics_port: 0
    slices:
      - sst: 1
        max_ue_utilization_pct: 80.0
        max_pdu_utilization_pct: 80.0
