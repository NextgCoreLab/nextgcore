# UDM (Unified Data Management) Configuration
# Docker container configuration for 5G Core deployment

logger:
  file:
    path: /var/log/nextgcore/udm.log
  level: info

global:
  max:
    ue: 1024
    peer: 64

udm:
  hnet:
    - id: 1
      scheme: 1
      key: /etc/nextgcore/hnet/curve25519-1.key
    - id: 2
      scheme: 2
      key: /etc/nextgcore/hnet/secp256r1-2.key
  sbi:
    server:
      - address: 172.23.0.12
        port: 7777
    client:
      nrf:
        - uri: http://172.23.0.10:7777
    # NRF NFProfile knobs (TS 29.510 6.1.6.2.2). Both were hardcoded in the
    # profile builder before nextgcore #85: the heartbeat is a deployment-timing
    # decision and allowed_nf_types is access control, so an operator adding an
    # NF type that must reach the UDM had to edit Rust. The values below are the
    # historical defaults; omit the block entirely to keep them.
    nrf_profile:
      heartbeat_timer: 10
      allowed_nf_types: [AMF, SMF, AUSF, PCF, SCP]
    # TLS configuration (G36: SBI TLS)
    # Enable: TLS_ENABLED=true SBI_SCHEME=https docker compose up -d
    tls:
      enabled: false
      cert: /etc/nextgcore/certs/udm.crt
      key: /etc/nextgcore/certs/udm.key
      ca: /etc/nextgcore/certs/ca.crt
      min_version: "1.2"
