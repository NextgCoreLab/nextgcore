# NextGCore SGW-U Configuration for Docker EPC Deployment
# Rust implementation

logger:
  file:
    path: /var/log/nextgcore/sgwu.log
  level: info

global:
  max:
    ue: 1024
    peer: 64

sgwu:
  pfcp:
    server:
      - address: 172.24.0.6
    # The SGW-Cs allowed to set up an Sxa association: IPs, CIDR prefixes or host
    # names (#968). FAIL CLOSED: unset refuses every association.
    # SGWU_PFCP_ALLOWED_PEERS (comma-separated) overrides this list.
    allowed_peers:
      - 172.24.0.3
  gtpu:
    server:
      - address: 172.24.0.6
