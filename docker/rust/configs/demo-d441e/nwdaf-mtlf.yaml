# nwdafd as the MTLF of demo d441e-model-retrain (nextgsim#468): trains and
# serves the NF_LOAD model, takes MLModelMonitor registrations, and in mode
# `retrain` refits on an accuracy drop. The check (check.sh) copies this file
# and sets demo.d441e-model-retrain.mode, or removes/disables the block, per arm.
logger:
  level: info

nwdaf:
  role: mtlf
  sbi:
    server:
      - address: 0.0.0.0
        advertise: nwdaf-mtlf
        port: 7777
  # The seeded series both NWDAFs judge and retrain on (model_refit.rs): the
  # defaults, written out. Every 600 s cycle of unix time: calm for 120 s,
  # then alternating for 480 s. check.sh starts the NWDAFs 25-60 s into a
  # cycle, so the first accuracy reports are on the calm part.
  retrain_series:
    enabled: true
    seed: 468
    step_secs: 1
    cycle_steps: 600
    change_at_step: 120

demo:
  enabled: true
  d441e-model-retrain:
    enabled: true
    mode: retrain
