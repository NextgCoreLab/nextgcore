# NextGCore SCP (Service Communication Proxy) Configuration
# For Docker deployment with Rust implementation

logger:
  file:
    path: /var/log/nextgcore/scp.log
  level: info

global:
  max:
    ue: 1024
    peer: 64

scp:
  sbi:
    server:
      - address: 172.22.0.50
        port: 7777
    client:
      nrf:
        - uri: http://172.22.0.10:7777
    # TLS configuration (G36: SBI TLS)
    tls:
      enabled: false
      cert: /etc/nextgcore/certs/scp.crt
      key: /etc/nextgcore/certs/scp.key
      ca: /etc/nextgcore/certs/ca.crt
      min_version: "1.2"

  # Optional SCP-level settings (scpd-#102). Left commented so this file keeps
  # its current behaviour; uncomment to override the built-in defaults.
  # Precedence for each is CLI flag > env var > this file > built-in default.
  #
  # SCP identity for Via / Server headers and SCP-<fqdn> loop detection
  # (TS 29.500 §6.10.10). Set a UNIQUE value in a multi-SCP deployment.
  # fqdn: scp1.5gc.example.org
  #
  # The SCP's own nfInstanceId, used when acquiring delegated OAuth2 tokens.
  # nf_instance_id: 00000000-0000-0000-0000-000000000000
  #
  # Upstream timeouts, in whole seconds (defaults 2 / 10).
  # connect_timeout: 2
  # request_timeout: 10
  #
  # Proxy cache bounds (defaults 4096 entries / 3600s TTL). Bound the
  # peer-influenced binding / discovery / client caches (TS 33.522 §4.2.3.3).
  # max_cache_entries: 4096
  # cache_ttl: 3600
  #
  # How many discovered producers ONE Model D request may be forwarded to before
  # the SCP gives up (default 3: the selected producer plus two alternates), per
  # TS 29.500 §6.10.8.2 alternate-producer reselection. Only reached when a
  # forward provably never left the SCP (connection refused / TLS failure, or the
  # producer's circuit breaker is open) -- never for a producer that answered, and
  # never after a timeout, which could have been delivered already. Set to 1 to
  # disable reselection entirely.
  # max_producer_attempts: 3
