# The NRF of the D443A compose stack (nextgsim#471): configs/5gc/nrf.yaml plus
# the CCA trusted-key directory the EAS sidecars and the UE's EEC publish their public JWKs into (the
# d443a_cca volume), so they get NRF tokens as nfType AF consumers. The NRF
# re-reads the directory on an unknown issuer (#187).
logger:
  file:
    path: /var/log/nextgcore/nrf.log
  level: info
global:
  max:
    ue: 1024
    peer: 64
nrf:
  serving:
    - plmn_id:
        mcc: 999
        mnc: 70
  sbi:
    server:
      - address: 0.0.0.0
        advertise: 172.23.0.10
        port: 7777
        # TLS on the NRF's one SBI listener (#1617), read by nrfd. The NRF asks
        # every client for a certificate (client_auth: optional): a presented
        # one must chain to `ca`, and its urn:uuid URI SAN and RFC 9310 NFTypes
        # are the registrant identity NFRegister / NFUpdate / NFDeregister bind
        # to (TS 33.310 §6.1.3c.3, TS 33.501 §13.1.0); a client without one
        # still completes the handshake. The files are this NRF's volume
        # tls-nrf, issued by the compose sbi-tls service from
        # docker/rust/certs/nf-identities.txt.
        tls:
          enabled: true
          cert: /etc/nextgcore/certs/nrf.crt
          key: /etc/nextgcore/certs/nrf.key
          ca: /etc/nextgcore/certs/ca.crt
          client_auth: optional
          # Minimum TLS version per 3GPP TS 33.501 §13.2
          min_version: "1.2"
    oauth2:
      cca_trusted_keys_dir: /etc/nextgcore/cca-trusted
