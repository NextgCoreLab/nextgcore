# NOT YET RUN: this file has not been brought up end to end (the validation
# host has no docker compose); EKS (deploy/eks/overlays/demo-d443a-edge-budget)
# is the only validated path. A manual run capturing the success signal is the
# gate before anything claims compose support.
#
# D443A compose stack (nextgsim#471): eesd picks the edge server on a
# UPF-measured communication + compute budget. The 5GC (smfd with N6 delay
# measurement and QOS_MON, upfd with UN6DM and QFQM), eesd, three EAS sidecars
# (nr-she-eas: EDGE-3 registration, STAMP Session-Reflector, job listener) on
# their own data network dn, one gNB with QMP, one UE with the EEC client.
#
# STANDALONE, NOT AN OVERLAY (the docker-compose.demo-n2ho.yml rule): the base
# file publishes host ports, and compose merges `ports:` lists. This file
# publishes nothing, and both networks are `internal` (no route off the host).
# It shares the base stack's 172.23.0.0/24, so the two cannot run at once.
#
#   network  subnet          who
#   core     172.23.0.0/24   the 5GC, eesd .31, gNB .100, UE .101
#   dn       10.60.0.0/24    the UPF's N6 leg .2, eas-local .11, eas-regional .12, eas-cloud .13
#
# The UE's EEC and job sockets ride its PDU session (uesimtun0) to the UPF. Jobs
# go onto dn WITHOUT source NAT (UPF_NAT_EXCLUDE=10.60.0.0/24), so EAS-EXEC logs
# the UE's 10.45.0.0/16 address; the EASes route 10.45.0.0/16 back through the
# UPF. The EEC's calls to eesd and the NRF are NATed by the UPF onto core.
# smfd provisions N6 delay measurement toward 10.60.0.11-13:8620 (STAMP), and
# eesd subscribes to QOS_MON at smfd; the notify carries no token (TS 33.501
# §13.4.1) and is admitted on its path token (#1525).
#
# STAND-IN, labelled: eesd's entrypoint registers a profile with the custom
# nfType "EES" at the NRF (the EES is not an NRF NF type, TS 29.510; the NRF
# grants eees-* scopes only with such a producer, #1391).
#
# The acts (netem needs NET_ADMIN in these containers, and sch_netem on the host):
#   Act 2  docker compose -f docker-compose.demo-d443a.yml exec eas-local tc qdisc change dev eth0 root netem delay 20ms   (its distance 4 -> 20 ms)
#   Act 3  docker compose -f docker-compose.demo-d443a.yml exec gnb-netem tc qdisc add dev eth0 root netem delay 20ms
#            (all of the gNB's egress, N3 included: netem only, no prio qdisc or u32 classifier)
#   load   docker compose -f docker-compose.demo-d443a.yml kill -s USR1 eas-local   (EAS_LOCAL_ARGS="--load 5")
#   jobs   docker compose -f docker-compose.demo-d443a.yml exec ue sh -c 'nr-cli $(nr-cli --dump | head -1) -e "she-offload job count=10"'
#
# Mode: D443A_MODE=measured-budget (default) or static. EAS_LOCAL_ARGS adds
# eas-local's flags ("--load 5", the revert arm "--load 5 --no-kpi-patch").
# Every demo: block is in this file's configs (configs/demo-d443a/), none in the
# shared ones.
#
# Images: the core NFs with the 6G profile's features, eesd and smfd with
# --features demo-d443a-edge-budget, the default nr-gnb, and the demo UE image
# (nr-ue with demo-d443a-edge-budget, nr-cli, nr-she-eas, iproute2;
# deploy/eks/overlays/demo-d443a-edge-budget/Dockerfile.ue-d443a).
# NEXTGCORE_TAG / NEXTGSIM_TAG pick the tags (default latest), NEXTGSIM_DIR the
# nextgsim checkout.
#
# Usage:
#   docker compose -f docker-compose.demo-d443a.yml up -d
#   docker compose -f docker-compose.demo-d443a.yml logs -f ees eas-local ue
#   docker compose -f docker-compose.demo-d443a.yml down -v

name: nextg-demo-d443a

x-common: &common
  restart: on-failure:5
  environment: &common-env
    RUST_LOG: info
    RUST_BACKTRACE: 1
    # The local development profile, as in docker-compose.yml: cleartext h2c SBI.
    NEXTGCORE_SBI_PROFILE: "dev"
    TLS_ENABLED: "false"
    SBI_SCHEME: "http"
    # NF -> NRF over TLS (#1617): the trust anchor every NRF client verifies the
    # NRF against. Each mounts its own certificate volume tls-<name> at
    # /etc/nextgcore/certs (the sbi-tls service fills it).
    NEXTGCORE_NRF_TLS_CA: /etc/nextgcore/certs/ca.crt

x-nf-healthcheck: &nf-healthcheck
  healthcheck:
    test: ["CMD-SHELL", "kill -0 1"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 5s

services:
  # ==========================================================================
  # SBI TLS (#1617): the certificate source. A one-shot service that issues
  # the dev PKI (certs/generate-dev-certs.sh, from certs/nf-identities.txt)
  # into sbi_pki, then gives each NRF client below its own volume tls-<name>
  # with ca.crt, <name>.crt and <name>.key (0400, owned by that container's
  # user). Every NRF client depends on it. No network.
  # ==========================================================================
  sbi-tls:
    image: ${NEXTGCORE_IMAGE_PREFIX:-nextgcore-rust}/nrf:${NEXTGCORE_TAG:-latest}
    user: root
    restart: "no"
    network_mode: none
    entrypoint: ["bash", "/opt/sbi-tls/compose-tls-init.sh"]
    command: []
    healthcheck:
      disable: true
    environment:
      # nextgsim sidecars that drop to their own uid read their key as it.
      SBI_TLS_OWNERS: "eas-local=65531 eas-regional=65532 eas-cloud=65533"
    volumes:
      - ./certs:/opt/sbi-tls:ro
      - sbi_pki:/pki
      - tls-nrf:/tls/nrf
      - tls-ausf:/tls/ausf
      - tls-udm:/tls/udm
      - tls-udr:/tls/udr
      - tls-pcf:/tls/pcf
      - tls-nssf:/tls/nssf
      - tls-bsf:/tls/bsf
      - tls-amf:/tls/amf
      - tls-smf:/tls/smf
      - tls-ees-standin:/tls/ees-standin
      - tls-eas-local:/tls/eas-local
      - tls-eas-regional:/tls/eas-regional
      - tls-eas-cloud:/tls/eas-cloud
      - tls-eec:/tls/eec

  mongodb:
    image: mongo:6.0
    <<: *common
    environment:
      MONGO_INITDB_DATABASE: nextgcore
    volumes:
      - mongodb_data:/data/db
      - ../../docs/assets/webui/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      core:
        ipv4_address: 172.23.0.2
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nrf:
    image: ${NEXTGCORE_IMAGE_PREFIX:-nextgcore-rust}/nrf:${NEXTGCORE_TAG:-latest}
    <<: [*common, *nf-healthcheck]
    environment:
      <<: *common-env
      # Pinned to the URN of certs/nrf.crt (certs/nf-identities.txt, #1617).
      NEXTGCORE_NRF_INSTANCE_ID: 6b1d7e3c-0000-4000-8000-0000000000f0
    command: ["-c", "/etc/nextgcore/nrf.yaml", "--sbi-addr", "0.0.0.0"]
    volumes:
      - ./configs/demo-d443a/nrf.yaml:/etc/nextgcore/nrf.yaml:ro
      - d443a_cca:/etc/nextgcore/cca-trusted:ro
      - tls-nrf:/etc/nextgcore/certs:ro
    networks:
      core:
        ipv4_address: 172.23.0.10
    depends_on:
      sbi-tls:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy

  ausf:
    image: ${NEXTGCORE_IMAGE_PREFIX:-nextgcore-rust}/ausf:${NEXTGCORE_TAG:-latest}
    <<: [*common, *nf-healthcheck]
    environment:
      <<: *common-env
      UDM_SBI_ADDR: 172.23.0.12
      UDM_SBI_PORT: "7777"
      # Pinned to the URN of certs/ausf.crt (certs/nf-identities.txt, #1617).
      NEXTGCORE_AUSF_INSTANCE_ID: 6b1d7e3c-0000-4000-8000-00000000a05f
      NEXTGCORE_NRF_TLS_CLIENT_CERT: /etc/nextgcore/certs/ausf.crt
      NEXTGCORE_NRF_TLS_CLIENT_KEY: /etc/nextgcore/certs/ausf.key
    command: ["-c", "/etc/nextgcore/ausf.yaml"]
    volumes:
      - ./configs/5gc/ausf.yaml:/etc/nextgcore/ausf.yaml:ro
      - tls-ausf:/etc/nextgcore/certs:ro
    networks:
      core:
        ipv4_address: 172.23.0.11
    depends_on:
      sbi-tls:
        condition: service_completed_successfully
      nrf:
        condition: service_healthy
      udm:
        condition: service_healthy

  udm:
    image: ${NEXTGCORE_IMAGE_PREFIX:-nextgcore-rust}/udm:${NEXTGCORE_TAG:-latest}
    <<: [*common, *nf-healthcheck]
    environment:
      <<: *common-env
      UDR_SBI_ADDR: 172.23.0.20
      UDR_SBI_PORT: "7777"
      # Pinned to the URN of certs/udm.crt (certs/nf-identities.txt, #1617).
      NEXTGCORE_UDM_INSTANCE_ID: 6b1d7e3c-0000-4000-8000-000000000d10
      NEXTGCORE_NRF_TLS_CLIENT_CERT: /etc/nextgcore/certs/udm.crt
      NEXTGCORE_NRF_TLS_CLIENT_KEY: /etc/nextgcore/certs/udm.key
    command: ["-c", "/etc/nextgcore/udm.yaml"]
    volumes:
      - ./configs/5gc/udm.yaml:/etc/nextgcore/udm.yaml:ro
      - ./configs/5gc/hnet:/etc/nextgcore/hnet:ro
      - tls-udm:/etc/nextgcore/certs:ro
    networks:
      core:
        ipv4_address: 172.23.0.12
    depends_on:
      sbi-tls:
        condition: service_completed_successfully
      nrf:
        condition: service_healthy

  udr:
    image: ${NEXTGCORE_IMAGE_PREFIX:-nextgcore-rust}/udr:${NEXTGCORE_TAG:-latest}
    <<: [*common, *nf-healthcheck]
    environment:
      <<: *common-env
      # Pinned to the URN of certs/udr.crt (certs/nf-identities.txt, #1617).
      NEXTGCORE_UDR_INSTANCE_ID: 6b1d7e3c-0000-4000-8000-000000000d00
      NEXTGCORE_NRF_TLS_CLIENT_CERT: /etc/nextgcore/certs/udr.crt
      NEXTGCORE_NRF_TLS_CLIENT_KEY: /etc/nextgcore/certs/udr.key
    command: ["-c", "/etc/nextgcore/udr.yaml"]
    volumes:
      - ./configs/5gc/udr.yaml:/etc/nextgcore/udr.yaml:ro
      - tls-udr:/etc/nextgcore/certs:ro
    networks:
      core:
        ipv4_address: 172.23.0.20
    depends_on:
      sbi-tls:
        condition: service_completed_successfully
      nrf:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  pcf:
    image: ${NEXTGCORE_IMAGE_PREFIX:-nextgcore-rust}/pcf:${NEXTGCORE_TAG:-latest}
    <<: [*common, *nf-healthcheck]
    environment:
      <<: *common-env
      # Pinned to the URN of certs/pcf.crt (certs/nf-identities.txt, #1617).
      NEXTGCORE_PCF_INSTANCE_ID: 6b1d7e3c-0000-4000-8000-000000000cf0
      NEXTGCORE_NRF_TLS_CLIENT_CERT: /etc/nextgcore/certs/pcf.crt
      NEXTGCORE_NRF_TLS_CLIENT_KEY: /etc/nextgcore/certs/pcf.key
    command: ["-c", "/etc/nextgcore/pcf.yaml"]
    volumes:
      - ./configs/5gc/pcf.yaml:/etc/nextgcore/pcf.yaml:ro
      - tls-pcf:/etc/nextgcore/certs:ro
    networks:
      core:
        ipv4_address: 172.23.0.13
    depends_on:
      sbi-tls:
        condition: service_completed_successfully
      nrf:
        condition: service_healthy
      # #1457: pcfd opens its subscriber store at startup and refuses to start
      # without it.
      mongodb:
        condition: service_healthy

  nssf:
    image: ${NEXTGCORE_IMAGE_PREFIX:-nextgcore-rust}/nssf:${NEXTGCORE_TAG:-latest}
    <<: [*common, *nf-healthcheck]
    environment:
      <<: *common-env
      # Pinned to the URN of certs/nssf.crt (certs/nf-identities.txt, #1617).
      NEXTGCORE_NSSF_INSTANCE_ID: 6b1d7e3c-0000-4000-8000-0000000055f0
      NEXTGCORE_NRF_TLS_CLIENT_CERT: /etc/nextgcore/certs/nssf.crt
      NEXTGCORE_NRF_TLS_CLIENT_KEY: /etc/nextgcore/certs/nssf.key
    command: ["-c", "/etc/nextgcore/nssf.yaml"]
    volumes:
      - ./configs/5gc/nssf.yaml:/etc/nextgcore/nssf.yaml:ro
      - tls-nssf:/etc/nextgcore/certs:ro
    networks:
      core:
        ipv4_address: 172.23.0.14
    depends_on:
      sbi-tls:
        condition: service_completed_successfully
      nrf:
        condition: service_healthy

  bsf:
    image: ${NEXTGCORE_IMAGE_PREFIX:-nextgcore-rust}/bsf:${NEXTGCORE_TAG:-latest}
    <<: [*common, *nf-healthcheck]
    environment:
      <<: *common-env
      # Pinned to the URN of certs/bsf.crt (certs/nf-identities.txt, #1617).
      NEXTGCORE_BSF_INSTANCE_ID: 6b1d7e3c-0000-4000-8000-000000000b0f
      NEXTGCORE_NRF_TLS_CLIENT_CERT: /etc/nextgcore/certs/bsf.crt
      NEXTGCORE_NRF_TLS_CLIENT_KEY: /etc/nextgcore/certs/bsf.key
    command: ["-c", "/etc/nextgcore/bsf.yaml"]
    volumes:
      - ./configs/5gc/bsf.yaml:/etc/nextgcore/bsf.yaml:ro
      - tls-bsf:/etc/nextgcore/certs:ro
    networks:
      core:
        ipv4_address: 172.23.0.15
    depends_on:
      sbi-tls:
        condition: service_completed_successfully
      nrf:
        condition: service_healthy

  amf:
    image: ${NEXTGCORE_IMAGE_PREFIX:-nextgcore-rust}/amf:${NEXTGCORE_TAG:-latest}
    <<: [*common, *nf-healthcheck]
    environment:
      <<: *common-env
      RUST_LOG: info
      NEXTGCORE_AMF_INSTANCE_ID: 6b1d7e3c-0000-4000-8000-000000000af0
      AMF_SBI_ADDR: 172.23.0.5
      AMF_SBI_PORT: "7777"
      SMF_SBI_ADDR: 172.23.0.4
      SMF_SBI_PORT: "7777"
      AUSF_SBI_ADDR: 172.23.0.11
      AUSF_SBI_PORT: "7777"
      UDM_SBI_ADDR: 172.23.0.12
      UDM_SBI_PORT: "7777"
      PCF_SBI_ADDR: 172.23.0.13
      PCF_SBI_PORT: "7777"
      NEXTGCORE_NRF_TLS_CLIENT_CERT: /etc/nextgcore/certs/amf.crt
      NEXTGCORE_NRF_TLS_CLIENT_KEY: /etc/nextgcore/certs/amf.key
    # Every container interface, inside the private network only: no publish.
    command: ["-c", "/etc/nextgcore/amf.yaml", "--ngap-addr", "0.0.0.0:38412"]
    volumes:
      - ./configs/5gc/amf.yaml:/etc/nextgcore/amf.yaml:ro
      - tls-amf:/etc/nextgcore/certs:ro
    networks:
      core:
        ipv4_address: 172.23.0.5
    depends_on:
      sbi-tls:
        condition: service_completed_successfully
      nrf:
        condition: service_healthy
      ausf:
        condition: service_healthy
      udm:
        condition: service_healthy
      pcf:
        condition: service_healthy
      nssf:
        condition: service_healthy

  smf:
    image: ${NEXTGCORE_IMAGE_PREFIX:-nextgcore-rust}/smf:${NEXTGCORE_TAG:-latest}
    stop_grace_period: 45s
    <<: [*common, *nf-healthcheck]
    environment:
      <<: *common-env
      UPF_PFCP_ADDR: 172.23.0.7
      UPF_PFCP_PORT: "8805"
      SMF_PFCP_ADDR: 172.23.0.4
      SMF_SHUTDOWN_BUDGET_SECS: "43"
      UDM_SBI_ADDR: 172.23.0.12
      UDM_SBI_PORT: "7777"
      SMF_METRICS_PORT: "9090"
      D443A_MODE: ${D443A_MODE:-measured-budget}
      # Pinned to the URN of certs/smf.crt (certs/nf-identities.txt, #1617).
      NEXTGCORE_SMF_INSTANCE_ID: 6b1d7e3c-0000-4000-8000-0000000005f0
      NEXTGCORE_NRF_TLS_CLIENT_CERT: /etc/nextgcore/certs/smf.crt
      NEXTGCORE_NRF_TLS_CLIENT_KEY: /etc/nextgcore/certs/smf.key
    entrypoint: ["sh", "-c"]
    command:
      - >-
        sed "s/@MODE@/$$D443A_MODE/" /etc/nextgcore/smf.yaml.in >/tmp/smf.yaml &&
        exec nf-binary -c /tmp/smf.yaml
    volumes:
      - ./configs/demo-d443a/smf.yaml.in:/etc/nextgcore/smf.yaml.in:ro
      - tls-smf:/etc/nextgcore/certs:ro
    networks:
      core:
        ipv4_address: 172.23.0.4
    depends_on:
      sbi-tls:
        condition: service_completed_successfully
      nrf:
        condition: service_healthy
      pcf:
        condition: service_healthy
      amf:
        condition: service_healthy

  upf:
    image: ${NEXTGCORE_IMAGE_PREFIX:-nextgcore-rust}/upf:${NEXTGCORE_TAG:-latest}
    <<: *common
    privileged: true
    user: root
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      <<: *common-env
      RUST_LOG: info
      # #1455: no source NAT toward dn (the EAS sees the UE's address); UN6DM
      # (STAMP toward the endpoints smfd provisions) and QFQM (QMP with the gNB).
      UPF_NAT_EXCLUDE: 10.60.0.0/24
      UPF_N6_DELAY_MEASUREMENT: "true"
      UPF_QOS_FLOW_MONITORING: "true"
    # The EASes' own calls (eesd, the NRF) cross from dn to core through the UPF,
    # masqueraded to its core address; UE traffic into dn keeps its source
    # (UPF_NAT_EXCLUDE). Nothing is published: both networks stay internal.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        iptables -t nat -A POSTROUTING -s 10.60.0.0/24 -d 172.23.0.0/24 -j MASQUERADE &&
        exec nf-binary -c /etc/nextgcore/upf.yaml --pfcp-addr 172.23.0.7 --gtpu-addr 172.23.0.7
        --tun-ip 10.45.0.1 --tun-prefix 16 --pfcp-allowed-peers 172.23.0.4
    volumes:
      - ./configs/5gc/upf.yaml:/etc/nextgcore/upf.yaml:ro
    networks:
      core:
        ipv4_address: 172.23.0.7
      dn:
        ipv4_address: 10.60.0.2
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      smf:
        condition: service_healthy

  ees:
    image: ${NEXTGCORE_IMAGE_PREFIX:-nextgcore-rust}/ees:${NEXTGCORE_TAG:-latest}
    <<: *common
    environment:
      <<: *common-env
      D443A_MODE: ${D443A_MODE:-measured-budget}
      EES_METRICS_PORT: "9090"
      NEXTGCORE_METRICS_BIND: "172.23.0.31"
      NEXTGCORE_NRF_TLS_CLIENT_CERT: /etc/nextgcore/certs/ees-standin.crt
      NEXTGCORE_NRF_TLS_CLIENT_KEY: /etc/nextgcore/certs/ees-standin.key
    entrypoint: ["sh", "/etc/d443a/ees-entry.sh"]
    command: []
    volumes:
      - ./configs/demo-d443a/ees.yaml.in:/etc/nextgcore/ees.yaml.in:ro
      - ./configs/demo-d443a/ees-entry.sh:/etc/d443a/ees-entry.sh:ro
      - tls-ees-standin:/etc/nextgcore/certs:ro
    networks:
      core:
        ipv4_address: 172.23.0.31
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      sbi-tls:
        condition: service_completed_successfully
      nrf:
        condition: service_healthy
      smf:
        condition: service_healthy

  eas-local:
    image: ${NEXTGSIM_IMAGE_PREFIX:-nextgsim}-ue:${NEXTGSIM_TAG:-latest}
    <<: *common
    user: root
    cap_drop: [ALL]
    # NET_ADMIN: the route back to the UEs, and netem (the emulated distance).
    # SETUID, SETGID: setpriv's drop to this EAS's own uid; nr-she-eas runs with no
    # capabilities. Its listeners bind 10.60.0.11:8620 and :9471 (>= 1024). (No netns
    # here, so no SYS_ADMIN; no CHOWN, no SETPCAP, as on EKS.)
    cap_add: [NET_ADMIN, SETUID, SETGID]
    environment:
      RUST_LOG: info
      D443A_MODE: ${D443A_MODE:-measured-budget}
      EAS_ID: eas-local
      EAS_UID: "65531"
      EAS_DIST_MS: "4"
      EAS_IP: 10.60.0.11
      EAS_MR: "10"
      EAS_AVL: "50"
      EAS_NF_ID: 6b1d7e3c-0000-4000-8000-0000000471a1
      EAS_ARGS: ${EAS_LOCAL_ARGS:-}
      NEXTGCORE_NRF_TLS_CLIENT_CERT: /etc/nextgcore/certs/eas-local.crt
      NEXTGCORE_NRF_TLS_CLIENT_KEY: /etc/nextgcore/certs/eas-local.key
      NEXTGCORE_NRF_TLS_CA: /etc/nextgcore/certs/ca.crt
    entrypoint: ["sh", "/etc/d443a/eas-entry.sh"]
    command: []
    volumes:
      - ./configs/demo-d443a/eas-entry.sh:/etc/d443a/eas-entry.sh:ro
      - ./configs/demo-d443a/eas.yaml.in:/etc/d443a/eas.yaml.in:ro
      - d443a_cca:/var/lib/d443a/cca
      - tls-eas-local:/etc/nextgcore/certs:ro
    networks:
      dn:
        ipv4_address: 10.60.0.11
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      sbi-tls:
        condition: service_completed_successfully
      ees:
        condition: service_healthy
      upf:
        condition: service_healthy

  eas-regional:
    image: ${NEXTGSIM_IMAGE_PREFIX:-nextgsim}-ue:${NEXTGSIM_TAG:-latest}
    <<: *common
    user: root
    cap_drop: [ALL]
    # NET_ADMIN: the route back to the UEs, and netem (the emulated distance).
    # SETUID, SETGID: setpriv's drop to this EAS's own uid; nr-she-eas runs with no
    # capabilities. Its listeners bind 10.60.0.12:8620 and :9471 (>= 1024). (No netns
    # here, so no SYS_ADMIN; no CHOWN, no SETPCAP, as on EKS.)
    cap_add: [NET_ADMIN, SETUID, SETGID]
    environment:
      RUST_LOG: info
      D443A_MODE: ${D443A_MODE:-measured-budget}
      EAS_ID: eas-regional
      EAS_UID: "65532"
      EAS_DIST_MS: "6"
      EAS_IP: 10.60.0.12
      EAS_MR: "14"
      EAS_AVL: "50"
      EAS_NF_ID: 6b1d7e3c-0000-4000-8000-0000000471a2
      EAS_ARGS: ""
      NEXTGCORE_NRF_TLS_CLIENT_CERT: /etc/nextgcore/certs/eas-regional.crt
      NEXTGCORE_NRF_TLS_CLIENT_KEY: /etc/nextgcore/certs/eas-regional.key
      NEXTGCORE_NRF_TLS_CA: /etc/nextgcore/certs/ca.crt
    entrypoint: ["sh", "/etc/d443a/eas-entry.sh"]
    command: []
    volumes:
      - ./configs/demo-d443a/eas-entry.sh:/etc/d443a/eas-entry.sh:ro
      - ./configs/demo-d443a/eas.yaml.in:/etc/d443a/eas.yaml.in:ro
      - d443a_cca:/var/lib/d443a/cca
      - tls-eas-regional:/etc/nextgcore/certs:ro
    networks:
      dn:
        ipv4_address: 10.60.0.12
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      sbi-tls:
        condition: service_completed_successfully
      ees:
        condition: service_healthy
      upf:
        condition: service_healthy

  eas-cloud:
    image: ${NEXTGSIM_IMAGE_PREFIX:-nextgsim}-ue:${NEXTGSIM_TAG:-latest}
    <<: *common
    user: root
    cap_drop: [ALL]
    # NET_ADMIN: the route back to the UEs, and netem (the emulated distance).
    # SETUID, SETGID: setpriv's drop to this EAS's own uid; nr-she-eas runs with no
    # capabilities. Its listeners bind 10.60.0.13:8620 and :9471 (>= 1024). (No netns
    # here, so no SYS_ADMIN; no CHOWN, no SETPCAP, as on EKS.)
    cap_add: [NET_ADMIN, SETUID, SETGID]
    environment:
      RUST_LOG: info
      D443A_MODE: ${D443A_MODE:-measured-budget}
      EAS_ID: eas-cloud
      EAS_UID: "65533"
      EAS_DIST_MS: "40"
      EAS_IP: 10.60.0.13
      EAS_MR: "40"
      EAS_AVL: "200"
      EAS_NF_ID: 6b1d7e3c-0000-4000-8000-0000000471a3
      EAS_ARGS: ""
      NEXTGCORE_NRF_TLS_CLIENT_CERT: /etc/nextgcore/certs/eas-cloud.crt
      NEXTGCORE_NRF_TLS_CLIENT_KEY: /etc/nextgcore/certs/eas-cloud.key
      NEXTGCORE_NRF_TLS_CA: /etc/nextgcore/certs/ca.crt
    entrypoint: ["sh", "/etc/d443a/eas-entry.sh"]
    command: []
    volumes:
      - ./configs/demo-d443a/eas-entry.sh:/etc/d443a/eas-entry.sh:ro
      - ./configs/demo-d443a/eas.yaml.in:/etc/d443a/eas.yaml.in:ro
      - d443a_cca:/var/lib/d443a/cca
      - tls-eas-cloud:/etc/nextgcore/certs:ro
    networks:
      dn:
        ipv4_address: 10.60.0.13
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      sbi-tls:
        condition: service_completed_successfully
      ees:
        condition: service_healthy
      upf:
        condition: service_healthy

  gnb:
    image: ${NEXTGSIM_IMAGE_PREFIX:-nextgsim}-gnb:${NEXTGSIM_TAG:-latest}
    <<: *common
    environment:
      RUST_LOG: info
    command: ["-c", "/etc/d443a/gnb.yaml"]
    volumes:
      - ./configs/demo-d443a/gnb.yaml:/etc/d443a/gnb.yaml:ro
    networks:
      core:
        ipv4_address: 172.23.0.100
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      amf:
        condition: service_healthy
      upf:
        condition: service_healthy

  # Act 3's netem on the gNB's GTP-U egress: shares the gnb container's network
  # namespace, NET_ADMIN only, runs nothing until `tc` is exec'd in it.
  gnb-netem:
    image: ${NEXTGSIM_IMAGE_PREFIX:-nextgsim}-ue:${NEXTGSIM_TAG:-latest}
    restart: on-failure:5
    network_mode: service:gnb
    user: root
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    entrypoint: ["sh", "-c", "trap 'exit 0' TERM; while :; do sleep 3600 & wait $$!; done"]
    depends_on:
      gnb:
        condition: service_healthy

  ue:
    image: ${NEXTGSIM_IMAGE_PREFIX:-nextgsim}-ue:${NEXTGSIM_TAG:-latest}
    <<: *common
    environment:
      RUST_LOG: info,nr_ue=warn,nextgsim_ue::rrc=warn
      D443A_MODE: ${D443A_MODE:-measured-budget}
      NEXTGCORE_NRF_TLS_CLIENT_CERT: /etc/nextgcore/certs/eec.crt
      NEXTGCORE_NRF_TLS_CLIENT_KEY: /etc/nextgcore/certs/eec.key
      NEXTGCORE_NRF_TLS_CA: /etc/nextgcore/certs/ca.crt
    entrypoint: ["sh", "/etc/d443a/ue-entry.sh"]
    command: []
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${NEXTGSIM_DIR:-../../../nextgsim}/config:/etc/nextgsim:ro
      - ./configs/demo-d443a/ue-entry.sh:/etc/d443a/ue-entry.sh:ro
      - d443a_cca:/var/lib/d443a/cca
      - tls-eec:/etc/nextgcore/certs:ro
    networks:
      core:
        ipv4_address: 172.23.0.101
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      sbi-tls:
        condition: service_completed_successfully
      gnb:
        condition: service_healthy
      eas-local:
        condition: service_healthy

networks:
  core:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.23.0.0/24
          gateway: 172.23.0.1
  # The EAS data network (N6): the UPF and the three EASes only. No route off the host.
  dn:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.60.0.0/24
          gateway: 10.60.0.1

volumes:
  # #1617: the dev SBI PKI. sbi_pki holds the CA key and is mounted by the
  # sbi-tls service only; each tls-<name> holds one NF's certificate and key
  # and is mounted by that NF only (certs/compose-tls-init.sh).
  sbi_pki:
  tls-nrf:
  tls-ausf:
  tls-udm:
  tls-udr:
  tls-pcf:
  tls-nssf:
  tls-bsf:
  tls-amf:
  tls-smf:
  tls-ees-standin:
  tls-eas-local:
  tls-eas-regional:
  tls-eas-cloud:
  tls-eec:
  mongodb_data:
  d443a_cca:
