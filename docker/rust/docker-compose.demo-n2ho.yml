# Two-gNB N2 handover stack (nextgsim#456): the 5GC an N2 handover touches, two
# nextgsim gNBs (`gnb-west`, `gnb-east`) and one UE that walks from west to east.
#
# STANDALONE, NOT AN OVERLAY. Never combine it with docker-compose.yml (`-f a -f
# b`): the base file publishes host ports (127.0.0.1:7777, 38412/udp, 2152/udp,
# 8805/udp, 27017), and compose MERGES `ports:` lists, so they would leak into
# this stack, and two gNBs plus a UPF would then fight over host port 2152. This
# file publishes nothing; every service talks over the private bridge below,
# which is also `internal` (no route off the host). nextgsim's nightly asserts
# that `docker compose config` of this file has no published port.
#
# The two gNBs differ in every identity TS 38.413 §9.3.1.5/§9.3.1.7 needs to tell
# them apart, and share the TAC, so the handover is intra-AMF and intra-TA:
#
#   service   config (nextgsim/config/)  NCI    gNB ID  PCI  TAC  address
#   gnb-west  gnb.yaml                   0x010  1       16   1    172.23.0.100
#   gnb-east  gnb-n2ho-target.yaml       0x020  2       32   1    172.23.0.102
#
# The UE (ue-n2ho.yaml) hears both, starts 35 m from west, and 20 s after start
# walks east (`sim_movement`); past x 62 east's cell beats west's by the A3
# margin and west starts the N2 handover (TS 23.502 §4.9.1.3): Handover Required
# -> Handover Request / Acknowledge -> Handover Command -> Handover Notify.
#
# The addresses are the base stack's (the 5GC configs under configs/5gc/ and
# nextgsim's config/ name them), so this stack and docker-compose.yml cannot run
# at the same time on one host: their networks share 172.23.0.0/24.
#
# Prerequisites: the nextgcore-rust/* and nextgsim-{gnb,ue} images (./build.sh),
# and the nextgsim checkout beside this repo (NEXTGSIM_DIR overrides it).
#
# Usage:
#   docker compose -f docker-compose.demo-n2ho.yml up -d
#   docker compose -f docker-compose.demo-n2ho.yml logs -f amf gnb-west gnb-east
#   docker compose -f docker-compose.demo-n2ho.yml down -v

name: nextg-demo-n2ho

x-common: &common
  restart: on-failure:5
  environment: &common-env
    RUST_LOG: info
    RUST_BACKTRACE: 1
    # The local development profile, as in docker-compose.yml: cleartext h2c SBI.
    NEXTGCORE_SBI_PROFILE: "dev"
    TLS_ENABLED: "false"
    SBI_SCHEME: "http"

x-nf-healthcheck: &nf-healthcheck
  healthcheck:
    test: ["CMD-SHELL", "kill -0 1"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 5s

services:
  mongodb:
    image: mongo:6.0
    <<: *common
    environment:
      MONGO_INITDB_DATABASE: nextgcore
    volumes:
      - mongodb_data:/data/db
      - ../../docs/assets/webui/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      core:
        ipv4_address: 172.23.0.2
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nrf:
    image: nextgcore-rust/nrf:latest
    <<: [*common, *nf-healthcheck]
    command: ["-c", "/etc/nextgcore/nrf.yaml", "--sbi-addr", "0.0.0.0"]
    volumes:
      - ./configs/5gc/nrf.yaml:/etc/nextgcore/nrf.yaml:ro
    networks:
      core:
        ipv4_address: 172.23.0.10
    depends_on:
      mongodb:
        condition: service_healthy

  ausf:
    image: nextgcore-rust/ausf:latest
    <<: [*common, *nf-healthcheck]
    environment:
      <<: *common-env
      UDM_SBI_ADDR: 172.23.0.12
      UDM_SBI_PORT: "7777"
    command: ["-c", "/etc/nextgcore/ausf.yaml"]
    volumes:
      - ./configs/5gc/ausf.yaml:/etc/nextgcore/ausf.yaml:ro
    networks:
      core:
        ipv4_address: 172.23.0.11
    depends_on:
      nrf:
        condition: service_healthy
      udm:
        condition: service_healthy

  udm:
    image: nextgcore-rust/udm:latest
    <<: [*common, *nf-healthcheck]
    environment:
      <<: *common-env
      UDR_SBI_ADDR: 172.23.0.20
      UDR_SBI_PORT: "7777"
    command: ["-c", "/etc/nextgcore/udm.yaml"]
    volumes:
      - ./configs/5gc/udm.yaml:/etc/nextgcore/udm.yaml:ro
      - ./configs/5gc/hnet:/etc/nextgcore/hnet:ro
    networks:
      core:
        ipv4_address: 172.23.0.12
    depends_on:
      nrf:
        condition: service_healthy

  udr:
    image: nextgcore-rust/udr:latest
    <<: [*common, *nf-healthcheck]
    command: ["-c", "/etc/nextgcore/udr.yaml"]
    volumes:
      - ./configs/5gc/udr.yaml:/etc/nextgcore/udr.yaml:ro
    networks:
      core:
        ipv4_address: 172.23.0.20
    depends_on:
      nrf:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  pcf:
    image: nextgcore-rust/pcf:latest
    <<: [*common, *nf-healthcheck]
    command: ["-c", "/etc/nextgcore/pcf.yaml"]
    volumes:
      - ./configs/5gc/pcf.yaml:/etc/nextgcore/pcf.yaml:ro
    networks:
      core:
        ipv4_address: 172.23.0.13
    depends_on:
      nrf:
        condition: service_healthy

  nssf:
    image: nextgcore-rust/nssf:latest
    <<: [*common, *nf-healthcheck]
    command: ["-c", "/etc/nextgcore/nssf.yaml"]
    volumes:
      - ./configs/5gc/nssf.yaml:/etc/nextgcore/nssf.yaml:ro
    networks:
      core:
        ipv4_address: 172.23.0.14
    depends_on:
      nrf:
        condition: service_healthy

  bsf:
    image: nextgcore-rust/bsf:latest
    <<: [*common, *nf-healthcheck]
    command: ["-c", "/etc/nextgcore/bsf.yaml"]
    volumes:
      - ./configs/5gc/bsf.yaml:/etc/nextgcore/bsf.yaml:ro
    networks:
      core:
        ipv4_address: 172.23.0.15
    depends_on:
      nrf:
        condition: service_healthy

  amf:
    image: nextgcore-rust/amf:latest
    <<: [*common, *nf-healthcheck]
    environment:
      <<: *common-env
      RUST_LOG: info
      NEXTGCORE_AMF_INSTANCE_ID: 6b1d7e3c-0000-4000-8000-000000000af0
      AMF_SBI_ADDR: 172.23.0.5
      AMF_SBI_PORT: "7777"
      SMF_SBI_ADDR: 172.23.0.4
      SMF_SBI_PORT: "7777"
      AUSF_SBI_ADDR: 172.23.0.11
      AUSF_SBI_PORT: "7777"
      UDM_SBI_ADDR: 172.23.0.12
      UDM_SBI_PORT: "7777"
      PCF_SBI_ADDR: 172.23.0.13
      PCF_SBI_PORT: "7777"
    # Every container interface, inside the private network only: no publish.
    command: ["-c", "/etc/nextgcore/amf.yaml", "--ngap-addr", "0.0.0.0:38412"]
    volumes:
      - ./configs/5gc/amf.yaml:/etc/nextgcore/amf.yaml:ro
    networks:
      core:
        ipv4_address: 172.23.0.5
    depends_on:
      nrf:
        condition: service_healthy
      ausf:
        condition: service_healthy
      udm:
        condition: service_healthy
      pcf:
        condition: service_healthy
      nssf:
        condition: service_healthy

  smf:
    image: nextgcore-rust/smf:latest
    stop_grace_period: 45s
    <<: [*common, *nf-healthcheck]
    environment:
      <<: *common-env
      UPF_PFCP_ADDR: 172.23.0.7
      UPF_PFCP_PORT: "8805"
      SMF_PFCP_ADDR: 172.23.0.4
      SMF_SHUTDOWN_BUDGET_SECS: "43"
      UDM_SBI_ADDR: 172.23.0.12
      UDM_SBI_PORT: "7777"
    command: ["-c", "/etc/nextgcore/smf.yaml"]
    volumes:
      - ./configs/5gc/smf.yaml:/etc/nextgcore/smf.yaml:ro
    networks:
      core:
        ipv4_address: 172.23.0.4
    depends_on:
      nrf:
        condition: service_healthy
      pcf:
        condition: service_healthy
      amf:
        condition: service_healthy

  upf:
    image: nextgcore-rust/upf:latest
    <<: *common
    privileged: true
    user: root
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      <<: *common-env
      RUST_LOG: info
    command: ["-c", "/etc/nextgcore/upf.yaml", "--pfcp-addr", "172.23.0.7", "--gtpu-addr", "172.23.0.7", "--tun-ip", "10.45.0.1", "--tun-prefix", "16", "--pfcp-allowed-peers", "172.23.0.4"]
    volumes:
      - ./configs/5gc/upf.yaml:/etc/nextgcore/upf.yaml:ro
    networks:
      core:
        ipv4_address: 172.23.0.7
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      smf:
        condition: service_healthy

  # Source gNB: nextgsim config/gnb.yaml (NCI 0x010, gNB ID 1, 172.23.0.100).
  gnb-west:
    image: nextgsim-gnb:latest
    <<: *common
    environment:
      RUST_LOG: info
    command: ["-c", "/etc/nextgsim/gnb.yaml"]
    volumes:
      - ${NEXTGSIM_DIR:-../../../nextgsim}/config:/etc/nextgsim:ro
    networks:
      core:
        ipv4_address: 172.23.0.100
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      amf:
        condition: service_healthy
      upf:
        condition: service_healthy

  # Target gNB: nextgsim config/gnb-n2ho-target.yaml (NCI 0x020, gNB ID 2,
  # 172.23.0.102), 120 m east of west.
  gnb-east:
    image: nextgsim-gnb:latest
    <<: *common
    environment:
      RUST_LOG: info
    command: ["-c", "/etc/nextgsim/gnb-n2ho-target.yaml"]
    volumes:
      - ${NEXTGSIM_DIR:-../../../nextgsim}/config:/etc/nextgsim:ro
    networks:
      core:
        ipv4_address: 172.23.0.102
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      amf:
        condition: service_healthy
      upf:
        condition: service_healthy

  # The UE: nextgsim config/ue-n2ho.yaml, hearing both gNBs and walking west -> east.
  ue:
    image: nextgsim-ue:latest
    <<: *common
    environment:
      RUST_LOG: info
    command: ["-c", "/etc/nextgsim/ue-n2ho.yaml"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${NEXTGSIM_DIR:-../../../nextgsim}/config:/etc/nextgsim:ro
    networks:
      core:
        ipv4_address: 172.23.0.101
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      gnb-west:
        condition: service_healthy
      gnb-east:
        condition: service_healthy

networks:
  core:
    driver: bridge
    # No route off the host: nothing in this stack needs one.
    internal: true
    ipam:
      config:
        - subnet: 172.23.0.0/24
          gateway: 172.23.0.1

volumes:
  mongodb_data:
